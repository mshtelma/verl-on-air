# CPU-only gate: lint, the regression suite, and composition of every training job against the
# pinned verl. No GPU, no Databricks workspace, no secrets -- `make validate` (air --dry-run)
# needs workspace auth and is run locally instead.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: toolchain
        run: make dev-env
      - name: lint
        run: make lint
      - name: tests
        run: make test
      - name: compose every training job against pinned verl
        run: make compose-check
