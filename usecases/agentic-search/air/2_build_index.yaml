# =============================================================================
# BUILD the BIGGER Vector Search index (MuSiQue+HotpotQA+2Wiki union corpus) -- KICK OFF ONLY.
# Loads corpus_big.parquet into a UC Delta table (CDF on) and CREATES the Delta-Sync index with
# managed gte-large-en, then RETURNS immediately (--no-wait): a ~1M+ passage initial snapshot far
# exceeds a job window (the 507k build already timed out at 120m), so we poll to ONLINE in air/140.
# PREREQ: air/138 wrote corpus_big.parquet. Idempotent.
#
#   air run --file usecases/agentic-search/air/2_build_index.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-139-build-big-vs-index
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v8

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/agentic-search

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  QA_VS_CATALOG: main
  QA_VS_SCHEMA: mshtelma
  QA_VS_TABLE: wiki_qa_big_corpus
  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_CORPUS_OUT: /Volumes/main/mshtelma/verl/data/qa_musique/corpus_big.parquet
  QA_VS_EMBED_MODEL: databricks-gte-large-en

max_retries: 0
timeout_minutes: 60

command: |
  set -euo pipefail
  # This build job does NOT run vLLM, so installing databricks-vectorsearch (needed for index
  # create/sync management) is harmless here -- unlike the query-time jobs (smoke/baseline) which
  # run vLLM and must stay install-free (they query via REST + the preinstalled sdk).
  pip install -q databricks-vectorsearch || pip install -q databricks-vectorsearch
  python3 ${CODE_SOURCE_PATH}/usecases/agentic-search/create_vs_index.py --no-wait
