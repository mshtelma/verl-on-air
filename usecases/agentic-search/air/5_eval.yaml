# =============================================================================
# agentic-search -- EVAL JOB (trained checkpoint).
#
# Identical to 3_baseline_eval.yaml but serves a GRPO checkpoint (the HF export from
# 4_train.yaml) instead of the base model -> the EM difference vs the baseline is the
# result. Point MODEL_PATH + EVAL_MODEL_PATH at the checkpoint step you want (default
# global_step_40); override at submit for a specific step, e.g.:
#   air run -f usecases/agentic-search/air/5_eval.yaml -p df1 \
#     --override env_variables.MODEL_PATH=/Volumes/main/mshtelma/verl/ckpt/agentic-search-grpo/global_step_20/actor/model/huggingface \
#               env_variables.EVAL_MODEL_PATH=/Volumes/main/mshtelma/verl/ckpt/agentic-search-grpo/global_step_20/actor/model/huggingface \
#               env_variables.EVAL_OUT=/Volumes/main/mshtelma/verl/eval/agentic_search_trained_step20.json
# =============================================================================

experiment_name: verl-on-air-agentic-search-eval
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v8

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/agentic-search

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # Point at the trained checkpoint's HF export (override the step at submit).
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/agentic-search-grpo/global_step_40/actor/model/huggingface
  MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/agentic-search-grpo/global_step_40/actor/model/huggingface
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '32768'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: ${CODE_SOURCE_PATH}/usecases/agentic-search/eval.py

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'
  QA_VAL_PARQUET: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet

  EVAL_LIMIT: '200'               # same 200 dev Qs as the baseline (3_baseline_eval) for apples-to-apples
  EVAL_MAX_TURNS: '12'            # match training + the baseline eval
  EVAL_MAX_TOKENS: '512'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  QA_REWARD_METRIC: em
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/musique_trained.json
  EVAL_TRACE_OUT: /Volumes/main/mshtelma/verl/eval/musique_trained_traces.jsonl

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/engine/serve/serve_and_eval.sh
