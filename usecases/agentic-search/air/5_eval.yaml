# =============================================================================
# agentic-search -- EVAL JOB (trained checkpoint).
#
# Identical to 3_baseline_eval.yaml but serves a GRPO checkpoint (the HF export from
# 4_train.yaml) instead of the base model -> the EM difference vs the baseline is the
# result. The checkpoint is REQUIRED and has no default: name the step you want.
#   make search-eval CKPT=/Volumes/main/mshtelma/verl/ckpt/agentic-search-grpo/<RUN_ID>/global_step_20
# or by hand:
#   air run -f usecases/agentic-search/air/5_eval.yaml -p df1 \
#     --override env_variables.EVAL_MODEL_PATH=/Volumes/main/mshtelma/verl/ckpt/agentic-search-grpo/<RUN_ID>/global_step_20 \
#               env_variables.EVAL_OUT=/Volumes/main/mshtelma/verl/eval/agentic_search_trained_step20.json
# The launcher verifies the checkpoint (verl's completion manifest + every shard) before
# staging anything; with no EVAL_MODEL_PATH it lists the complete steps under EVAL_CKPT_ROOT.
# =============================================================================

experiment_name: verl-on-air-agentic-search-eval

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v9

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/agentic-search

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  VLLM_LOGGING_LEVEL: WARN

  # EVAL_MODEL_PATH: set at submit (see header) -- deliberately no default.
  EVAL_CKPT_ROOT: /Volumes/main/mshtelma/verl/ckpt/agentic-search-grpo   # where to list candidates
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '32768'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: ${CODE_SOURCE_PATH}/usecases/agentic-search/eval.py

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'
  QA_VAL_PARQUET: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet

  EVAL_LIMIT: '200'               # same 200 dev Qs as the baseline (3_baseline_eval) for apples-to-apples
  EVAL_MAX_TURNS: '12'            # match training + the baseline eval
  EVAL_MAX_TOKENS: '512'
  EVAL_MAX_CONT: '2'
  EVAL_FORCE_FINAL_ANSWER: '1'    # last turn: "answer now", reply started with <answer> (eval-only; recorded)
  TOOL_FORMAT: qwen3_coder        # = 4_train.yaml's parser
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  QA_REWARD_METRIC: em
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/musique_trained.json
  EVAL_TRACE_OUT: /Volumes/main/mshtelma/verl/eval/musique_trained_traces.jsonl

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/engine/serve/serve_and_eval.sh
