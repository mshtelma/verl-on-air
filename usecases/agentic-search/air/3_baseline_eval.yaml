# =============================================================================
# agentic-search -- EVAL JOB (baseline: the BASE model, before training).
#
# Serves base Qwen3.5-35B-A3B (vLLM, TP8) and runs the held-out agentic-search eval
# over MuSiQue dev: the SAME multi-turn tool loop + SAME rule-based EM scorer training
# uses (usecases/agentic-search/eval.py). Run this and 5_eval.yaml (the trained
# checkpoint) with identical settings -> the EM delta is the demo result.
# PREREQS: the dev set (1_prep_data.yaml) + the Vector Search index (2_build_index.yaml) ONLINE.
#
#   air run --file usecases/agentic-search/air/3_baseline_eval.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-agentic-search-baseline-eval
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v8

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/agentic-search

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '32768'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: ${CODE_SOURCE_PATH}/usecases/agentic-search/eval.py

  # The Vector Search index from 2_build_index.yaml. Same workspace as the job -> ambient
  # auth, so the tool needs no token and no pip install at query time.
  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'
  QA_VAL_PARQUET: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet

  EVAL_LIMIT: '200'
  EVAL_MAX_TURNS: '12'            # match the training turn budget so base vs trained is apples-to-apples
  EVAL_MAX_TOKENS: '512'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  QA_REWARD_METRIC: em
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/musique_base.json
  EVAL_TRACE_OUT: /Volumes/main/mshtelma/verl/eval/musique_base_traces.jsonl

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/engine/serve/serve_and_eval.sh
