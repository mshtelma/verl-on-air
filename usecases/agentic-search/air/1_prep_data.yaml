# =============================================================================
# MuSiQue (harder multi-hop) QUESTIONS + BIGGER union corpus prep.
# HotpotQA base was too easy (62% EM, air/134). Pivot (user 2026-09-20): harder questions
# (MuSiQue-Ans, built so single-hop retrieval shortcuts fail) AND a bigger corpus (union of
# MuSiQue + HotpotQA + 2Wiki contexts, deduped by content) so the gold no longer dominates
# retrieval. Writes to a NEW dir/table so the HotpotQA artifacts are untouched.
#   * train.parquet/test.parquet  = MuSiQue questions (scripts/prep_nq_hotpotqa_agentic.py)
#   * corpus_big.parquet          = union passages (scripts/qa_search/build_corpus.py)
# All three datasets are PUBLIC on HF; HF_TOKEN just avoids anon rate limits. 2Wiki uses a loader
# script (trust_remote_code, set in code).
#
#   air run --file usecases/agentic-search/air/1_prep_data.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-138-prep-musique-bigcorpus
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/agentic-search

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  HF_DATASETS_TRUST_REMOTE_CODE: '1'
  QA_HF_CACHE: /local_disk0/hf_cache

  # Questions = MuSiQue (harder). Corpus = union (bigger).
  QA_DATASETS: musique
  QA_TOOL_OUT_DIR: /Volumes/main/mshtelma/verl/data/qa_musique
  QA_PREP_TRAIN_LIMIT: '0'
  QA_PREP_VAL_LIMIT: '500'
  QA_CORPUS_DATASETS: musique,hotpotqa   # 2wiki dropped: xanhho mirror is a loader script, unsupported by this datasets version
  QA_CORPUS_OUT: /Volumes/main/mshtelma/verl/data/qa_musique/corpus_big.parquet
  QA_CORPUS_SPLITS: train,validation

secrets:
  HF_TOKEN: 'msh/hf_token'

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  python3 ${CODE_SOURCE_PATH}/usecases/agentic-search/prep_data.py
  python3 ${CODE_SOURCE_PATH}/usecases/agentic-search/build_corpus.py
