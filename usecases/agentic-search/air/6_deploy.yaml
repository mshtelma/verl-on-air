# =============================================================================
# agentic-search -- DEPLOYMENT JOB (SPEC / template -- does NOT auto-serve).
#
# How to serve the trained agent for real inference. Two supported paths:
#
#   (A) Databricks Model Serving  (recommended for production)
#       Register the checkpoint's HF export as a Unity Catalog model, then create a
#       Provisioned Throughput serving endpoint. The agent tool-loop (search over the
#       Vector Search index, usecases/agentic-search/tool.py) runs in your application
#       layer against that endpoint. Managed, autoscaling, UC-governed -- no air job.
#
#   (B) Self-hosted vLLM endpoint on AI Runtime  (quick internal demo)
#       Bring the checkpoint up as an OpenAI-compatible vLLM server on a GPU node (the
#       same engine the eval + judge use), then point a client at /v1.
#
# This file is intentionally a SPEC: real deployment specifics (endpoint name, scale,
# auth, the app-side agent loop) depend on your workspace. The default command just
# PRINTS the recipe; set SERVE=1 to actually bring up the reference vLLM endpoint (B).
#
#   air run --file usecases/agentic-search/air/6_deploy.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-agentic-search-deploy
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/agentic-search

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_USE_V1: '1'
  # The trained checkpoint's HF export (from 4_train.yaml); override the step at submit.
  MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/agentic-search-grpo/global_step_40/actor/model/huggingface
  SERVED_NAME: agentic-search
  SERVE_PORT: '8000'
  SERVE_TP: '8'
  SERVE: '0'          # '0' prints the deployment recipe and exits; '1' serves the vLLM endpoint (path B)

max_retries: 0
timeout_minutes: 60

command: |
  set -euo pipefail
  cat <<'EOF'
  [deploy] agentic-search -- deployment recipe

  (A) Databricks Model Serving (production):
      1. Register the HF export as a Unity Catalog model, e.g.
           import mlflow
           mlflow.register_model("${MODEL_PATH}", "main.mshtelma.agentic_search")
      2. Create a Provisioned Throughput serving endpoint on that model (UI or API).
      3. Run the agent tool-loop (usecases/agentic-search/tool.py over Databricks
         Vector Search) in your application against the endpoint's /v1 URL.

  (B) Self-hosted vLLM endpoint (internal demo): re-run this job with SERVE=1.
  EOF
  if [ "${SERVE:-0}" = "1" ]; then
    command -v vllm >/dev/null 2>&1 || export PATH="/opt/venv/bin:${PATH}"
    echo "[deploy] serving ${MODEL_PATH} as '${SERVED_NAME}' on :${SERVE_PORT} (TP=${SERVE_TP})"
    exec vllm serve "${MODEL_PATH}" \
      --served-model-name "${SERVED_NAME}" \
      --host 0.0.0.0 --port "${SERVE_PORT}" \
      --tensor-parallel-size "${SERVE_TP}" \
      --disable-custom-all-reduce --trust-remote-code
  fi
