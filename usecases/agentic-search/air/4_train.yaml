# =============================================================================
# agentic-search -- TRAINING JOB (GRPO, fully-async).
#
# Trains Qwen3.5-35B-A3B as a multi-hop search agent with GRPO. The model runs a
# multi-turn tool loop (search / read over a Databricks Vector Search index) and is
# rewarded by a RULE-BASED exact-match scorer -- NO judge (usecases/agentic-search/reward.py).
# The plugin seam is three env vars: FUNCTION_TOOL_PATH + CUSTOM_REWARD_PATH + the data.
#
# Topology: 2 nodes / 16xH100, fully-async (1 rollout node + 1 trainer node), judge-free.
# The headline lever is MAX_TURNS (the model's retrieval hop budget) -- see docs/tuning.md.
# Checkpoints (HF export) land at output_dir/<RUN_ID>/global_step_N/actor/model/huggingface/,
# which the eval job (5_eval.yaml) serves.
#
#   air run --file usecases/agentic-search/air/4_train.yaml -p df1 --watch \
#     --override env_variables.RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)   # (make sets RUN_ID for you)
# =============================================================================

experiment_name: verl-on-air-agentic-search-train

compute:
  num_accelerators: 16
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v9

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/agentic-search

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN

  # --- training mode + node roles -------------------------------------------
  # TRAIN_MODE is THE mode switch (docs/training-modes.md):
  #   async -> disjoint Rollouter/Trainer GPU pools, generation overlaps training
  #   sync  -> rollout and training co-located, strictly on-policy
  # TRAINING_NODES == the node count means "no judge nodes" -- this use case's reward
  # is a pure rule (exact match), so there is nothing to serve.
  TRAIN_MODE: async
  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  ROLLOUT_NNODES: '1'          # 1 whole node Rollouter + 1 node Trainer (async only; set 0 for sync)
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'
  ROLLOUT_PREFIX_CACHING: 'True'

  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  MULTI_TURN: 'True'
  MAX_TURNS: '12'                  # THE headline lever here: the agent's retrieval hop budget
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '4000'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/usecases/agentic-search/tool.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/usecases/agentic-search/reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: naive
  # Pure exact-match reward: no retrieval bonus. >0 adds a bonus when a retrieved
  # passage contained the gold answer -- we measured that as INERT here, because at
  # ~80% recall it fires on nearly every sample in a GRPO group and therefore lands in
  # the group mean it is subtracted against. Kept as a knob, documented in RESULTS.md.
  QA_RETRIEVAL_BONUS: '0.0'

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'

  SEED: '42'                   # data order + Megatron + vLLM sampling (unset = an unseeded order)
  SAVE_FREQ: '10'
  TEST_FREQ: '-1'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: agentic-search-grpo

max_retries: 0
timeout_minutes: 600

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/qa_musique/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/agentic-search-grpo
  total_epochs: 2
  ppo_mini_batch_size: 32
  rollout_n: 16
  total_rollout_steps: 3200
  max_prompt_length: 2048
  max_response_length: 512
  actor_lr: 2e-6

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/engine/train/dispatch_agentic.sh
