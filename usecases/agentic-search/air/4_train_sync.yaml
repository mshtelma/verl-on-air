# =============================================================================
# agentic-search -- TRAINING JOB, SYNCHRONOUS (co-located rollout + training).
#
# STATUS: CONFIG-VALIDATED ONLY. This composes against the pinned verl
# (scripts/compose_check.py) but has NOT run on GPUs; the measured result in
# RESULTS.md comes from the fully-async job (4_train.yaml). Treat a first run as an
# experiment, not a reproduction.
#
# Same tool, reward, data and hyperparameters as 4_train.yaml -- but switching the
# training mode is not one knob, so this is a separate recipe:
#   * NODES: sync co-locates generation and training on every GPU, and the 35B needs
#     Megatron-FSDP (ZeRO-3) without CPU offload across 32 GPUs to fit a step (the
#     ladder's rung 4, docs/sizing.md). All 4 nodes train: TRAINING_NODES=4 (leaving
#     it at 2 would turn 2 nodes into an LLM judge this use case does not have).
#   * BUDGET: async counts prompt groups (rollout.total_rollout_steps); sync counts
#     optimizer steps (parameters.total_training_steps). 4_train.yaml plans 3200 prompt
#     groups at 32 per weight sync = 100 syncs = 100 optimizer updates. The sync
#     equivalent is 100 steps x train_batch_size 32 = 3200 prompt groups (x rollout_n 16
#     = 51,200 trajectories), one update per step (ppo_mini_batch_size = train_batch_size).
#   * WHAT STILL DIFFERS, by construction: sync is strictly on-policy (no staleness),
#     and a failed group is dropped rather than retried; DATA_SHUFFLE=True matches the
#     async job's data order policy (shuffled), not its exact order.
#
#   air run --file usecases/agentic-search/air/4_train_sync.yaml -p df1 --watch \
#     --override env_variables.RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)   # (make sets RUN_ID for you)
# =============================================================================

experiment_name: verl-on-air-agentic-search-train-sync

compute:
  num_accelerators: 32          # 4 nodes x 8 H100, all training (co-located rollout)
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v9

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/agentic-search

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN

  # --- training mode + node roles -------------------------------------------
  TRAIN_MODE: sync
  TRAINING_NODES: '4'              # every node trains; no judge (the reward is a rule)
  ROLLOUT_NNODES: '0'              # sync co-locates the rollout -- no separate pool
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  # --- backend: the ladder's validated 35B co-located configuration (rung 4) ---
  MEGATRON_MODE: fsdp              # Megatron-FSDP (ZeRO-3)
  OFFLOAD: '0'
  TP: '1'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_ENFORCE_EAGER: '1'       # the sync launcher's workaround for vLLM's intra-node custom all-reduce crash
  ROLLOUT_GPU_MEM_UTIL: '0.35'
  DATA_SHUFFLE: 'True'

  MULTI_TURN: 'True'
  MAX_TURNS: '12'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '4000'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/usecases/agentic-search/tool.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/usecases/agentic-search/reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: naive
  QA_RETRIEVAL_BONUS: '0.0'

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'

  SEED: '42'                   # data order + Megatron + vLLM sampling (unset = an unseeded order)
  SAVE_FREQ: '10'
  TEST_FREQ: '-1'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: agentic-search-grpo-sync

max_retries: 0
timeout_minutes: 600

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/qa_musique/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/agentic-search-grpo-sync
  total_epochs: 2
  total_training_steps: 100        # = 4_train.yaml's 100 weight syncs (see header)
  train_batch_size: 32
  ppo_mini_batch_size: 32
  rollout_n: 16
  max_prompt_length: 2048
  max_response_length: 512
  actor_lr: 2e-6
  image_key: ''                    # text-only dataset

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/engine/train/dispatch_agentic.sh
