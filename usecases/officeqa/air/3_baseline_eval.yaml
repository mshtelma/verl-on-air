# Same controller, budgets, reward and fixed question set as checkpoint eval.
experiment_name: verl-on-air-officeqa-miles-baseline
compute:
  num_accelerators: 16
  accelerator_type: GPU_8xH100
environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v12-verl010-glmflash-fix1
code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
    - engine
    - usecases/officeqa
env_variables:
  JUDGE_NODES: '1'
  JUDGE_STAGE_TIMEOUT: '1800'
  JUDGE_MODEL: judge
  JUDGE_MAX_TOKENS: '4096'
  JUDGE_TIMEOUT: '90'
  JUDGE_RETRIES: '1'
  JUDGE_DEADLINE_S: '180'
  JUDGE_REASONING_EFFORT: low
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3-Flash
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_TP: '8'
  JUDGE_MAX_MODEL_LEN: '16384'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_HEALTH_TIMEOUT: '2400'
  JUDGE_MAX_LIFETIME: '3500'
  JUDGE_EXTRA_ARGS: --reasoning-parser glm47 --tool-call-parser glm47 --enable-auto-tool-choice
    --language-model-only --no-enable-flashinfer-autotune --disable-custom-all-reduce
    --enforce-eager
  JUDGE_TOKENIZER_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3-Flash
  OQ_DATA_DIR: /Volumes/main/mshtelma/verl/data/officeqa_miles/pilot-24bdbc023
  OQ_LOCAL_DIR: /local_disk0/officeqa-miles-pilot
  OQ_ARTIFACT_ROOT: /Volumes/main/mshtelma/verl/eval/officeqa
  OQ_MAX_TURNS: '12'
  OQ_MAX_GENERATION_TOKENS: '1024'
  OQ_TOOL_MAX_CHARS: '4000'
  OQ_COMPUTE_ALLOW_UNSANDBOXED: '0'
  OQ_COMPUTE_TIMEOUT_S: '15'
  OQ_COMPUTE_MEM_MB: '4096'
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  TRAINING_NODES: '1'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  TOOL_FORMAT: qwen3_coder
  SEED: '42'
  EVAL_SCRIPT: ${CODE_SOURCE_PATH}/usecases/officeqa/eval.py
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '36864'
  EVAL_GPU_UTIL: '0.8'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SERVE_EXTRA_ARGS: --enforce-eager --language-model-only
  EVAL_CONCURRENCY: '8'
  EVAL_TEMPERATURE: '1.0'
  EVAL_REQ_TIMEOUT: '300'
  EVAL_MAX_INFRA_ERRORS: '0'
  OQ_PROMPT_TOKENS: '2048'
  OQ_EVAL_TRAIN_LIMIT: '16'
  OQ_EVAL_HELDOUT_LIMIT: '8'
  OQ_EVAL_SAMPLES: '4'
  EVAL_EXPECT_N: '96'
max_retries: 0
timeout_minutes: 60
command: bash ${CODE_SOURCE_PATH}/usecases/officeqa/serve_eval.sh
