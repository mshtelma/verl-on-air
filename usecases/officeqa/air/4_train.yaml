# Bounded pilot: 8 prompt groups x 4 samples; 2 parameter syncs, both saved.
experiment_name: verl-on-air-officeqa-miles-pilot
compute:
  num_accelerators: 24
  accelerator_type: GPU_8xH100
environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v12-verl010-glmflash-fix1
code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
    - engine
    - usecases/officeqa
env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO
  VLLM_ENGINE_READY_TIMEOUT_S: '2400'
  TRAIN_MODE: async
  TRAINING_NODES: '2'
  JUDGE_NODES: '1'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  JUDGE_STAGE_TIMEOUT: '1800'
  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'
  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'
  MULTI_TURN: 'True'
  MAX_TURNS: '12'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '4'
  MAX_TOOL_RESPONSE_LEN: '4000'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/usecases/officeqa/tool.py
  REWARD_MANAGER: rate_limited
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/usecases/officeqa/reward.py
  CUSTOM_REWARD_NAME: compute_score
  NORM_ADV_BY_STD_IN_GRPO: 'True'
  REWARD_MAX_CONCURRENT: '16'
  REWARD_TIMEOUT: '240'
  JUDGE_MODEL: judge
  JUDGE_MAX_TOKENS: '4096'
  JUDGE_TIMEOUT: '90'
  JUDGE_RETRIES: '1'
  JUDGE_DEADLINE_S: '180'
  JUDGE_REASONING_EFFORT: low
  PRE_TRAIN_CHECK: ${CODE_SOURCE_PATH}/usecases/officeqa/judge_selfcheck.py
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3-Flash
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_TP: '8'
  JUDGE_MAX_MODEL_LEN: '16384'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_HEALTH_TIMEOUT: '2400'
  JUDGE_MAX_LIFETIME: '6900'
  JUDGE_EXTRA_ARGS: --reasoning-parser glm47 --tool-call-parser glm47 --enable-auto-tool-choice
    --language-model-only --no-enable-flashinfer-autotune --disable-custom-all-reduce
    --enforce-eager
  SEED: '42'
  SAVE_FREQ: '1'
  TEST_FREQ: '-1'
  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-35b-officeqa-miles-pilot
  LR_DECAY_STEPS: '16'
  OQ_DATA_DIR: /Volumes/main/mshtelma/verl/data/officeqa_miles/pilot-24bdbc023
  OQ_LOCAL_DIR: /local_disk0/officeqa-miles-pilot
  OQ_ARTIFACT_ROOT: /Volumes/main/mshtelma/verl/eval/officeqa
  OQ_MAX_TURNS: '12'
  OQ_MAX_GENERATION_TOKENS: '1024'
  OQ_TOOL_MAX_CHARS: '4000'
  OQ_COMPUTE_ALLOW_UNSANDBOXED: '0'
  OQ_COMPUTE_TIMEOUT_S: '15'
  OQ_COMPUTE_MEM_MB: '4096'
  JUDGE_TOKENIZER_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3-Flash
  AGENT_LOOP_CONFIG_PATH: ${CODE_SOURCE_PATH}/usecases/officeqa/agent_loops.yaml
max_retries: 0
timeout_minutes: 120
parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/officeqa_miles/pilot-24bdbc023/pilot_train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/officeqa_miles/pilot-24bdbc023/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-officeqa-miles-pilot
  total_epochs: 8
  ppo_mini_batch_size: 4
  rollout_n: 4
  total_rollout_steps: 8
  max_prompt_length: 2048
  max_response_length: 1024
  actor_lr: 1e-6
  image_key: ''
command: bash ${CODE_SOURCE_PATH}/usecases/officeqa/train.sh
