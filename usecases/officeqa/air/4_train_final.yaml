# Fresh fixed 100-update run on all 113 easy + 90 hard train questions; 1,600 trajectories.
experiment_name: verl010-officeqa-final-train
compute:
  num_accelerators: 16
  accelerator_type: GPU_8xH100
environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v13-verl010-officeqa-bm25
code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
    - engine
    - usecases/officeqa
env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO
  VLLM_ENGINE_READY_TIMEOUT_S: '2400'
  TRAIN_MODE: async
  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '4'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  MODEL_USE_REMOVE_PADDING: 'True'
  MODEL_USE_FUSED_KERNELS: 'True'
  ROLLOUT_GPU_MEM_UTIL: '0.7'
  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'
  MULTI_TURN: 'True'
  MAX_TURNS: '128'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '4'
  MAX_TOOL_RESPONSE_LEN: '8000'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/usecases/officeqa/tool.py
  REWARD_MANAGER: rate_limited
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/usecases/officeqa/reward.py
  CUSTOM_REWARD_NAME: compute_score
  NORM_ADV_BY_STD_IN_GRPO: 'True'
  REWARD_MAX_CONCURRENT: '16'
  REWARD_TIMEOUT: '900'
  PRE_TRAIN_CHECK: ${CODE_SOURCE_PATH}/usecases/officeqa/judge_selfcheck.py
  SEED: '42'
  SAVE_FREQ: '25'
  MAX_CKPT_TO_KEEP: '2'
  TEST_FREQ: '-1'
  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-35b-officeqa-final
  LR_DECAY_STEPS: '400'
  OQ_DATA_DIR: /Volumes/main/mshtelma/verl/data/officeqa_miles/final-t128-c98304-20261011-v1
  OQ_LOCAL_DIR: /local_disk0/officeqa-final
  OQ_ARTIFACT_ROOT: /Volumes/main/mshtelma/verl/eval/officeqa-final
  OQ_MAX_TURNS: '128'
  OQ_MAX_GENERATION_TOKENS: '4096'
  OQ_TOOL_MAX_CHARS: '8000'
  OQ_REQUIRE_BM25: '1'
  OQ_COMPUTE_ALLOW_UNSANDBOXED: '0'
  OQ_COMPUTE_TIMEOUT_S: '15'
  OQ_COMPUTE_MEM_MB: '4096'
  AGENT_LOOP_CONFIG_PATH: ${CODE_SOURCE_PATH}/usecases/officeqa/agent_loops.yaml
  JUDGE_NODES: '0'
  JUDGE_PROVIDER: databricks
  JUDGE_BASE_URL: https://dbc-559ffd80-2bfc.cloud.databricks.com/ai-gateway/mlflow/v1
  JUDGE_MODEL: system.ai.glm-5-3-flash
  JUDGE_TOKENIZER_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3-Flash
  JUDGE_MAX_MODEL_LEN: '65536'
  JUDGE_MAX_TOKENS: '4096'
  JUDGE_TIMEOUT: '180'
  JUDGE_RETRIES: '2'
  JUDGE_DEADLINE_S: '600'
  EPISODE_TOKEN_BUDGET: '98304'
  OQ_DATASET_NAME: officeqa-miles-final
  MAX_MODEL_LEN: '98304'
  OQ_TRAIN_SELECTION: official
max_retries: 0
timeout_minutes: 2160
parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/officeqa_miles/final-t128-c98304-20261011-v1/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/officeqa_miles/final-t128-c98304-20261011-v1/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-officeqa-final
  total_epochs: 10
  ppo_mini_batch_size: 4
  rollout_n: 4
  total_rollout_steps: 400
  max_prompt_length: 2048
  max_response_length: 4096
  actor_lr: 1e-6
  image_key: ''
command: bash ${CODE_SOURCE_PATH}/usecases/officeqa/train.sh
