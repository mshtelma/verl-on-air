# =============================================================================
# math -- EVAL JOB (step 3 of 5): the BASELINE, i.e. the "before" number.
#
# Measures the UNTRAINED base model on MATH-500 (500 problems from the MATH *test*
# split, disjoint from the L3-5 *train* data 1_prep_data.yaml writes), using the SAME
# agentic setup training uses: multi-turn + calculator tool, answer graded from
# \boxed{} by mathematical equivalence. 5_eval.yaml then runs the IDENTICAL job with
# EVAL_MODEL_PATH pointed at a checkpoint -- the difference is the result.
#
# RUN THE BASELINE FIRST, ALWAYS. It costs one node-hour and it is the only thing
# that makes a trained number mean anything. It also validates the whole eval path
# (serving, chat-template tool rendering, qwen3_coder parsing, the tool firing, the
# scorer) before you spend a 4-node training job.
#
# Single node / 8xH100: vLLM serves the model (TP8) and the async client
# (usecases/math/eval.py) drives the agentic loop against it -- both from
# engine/serve/serve_and_eval.sh, which is use-case-agnostic.
#
# As shipped this runs the FULL 500-problem baseline (EVAL_LIMIT=0, EVAL_EXPECT_N=500 --
# the run is invalid if any problem is missing). For a cheap harness smoke first (tools
# firing, answers parsed, plausible accuracy), override both, and write it somewhere else:
#
#   air run --file usecases/math/air/3_baseline_eval.yaml -p df1 --watch \
#     --override env_variables.EVAL_LIMIT=32 env_variables.EVAL_EXPECT_N=32 \
#                env_variables.EVAL_OUT=/Volumes/main/mshtelma/verl/eval/math500_base_smoke.json
#   air run --file usecases/math/air/3_baseline_eval.yaml -p df1 --watch   # the full baseline
#
# 5_eval.yaml must use the SAME settings, or the comparison is not apples-to-apples.
# =============================================================================

experiment_name: verl-on-air-math-baseline-eval

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v9

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/math

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  VLLM_LOGGING_LEVEL: WARN

  # model to serve (the eval's tokenizer follows it)
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_SCRIPT: ${CODE_SOURCE_PATH}/usecases/math/eval.py   # the held-out MATH-500 agentic eval
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '20480'         # room for up to 8 turns of MATH reasoning
  EVAL_STAGE: '1'                 # bulk-copy UC->/local_disk0 NVMe for fast load
  EVAL_HEALTH_TIMEOUT: '1800'

  # eval knobs
  MATH500_ID: HuggingFaceH4/MATH-500
  EVAL_LIMIT: '0'                # FULL 500-problem baseline
  EVAL_EXPECT_N: '500'           # anything else is an INVALID run (eval_contract)
  EVAL_MAX_TURNS: '8'           # > training's 4, deliberately: 4 cut the base model off before it boxed (recorded in eval_policy)
                                # (smoke sample 3 was ONE calculator call from 14/3). Same budget
                                # is applied to base AND trained, so the delta stays fair.
  EVAL_MAX_TOKENS: '3072'        # per-REQUEST cap (eval-only; training has one episode budget): CoT needs room to reach \boxed{}
  TOOL_FORMAT: qwen3_coder       # = 4_train.yaml's parser
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/math500_base.json

max_retries: 0
timeout_minutes: 90

command: |
  bash ${CODE_SOURCE_PATH}/engine/serve/serve_and_eval.sh
