# =============================================================================
# math -- JUDGE STAGING JOB (step 2 of 5): stage the reward model into UC, once.
#
# Only needed for the JUDGE-reward pattern. A rule-based use case
# (usecases/agentic-search) skips this step entirely.
#
# The trial judge is GLM-5.3-Flash: ~321B total / 18B active MoE, architecture
# Glm5NextForConditionalGeneration. Its pinned FP8 snapshot has ~328 GB of weights
# in 62 shards. Three facts shape this job:
#
#   * IT RIDES THE TRAINING IMAGE. The trial uses released vLLM 0.30.0 and
#     Transformers 5.16.1; the image gates check Flash's actual config and registry.
#     Standard vLLM 0.29 lacks this architecture. Verify GPU serving/calibration
#     with infra/diagnostics/air/glm_flash_judge.yaml before training.
#   * ONE JUDGE NODE. Native FP8 fits the 640 GB aggregate memory of 8xH100,
#     so the trial targets 24 GPUs (2 training nodes + 1 judge, TP=8).
#   * STAGE IT ONCE. Pulling 328 GB per run would dominate the job's cost. Staging
#     is RESUMABLE: later submissions skip shards whose CONTENT hash already matches
#     the Hub's. Each attempt has no automatic retries and a bounded timeout.
#
# Mechanism is the shared engine/stage_model.py (per-shard HF download to NVMe
# scratch, then sequential FUSE copy to the Volume). 1xA10 -- pure network + disk.
# HF_HUB_DISABLE_XET=1 because UC Volumes FUSE rejects Xet/CAS parallel range writes.
#
# SWAPPING THE JUDGE: change MODEL_ID + MODEL_DIR here and JUDGE_MODEL_PATH/JUDGE_TP
# in 4_train.yaml. A smaller judge that fits one node makes this a 3-node job.
#
#   air run --file usecases/math/air/2_stage_judge.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-math-stage-glmflash

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  version: '5'
  dependencies:
    - huggingface_hub>=0.34
    - hf_transfer

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/math

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  HF_HUB_DISABLE_XET: '1'         # UC Volumes FUSE rejects Xet/CAS parallel range writes
  OPENSSL_FORCE_FIPS_MODE: '0'
  MODEL_ID: zai-org/GLM-5.3-Flash
  MODEL_REVISION: eb9eb208eb0d988989d07a6a12d0fdeb5f52574a
  MODEL_DIR: /Volumes/main/mshtelma/verl/models/GLM-5.3-Flash
  SCRATCH_DIR: /local_disk0/hf_stage

max_retries: 0               # a later submission can resume; each attempt is bounded
timeout_minutes: 60          # at most 1 A10 GPU-hour; use STAGED.json to verify completion

command: python3 ${CODE_SOURCE_PATH}/engine/stage_model.py
