# =============================================================================
# AGENTIC STEP 2b — stage the JUDGE model (GLM-5.3 non-Flash, FP8) into UC, once.
#
# GLM-5.3 (zai-org/GLM-5.3): 744B total / ~40B active MoE, arch =
# GlmMoeDsaForCausalLM (SAME base as GLM-5.2 -- DeepSeek Sparse Attention +
# IndexShare + MTP; gains over 5.2 are post-training only). The DEFAULT repo is
# native FP8 (~744 GB, 141 shards; BF16 lives at zai-org/GLM-5.3-BF16).
#
# WHY THIS SERVES WITH ZERO REBUILD: vLLM recipes pin min vLLM 0.23.0 for the
# GLM-5.x GlmMoeDsa family, and our training image (v5) ships vLLM 0.24.0 whose
# registry already lists GlmMoeDsaForCausalLM (probe air/98b). So the judge rides
# the SAME image as training -- no torch-2.13/vLLM-0.27 re-base. (Only GLM-5.3-
# *Flash*, model_type glm5_next, needs vLLM 0.27+; that is a different arch.)
#
# WHY TP16 / 2 NODES: 744 GB FP8 does NOT fit one 8xH100 node (640 GB) and df1
# has NO H200 (accelerator types = A10 / 8xH100 / 1xH100 only). So the judge
# serves at TP16 across 2x 8xH100 (air/52c de-risk, then air/53). Staged ONCE to
# UC here so serve-flag / TP16 iteration never re-pulls 744 GB.
#
# Same mechanism as air/51 (stage_model.py: per-shard HF download to NVMe
# scratch, then sequential FUSE copy; RESUMABLE -- a retry skips already-staged
# shards by exact byte size). Runs on 1xA10 (pure network + disk).
# HF_HUB_DISABLE_XET=1: UC Volumes FUSE rejects Xet/CAS parallel range writes.
#
#   air run --file usecases/math/air/2_stage_judge.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-51b-stage-judge-glm53
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  version: '5'
  dependencies:
    - huggingface_hub>=0.34
    - hf_transfer

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/math

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  HF_HUB_DISABLE_XET: '1'         # UC Volumes FUSE rejects Xet/CAS parallel range writes
  OPENSSL_FORCE_FIPS_MODE: '0'
  MODEL_ID: zai-org/GLM-5.3
  MODEL_DIR: /Volumes/main/mshtelma/verl/models/GLM-5.3
  SCRATCH_DIR: /local_disk0/hf_stage

max_retries: 3               # resumable; a retry skips already-staged shards
timeout_minutes: 600         # ~744 GB over download + sequential FUSE copy

command: python3 ${CODE_SOURCE_PATH}/engine/stage_model.py
