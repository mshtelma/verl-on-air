# Stage the pinned 2B actor and prepare an isolated MATH levels 1-3 dataset.
# This is network/CPU work; the training and evaluation jobs use one H100 node.
experiment_name: verl010-small-math-prep
compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10
environment:
  version: '5'
  dependencies:
    - datasets==5.0.1
    - fsspec==2026.6.0
    - huggingface_hub==1.33.0
    - pyarrow==25.0.1
    - aiohttp==3.14.3
    - databricks-sdk==0.146.0
code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/math
env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_DISABLE_XET: '1'
  OPENSSL_FORCE_FIPS_MODE: '0'
  MODEL_ID: Qwen/Qwen3.5-2B
  MODEL_REVISION: 15852e8c16360a2fea060d615a32b45270f8a8fc
  MODEL_DIR: /Volumes/main/mshtelma/verl/models/small_math_15852e8c/Qwen3.5-2B
  MATH_TOOL_OUT_DIR: /Volumes/main/mshtelma/verl/data/math_tool_2b_l1-3
  MATH_LEVELS: '1,2,3'
  ALLOW_FALLBACK_SOURCE: '1'   # only the existing content-verified MATH mirror
  # Prove ambient AIR credentials and the actual reward client before H100 startup.
  JUDGE_PROVIDER: databricks
  JUDGE_BASE_URL: https://dbc-559ffd80-2bfc.cloud.databricks.com/serving-endpoints
  JUDGE_MODEL: databricks-glm-5-3-flash
  JUDGE_MAX_TOKENS: '4096'
  JUDGE_TIMEOUT: '50'
  JUDGE_RETRIES: '1'
  JUDGE_DEADLINE_S: '110'
  JUDGE_TEMPERATURE: '0'
  JUDGE_DISABLE_THINKING: '0'
  JUDGE_REASONING_EFFORT: low
max_retries: 0
timeout_minutes: 30
command: |
  set -e
  python3 ${CODE_SOURCE_PATH}/engine/stage_model.py
  python3 ${CODE_SOURCE_PATH}/usecases/math/prep_data.py
  python3 ${CODE_SOURCE_PATH}/usecases/math/judge_selfcheck.py
