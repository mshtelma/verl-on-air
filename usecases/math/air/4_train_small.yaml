# Four-update feasibility pilot, 32 prompt groups x 4 trajectories = 128 episodes.
# One 8xH100 node: four actor/reference GPUs and four TP1 rollout replicas.
# The judge is an existing workspace API, with no judge GPUs in this job.
experiment_name: verl010-small-math-train
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100
environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v13-verl010-officeqa-bm25
code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/math
env_variables:
  HF_HOME: /tmp/hf
  TOKENIZERS_PARALLELISM: 'false'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN
  TRAIN_MODE: async
  TRAINING_NODES: '1'
  JUDGE_NODES: '0'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  ROLLOUT_NNODES: '0'
  N_GPUS_ROLLOUT: '4'
  TP: '1'
  PP: '1'
  CP: '1'
  EP: '1'
  ETP: '1'
  GEN_TP: '1'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.70'
  ROLLOUT_ENFORCE_EAGER: 'True'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  ROLLOUT_PREFIX_CACHING: 'True'
  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'
  MULTI_TURN: 'True'
  MAX_TURNS: '4'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '4'
  MAX_TOOL_RESPONSE_LEN: '512'
  MAX_MODEL_LEN: '8192'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/usecases/math/tool.py
  REWARD_MANAGER: rate_limited
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/usecases/math/reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_SOURCE: judge
  NORM_ADV_BY_STD_IN_GRPO: 'True'
  # Limits are per reward worker (upstream defaults to eight workers).
  REWARD_MAX_CONCURRENT: '1'
  REWARD_MAX_RPM: '30'
  REWARD_MAX_TPM: '200000'
  REWARD_TIMEOUT: '120'
  JUDGE_PROVIDER: databricks
  JUDGE_BASE_URL: https://dbc-559ffd80-2bfc.cloud.databricks.com/serving-endpoints
  JUDGE_MODEL: databricks-glm-5-3-flash
  JUDGE_MAX_TOKENS: '4096'
  JUDGE_TRAJECTORY_CHARS: '40000'
  JUDGE_TIMEOUT: '50'
  JUDGE_RETRIES: '1'
  JUDGE_DEADLINE_S: '110'
  JUDGE_TEMPERATURE: '0'
  JUDGE_DISABLE_THINKING: '0'
  JUDGE_REASONING_EFFORT: low
  JUDGE_FALLBACK: zero
  JUDGE_MAX_FAIL_RATE: '0'
  JUDGE_FAIL_MIN_CALLS: '1'
  PRE_TRAIN_CHECK: ${CODE_SOURCE_PATH}/usecases/math/judge_selfcheck.py
  SEED: '42'
  LR_DECAY_STEPS: '32'
  SAVE_FREQ: '2'
  TEST_FREQ: '-1'
  MAX_CKPT_TO_KEEP: '2'
  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-2b-math-hosted-glmflash
max_retries: 0
timeout_minutes: 45
parameters:
  model_name: /Volumes/main/mshtelma/verl/models/small_math_15852e8c/Qwen3.5-2B
  train_files: /Volumes/main/mshtelma/verl/data/math_tool_2b_l1-3/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/math_tool_2b_l1-3/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-2b-math-hosted-glmflash
  total_epochs: 1
  total_rollout_steps: 32
  ppo_mini_batch_size: 8
  rollout_n: 4
  max_prompt_length: 1024
  max_response_length: 1024
  actor_lr: 1e-6
command: bash ${CODE_SOURCE_PATH}/engine/train/dispatch_agentic.sh
