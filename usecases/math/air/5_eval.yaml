# =============================================================================
# math -- EVAL JOB (trained checkpoint) on MATH-500.
#
# Identical to 3_baseline_eval.yaml but serves a GRPO checkpoint (the HF export from
# 4_train.yaml) instead of the base model -> the accuracy difference vs the baseline
# is the result. Same agentic setup (multi-turn + calculator tool, \boxed{} scored by
# mathematical equivalence). Point MODEL_PATH + EVAL_MODEL_PATH at the checkpoint step;
# override at submit for a specific step, e.g.:
#   air run -f usecases/math/air/5_eval.yaml -p df1 \
#     --override env_variables.MODEL_PATH=/Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-math-rl/global_step_24/actor/model/huggingface \
#               env_variables.EVAL_MODEL_PATH=/Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-math-rl/global_step_24/actor/model/huggingface \
#               env_variables.EVAL_OUT=/Volumes/main/mshtelma/verl/eval/math500_trained_step24.json
# =============================================================================

experiment_name: verl-on-air-math-eval

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v8

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/math

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # Point at the trained checkpoint's HF export (from 4_train.yaml); override the step at submit.
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-math-rl/global_step_36/actor/model/huggingface
  MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-math-rl/global_step_36/actor/model/huggingface
  EVAL_SCRIPT: ${CODE_SOURCE_PATH}/usecases/math/eval.py   # the held-out MATH-500 agentic eval
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '20480'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  MATH500_ID: HuggingFaceH4/MATH-500
  EVAL_LIMIT: '0'                # full 500-problem eval (same as the baseline)
  EVAL_MAX_TURNS: '8'            # match the baseline eval so base vs trained is apples-to-apples
  EVAL_MAX_TOKENS: '3072'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/math500_trained.json

max_retries: 0
timeout_minutes: 90

command: |
  bash ${CODE_SOURCE_PATH}/engine/serve/serve_and_eval.sh
