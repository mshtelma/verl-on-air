# =============================================================================
# THE REAL TRAINING RUN for the held-out-benchmark deliverable: air/57 (fully-async
# GRPO on Qwen3.5-35B-A3B, multi-turn calculator tool-agent, GLM-5.3 LLM-judge, on
# competition MATH L3-5) with CHECKPOINT SAVING ON, so the trained model can be
# scored on MATH-500 (scripts/serve_and_eval.sh, EVAL_MODEL_PATH=<ckpt>) and compared
# to the base model's baseline (run 423505733900248). The delta = the deliverable.
#
# CHANGED vs air/57 (everything else is VERBATIM the proven air/53/air/57 config):
#   (1) SAVE_FREQ on -> verl saves a full-gather HF checkpoint every SAVE_FREQ global
#       steps under output_dir/global_step_N/. The 35B HF export was DE-RISKED first
#       on the cheap 2-node air/60 (SAVE_FREQ=1) -- it also revealed the exact
#       global-step count for total_rollout_steps=768, which fixes SAVE_FREQ so the
#       FINAL step is always a save point (never finish with zero checkpoints) and a
#       couple of intermediate checkpoints exist (base -> mid -> final = a learning
#       curve on the benchmark, and insurance if the job hits its timeout backstop).
#   (2) own output_dir (keeps these checkpoints separate; the exit-guard's PRE_CKPTS
#       snapshot still prevents crediting a stale global_step_* as success).
#
# PREREQS: air/60 de-risk GREEN (35B HF save works, no OOM) + GLM-5.3 staged (air/51b)
# + MATH tool-agent data (air/56) + 35B model + MATH-500 baseline in hand (air/58).
#
#   air run --file usecases/math/air/4_train.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-59-qwen3_5-35b-agentic-judge-math-save
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 32          # 4 nodes x 8 H100 (2 training + 2 judge)
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/math

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # --- dispatcher: which ranks train vs serve the judge --------------------
  TRAINING_NODES: '2'                              # ranks 0-1 train; 2-3 judge
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  JUDGE_WAIT_TIMEOUT: '2400'                       # training waits this long for the judge endpoint

  # --- training topology (VERBATIM from the validated air/31 / air/53) -----
  ROLLOUT_NNODES: '1'          # 1 whole node Rollouter + 1 node Trainer (of the 2 training nodes)
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'                  # 1 vLLM replica, TP8 intra-node (NVLink)
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'

  # --- fully-async: STALENESS 0.5 for train||gen||judge overlap ------------
  TRIGGER_SYNC_STEP: '2'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.5'
  PARTIAL_ROLLOUT: 'True'

  # --- agentic multi-turn tool-calling (the calculator @function_tool) -----
  MULTI_TURN: 'True'
  MAX_TURNS: '4'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '512'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/usecases/math/tool.py    # the calculator @function_tool

  # --- LLM-judge reward via verl's rate_limited manager --------------------
  REWARD_MANAGER: rate_limited
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/usecases/math/reward.py  # the GLM-judge reward
  CUSTOM_REWARD_NAME: compute_score
  REWARD_SOURCE: judge         # optimise the judge's 0..1 score; rule = validation/fallback
  REWARD_MAX_CONCURRENT: '64'
  REWARD_TIMEOUT: '120'

  # --- judge CLIENT knobs (judge_reward.py, runs in the reward-loop actors) -
  JUDGE_MODEL: judge
  JUDGE_MAX_TOKENS: '4096'
  JUDGE_TIMEOUT: '90'
  JUDGE_TEMPERATURE: '0'
  JUDGE_DEBUG: '0'

  # --- judge SERVER knobs (serve_judge.sh, ranks 2-3) ----------------------
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_MAX_MODEL_LEN: '16384'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_HEALTH_TIMEOUT: '2400'
  JUDGE_MAX_LIFETIME: '28200'
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  # --- THE CHANGE: enable checkpoint saving --------------------------------
  # verl saves a full-gather HF checkpoint under output_dir/global_step_N/ every
  # SAVE_FREQ *global (optimizer) steps*. VALUE PENDING air/60: set it to divide the
  # revealed total global-step count so the LAST step is always a save (never end with
  # zero checkpoints) and 1-2 intermediates exist. Provisional 12 assumes ~48 global
  # steps for total_rollout_steps=768 (-> saves at 12/24/36/48); CONFIRM before launch.
  SAVE_FREQ: '12'
  TEST_FREQ: '-1'              # no in-loop val (fully-async val UNVALIDATED); we eval the saved ckpt out-of-band

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-35b-agentic-judge-math-save

max_retries: 0
timeout_minutes: 480

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/math_tool/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/math_tool/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-math-rl
  total_epochs: 15
  ppo_mini_batch_size: 16
  rollout_n: 4
  total_rollout_steps: 768
  max_prompt_length: 1024
  max_response_length: 1024
  actor_lr: 1e-6

command: |
  bash ${CODE_SOURCE_PATH}/engine/train/dispatch_agentic.sh
