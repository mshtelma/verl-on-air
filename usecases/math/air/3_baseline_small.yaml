# Full MATH-500 baseline; use the same fixed policy after training.
experiment_name: verl010-small-math-baseline
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100
environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v13-verl010-officeqa-bm25
code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - usecases/math
env_variables:
  HF_HOME: /tmp/hf
  TOKENIZERS_PARALLELISM: 'false'
  VLLM_LOGGING_LEVEL: WARN
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/small_math_15852e8c/Qwen3.5-2B
  EVAL_SCRIPT: ${CODE_SOURCE_PATH}/usecases/math/eval.py
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '16384'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '900'
  EVAL_SERVE_EXTRA_ARGS: --enforce-eager --language-model-only
  MATH500_ID: HuggingFaceH4/MATH-500
  EVAL_LIMIT: '0'
  EVAL_EXPECT_N: '500'
  EVAL_MAX_TURNS: '4'
  EVAL_MAX_TOKENS: '1024'
  EVAL_MAX_CONT: '1'
  TOOL_FORMAT: qwen3_coder
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '16'
max_retries: 0
timeout_minutes: 60
command: |
  set -e
  bash ${CODE_SOURCE_PATH}/engine/serve/serve_and_eval.sh
  python3 ${CODE_SOURCE_PATH}/usecases/math/export_run.py --eval-out "${EVAL_OUT}"
