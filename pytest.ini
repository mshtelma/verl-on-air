[pytest]
testpaths = tests usecases
# Two use cases both ship a reward.py/tool.py/eval.py, so test modules must not be
# imported by bare name; tests load use-case code through tests/support.py instead.
addopts = --import-mode=importlib -ra
filterwarnings =
    # verl's prime_math times each sympy comparison in a forked child
    # (verl.utils.py_functional.timeout_limit) -- the same fork it does in production.
    ignore:This process .* is multi-threaded, use of fork\(\) may lead to deadlocks:DeprecationWarning
