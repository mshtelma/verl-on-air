# =============================================================================
# STEP 3 — does this dataset carry usable GRPO signal for this model?
#
# Rollout only, no training. Reports the number that actually matters:
#
#     fraction of groups with NON-ZERO reward variance
#
# GRPO normalises reward within each group of `n` samples, so a group where all
# n samples score the same yields advantage 0 and contributes NO gradient.
# That fraction *is* your effective batch size. pass@1 alone tells you nothing.
#
# Run this before committing to a dataset for the real training run.
#
#   air run --file infra/geo3k/air/2_baseline.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-03-baseline-eval

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v8

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - infra/geo3k

env_variables:
  HF_HOME: /tmp/hf
  OPENSSL_FORCE_FIPS_MODE: '0'
  VLLM_LOGGING_LEVEL: WARN
  VLLM_USE_V1: '1'
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_FILE: /Volumes/main/mshtelma/verl/data/geo3k/test.parquet
  N_SAMPLES: '5'      # match rollout_n so the measurement transfers
  N_PROMPTS: '64'
  TEMPERATURE: '1.0'  # match rollout sampling; temperature 0 would fake variance to 0
  GEN_TP: '8'
  GPU_MEM_UTIL: '0.85'

max_retries: 0
timeout_minutes: 90

command: python3 ${CODE_SOURCE_PATH}/infra/geo3k/baseline_eval.py
