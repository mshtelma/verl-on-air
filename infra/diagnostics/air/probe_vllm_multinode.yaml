# =============================================================================
# Cheap 1xA10 probe: pick the multi-node vLLM serving fix for the GLM-5.3 judge
# after air/52c hit vllm#45318 (ray 2.58.0 too new for vLLM 0.24's ray executor).
# Reveals whether vLLM 0.24 has native mp multi-node (--headless) and whether
# PyPI is reachable for a ray downgrade. No real GPU work (~2-3 min).
#
#   air run --file infra/diagnostics/air/probe_vllm_multinode.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-98c-probe-vllm-multinode
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - infra/diagnostics

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'

max_retries: 0
timeout_minutes: 20

command: bash ${CODE_SOURCE_PATH}/infra/diagnostics/probe_vllm_multinode.sh
