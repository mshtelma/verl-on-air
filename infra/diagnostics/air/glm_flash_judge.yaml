# GLM-5.3-Flash qualification before the 24-GPU math job.
# One 8xH100 judge, TP8. Stage the pinned FP8 snapshot with math/2_stage_judge first.
# No retries; 40-minute limit = at most 5.34 H100 GPU-hours per attempt.
experiment_name: verl-on-air-glmflash-judge-qualification

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v12-verl010-glmflash-fix1

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - infra/diagnostics
      - usecases/math

env_variables:
  HF_HOME: /tmp/hf
  TOKENIZERS_PARALLELISM: 'false'
  VLLM_LOGGING_LEVEL: INFO
  VLLM_ENGINE_READY_TIMEOUT_S: '1800'
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3-Flash
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_TP: '8'
  JUDGE_MAX_MODEL_LEN: '16384'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_STAGE_TIMEOUT: '300'   # measured copy: 91s on df1; retain over 3x that budget
  JUDGE_HEALTH_TIMEOUT: '1800' # cold sparse-attention / DeepGEMM compilation exceeded 600s
  JUDGE_MAX_LIFETIME: '2400'
  JUDGE_EXTRA_ARGS: --reasoning-parser glm47 --tool-call-parser glm47 --enable-auto-tool-choice --language-model-only --no-enable-flashinfer-autotune --disable-custom-all-reduce --enforce-eager
  JUDGE_MODEL: judge
  JUDGE_DISABLE_THINKING: '0'
  JUDGE_REASONING_EFFORT: low
  JUDGE_STRUCTURED_OUTPUT: '1'
  JUDGE_MAX_TOKENS: '4096'
  JUDGE_TEMPERATURE: '0'
  JUDGE_TIMEOUT: '50'
  JUDGE_RETRIES: '1'
  JUDGE_DEADLINE_S: '110'
  GLM_FLASH_PROBE_CONCURRENCY: '16'
  GLM_FLASH_PROBE_REPEATS: '4'
  GLM_FLASH_PROBE_OUT_ROOT: /Volumes/main/mshtelma/verl/diagnostics/glmflash

max_retries: 0
timeout_minutes: 40

command: python3 ${CODE_SOURCE_PATH}/infra/diagnostics/glm_flash_judge.py
