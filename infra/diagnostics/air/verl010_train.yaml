# Bounded verl 0.10 qualification: 4 trainer + 4 rollout GPUs on one H100 node.
# Eight prompt groups, two responses each, two optimizer updates/weight syncs.
# SAVE_FREQ=1 requires verified checkpoints at global_step_1 and global_step_2.
# Resume with the same RUN_ID, RESUME=auto and total_rollout_steps=16; the fixed
# LR horizon is unchanged. Each attempt is capped at 2 GPU-hours with no retries.
experiment_name: verl-on-air-verl010-qualification

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v10-verl010-dev

code_source:
  type: snapshot
  snapshot:
    root_path: ../../..
    include_paths:
      - engine
      - infra/diagnostics

env_variables:
  HF_HOME: /tmp/hf
  TOKENIZERS_PARALLELISM: 'false'
  NCCL_DEBUG: INFO
  VLLM_LOGGING_LEVEL: INFO
  RAY_TEMP_DIR: /tmp/ray
  ROLLOUT_NNODES: '0'
  N_GPUS_ROLLOUT: '4'
  TP: '1'
  PP: '1'
  CP: '1'
  EP: '1'
  ETP: '1'
  GEN_TP: '1'
  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  LR_DECAY_STEPS: '16'
  SAVE_FREQ: '1'
  TEST_FREQ: '-1'
  MAX_CKPT_TO_KEEP: '2'
  SEED: '42'
  MAX_MODEL_LEN: '2048'
  ROLLOUT_ENFORCE_EAGER: 'True'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: verl010-2b-qualification

max_retries: 0
timeout_minutes: 15

parameters:
  model_name: Qwen/Qwen3.5-2B
  train_files: /Volumes/main/mshtelma/verl/data/geo3k/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/geo3k/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/verl010-smoke
  total_epochs: 1
  total_rollout_steps: 8
  ppo_mini_batch_size: 4       # DP=4: divisible across the four trainer GPUs
  rollout_n: 2
  max_prompt_length: 1024
  max_response_length: 256
  image_key: images

command: bash ${CODE_SOURCE_PATH}/engine/train/run_grpo_fully_async.sh
