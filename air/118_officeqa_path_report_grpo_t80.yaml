# =============================================================================
# OfficeQA PATH-REPORT GRPO -- LONG 80-TURN run, BIGGER groups, ~12h (Phase-1 EASY).
#
# The follow-on to air/102 (16-turn dense GRPO, 45 syncs, run 694643394691897). air/102 learned
# report well-formedness (malformed 29->16) and modestly improved held-out hard (correct 16->19)
# but trained under a 16-turn funnel that MISMATCHES the 80-turn eval/deploy budget (air/97/107).
# This run aligns training to the eval budget and pushes the two diagnosed Phase-1 levers harder:
#
#   * EVAL-CONSISTENT BUDGET: MAX_TURNS 16 -> 80, funnel 20/5 (== air/97/107 held-out eval). Easy
#     episodes terminate early (~6-9 turns per the probe), so real per-step cost tracks ACTUAL
#     episode length, not the 245760-token ceiling; recompute_granularity=full caps activation mem.
#   * BIGGER GROUPS: rollout_n 16 -> 32. GRPO's sparsity ceiling = all-pass/all-fail groups give no
#     gradient; a bigger group -> more prompts land a mixed win/lose group -> denser gradient (the
#     primary Phase-1 lever). norm_adv_by_std_in_grpo=False keeps the graded reward's scale.
#   * ~12h WALL: timeout 720m; total_rollout_steps=2560 (~80 syncs) is set ABOVE what 12h reaches
#     so the WALL binds -- "run ~12h and see what we get". SAVE_FREQ=10 (a full-gather 35B HF
#     checkpoint every 10 syncs -> ~4-8 ckpts over the run) so a recent checkpoint always survives a
#     timeout cap, and we get a learning curve to eval. lr stays ~flat at 2e-6 (LR_DECAY=total).
#
# CRITICAL judge lesson from air/102: JUDGE_MAX_LIFETIME=14400 (4h) killed the judge while training
# ran 6h58m -> the back half's reward was ZEROED (dead judge). Here JUDGE_MAX_LIFETIME=46800 (13h) >
# the 12h job timeout, so the judge stays alive for the WHOLE run; the training_done sentinel is the
# clean stop if training completes first.
#
# DATA: air/117 (officeqa_path_report_t80, 80/20/5-baked prompt) -- MUST match this run's funnel.
# Topology + judge server + reward config VERBATIM from air/102 (proven 32 GPU / 4 nodes).
#
#   air run --file air/117_prep_path_report_data_t80.yaml -p df1 --watch   # first (writes the data)
#   air run --file air/118_officeqa_path_report_grpo_t80.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-118-officeqa-path-report-grpo-t80
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 32          # 4 nodes x 8 H100 (2 training + 2 judge) -- proven air/102 layout
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # --- dispatcher: ranks 0-1 train, 2-3 judge --------------------------------
  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  JUDGE_WAIT_TIMEOUT: '2400'

  # --- training topology (VERBATIM air/102 / air/57 / air/31) ----------------
  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'

  # --- fully-async ------------------------------------------------------------
  TRIGGER_SYNC_STEP: '2'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.5'
  PARTIAL_ROLLOUT: 'True'
  # Full-gather HF checkpoint every 10 syncs (35B HF export de-risked air/60), written under
  # output_dir/global_step_N/actor/model/huggingface/. ~4-8 ckpts over ~12h -> a recent one always
  # survives a timeout cap + a learning curve for the hard-Q eval. (air/102 SAVE_FREQ=30 -> ckpts at
  # sync 30 + final 45; SAVE_FREQ counts syncs and the dir is global_step_<sync>.)
  SAVE_FREQ: '10'

  # --- agentic multi-turn: the PATH-REPORT custom loop + BaseTools -----------
  MULTI_TURN: 'True'
  MAX_TURNS: '80'                  # == verl max_assistant_turns; EVAL-CONSISTENT (air/97/107)
  TOOL_FORMAT: qwen3_coder         # Qwen3.5 native XML tool calls (proven air/55/53)
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '2048'    # officeqa table reads need room
  TOOL_CONFIG_PATH: ${CODE_SOURCE_PATH}/scripts/officeqa/config/path_report_tools.yaml
  AGENT_LOOP_CONFIG_PATH: ${CODE_SOURCE_PATH}/scripts/officeqa/config/path_report_agent.yaml
  # Funnel windows the custom loop reads (MUST match air/117's data-prep prompt): last 20 turns lock
  # retrieval (compute+submit only), last 5 turns submit-only.
  OQ_NUDGE_WINDOW: '20'
  OQ_SUBMIT_ONLY_WINDOW: '5'

  # --- reward: the VALIDATED path-report verifier as an in-loop reward --------
  REWARD_MANAGER: rate_limited     # REQUIRED: only this manager merges tool_extra_fields->extra_info
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/officeqa_path_report_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MAX_CONCURRENT: '32'
  REWARD_TIMEOUT: '900'            # > JUDGE_TIMEOUT; the judge call can be slow on long reports
  NORM_ADV_BY_STD_IN_GRPO: 'False' # graded reward must NOT be std-normalized (else scale collapses)
  OQ_RL_ANSWER_TOL: '0.0'
  OQ_RL_JUDGE_RETRIES: '2'

  # --- judge CLIENT knobs -----------------------------------------------------
  JUDGE_MODEL: judge
  JUDGE_MAX_TOKENS: '10240'        # GLM-5.3 reasoning + the strict support JSON
  JUDGE_REASONING_EFFORT: high
  JUDGE_TIMEOUT: '600'
  JUDGE_TEMPERATURE: '0'

  # --- judge SERVER knobs (serve_judge.sh, ranks 2-3): full GLM-5.3 TP16 ------
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_MAX_MODEL_LEN: '131072'    # right-sized (256k does NOT fit GLM-5.3 KV; see air/92/94)
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_HEALTH_TIMEOUT: '2400'
  # 13h > the 12h job timeout: the judge stays alive for the WHOLE run (the air/102 fix -- a 4h
  # lifetime zeroed reward on the back half). training_done sentinel is the clean stop if training
  # finishes first.
  JUDGE_MAX_LIFETIME: '46800'
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: officeqa-path-report-t80

# One retry as insurance against the transient judge Ray-cluster-formation flake (only 8/16 GPUs
# joined the TP16 head) that hit air/102's first launch; a retry gets a fresh node allocation.
max_retries: 1
timeout_minutes: 720             # ~12h wall: init ~50m + ~12h of 80-turn/n=32 syncs + periodic HF saves

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/officeqa_path_report_t80/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/officeqa_path_report_t80/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-t80
  total_epochs: 20
  ppo_mini_batch_size: 16          # 16 % trainer-DP(4) == 0 (TP2 x 1 trainer node = 8 GPU / TP2 = DP4)
  rollout_n: 32                    # BIGGER groups: 16->32 -> more prompts get a mixed win/lose group
  total_rollout_steps: 2560        # ~80 syncs (2560/32); ABOVE what 12h reaches so the WALL binds
  max_prompt_length: 2048          # officeqa system prompt (funnel) + question (~725-1400 tok, fits)
  max_response_length: 1024        # per-turn cap; episode budget = multi-turn accumulation
  actor_lr: 2e-6                   # ~constant (LR_DECAY_STEPS=total_rollout_steps); kl_loss_coef=0.01

# AI Runtime runs this once per node; the dispatcher routes each POD_RANK to train vs judge.
command: |
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
