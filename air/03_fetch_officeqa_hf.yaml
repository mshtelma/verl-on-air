# =============================================================================
# Fetch the authoritative OfficeQA dataset (HF databricks/officeqa) into the UC
# Volume, ON Databricks -- so the data is downloaded on df1 and written straight to
# the Volume via the FUSE mount, never round-tripping through the rate-limited local
# Files API. This replaces trusting a possibly-stale Volume upload with the canonical
# HF release (Pro=133 hard [the headline benchmark], Full=246 = Pro + 113 easy).
#
# HF_TOKEN is injected from df1's `msh` secret scope (see `secrets:` below).
# Runs on 1xA10 (no GPU work -- pure network + sequential Volume writes), stock env.
#
# CSVs only by default (fast, unblocks the baseline). Set FETCH_JSONS=1 to also stage
# the 697 parsed JSONs (authoritative source for corpus regen + atom synthesis).
#
#   air run --file air/03_fetch_officeqa_hf.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-03-fetch-officeqa-hf
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  version: '5'
  dependencies:
    - huggingface_hub>=0.34
    - hf_transfer          # fast downloader; safe here (we stage to local scratch first)

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  # Xet/CAS writes file ranges in parallel, which the UC Volumes FUSE mount rejects
  # ("Operation not supported", os error 95). We stage to local scratch then copy
  # sequentially, but disable Xet to keep the download path deterministic.
  HF_HUB_DISABLE_XET: '1'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OFFICEQA_REPO: databricks/officeqa
  OFFICEQA_VOL_DIR: /Volumes/main/mshtelma/verl/data/officeqa
  SCRATCH_DIR: /local_disk0/hf_officeqa
  FETCH_JSONS: '0'                 # CSVs only for the baseline; set 1 later for synthesis

secrets:
  HF_TOKEN: 'msh/hf_token'

max_retries: 1
timeout_minutes: 60

command: python3 ${CODE_SOURCE_PATH}/scripts/officeqa/fetch_officeqa_hf.py
