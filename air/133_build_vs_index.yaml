# =============================================================================
# BUILD THE VECTOR SEARCH INDEX for the agentic search task (runs in the df1 workspace).
# Loads corpus.parquet (from air/131) into a UC Delta table (CDF on) and builds a Delta-Sync
# Vector Search index with MANAGED embeddings (databricks-gte-large-en) over the `text` column.
# Runs create_vs_index.py in-workspace so it uses AMBIENT auth (WorkspaceClient()) and can
# auto-discover a SQL warehouse -- the resulting endpoint lives in the SAME workspace the rollout
# runs in, so the search tools query it with ambient auth too (no cross-workspace PAT).
#
# NOTE: a Vector Search endpoint is a billable, persistent resource. Idempotent: re-running reuses
# the endpoint/index and re-syncs. PREREQ: air/131 wrote corpus.parquet.
#
#   air run --file air/133_build_vs_index.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-133-build-vs-index
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  QA_VS_CATALOG: main
  QA_VS_SCHEMA: mshtelma
  QA_VS_TABLE: wiki_qa_corpus
  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_corpus_index
  QA_CORPUS_OUT: /Volumes/main/mshtelma/verl/data/qa_search/corpus.parquet
  QA_VS_EMBED_MODEL: databricks-gte-large-en

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  pip install -q databricks-sdk databricks-vectorsearch || pip install -q databricks-sdk databricks-vectorsearch
  python3 ${CODE_SOURCE_PATH}/scripts/qa_search/create_vs_index.py
