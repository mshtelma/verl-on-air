# =============================================================================
# HARDER-DATA v2 STEP 1 — DAPO-Math-17k -> tool-agent parquet on the UC Volume.
#
# MATH L3-5 turned out saturated too (base ~95% correct-among-answered, agentic,
# run 408973568177817), so there was no GRPO advantage variance to learn from. DAPO-
# Math-17k is the DAPO RL set: hard competition/olympiad problems with INTEGER answers.
# We filter by the per-problem Qwen3-32B_solve_rate (from the Scored mirror) to the
# headroom band [DAPO_SOLVE_MIN, DAPO_SOLVE_MAX] so training problems are hard-but-
# solvable (real signal), and we DEDUP against AIME 2025 (the held-out eval) so we
# never train on the test.
#
# Emits the SAME verl AgentLoop schema as the MATH prep (agent_name="tool_agent", raw
# system+user chat, reward_model.ground_truth = the integer answer). Text-only + tiny
# -> stock env, no GPU work.
#
# The band below is PROVISIONAL; calibrate DAPO_SOLVE_MAX from the AIME-2025 baseline
# (run 248393209125302) so the kept problems sit near the base model's own frontier.
#
#   air run --file air/62_prep_dapo_tool.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-62-prep-dapo-tool
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  version: '5'
  dependencies:
    - datasets>=4.0
    - huggingface_hub>=0.35
    - fsspec>=2024.9
    - pyarrow>=19.0.0

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  OPENSSL_FORCE_FIPS_MODE: '0'
  DAPO_OUT_DIR: /Volumes/main/mshtelma/verl/data/dapo_tool
  DAPO_SOLVE_MIN: '0.0'    # FIRST PASS: keep ALL (max=1.0) to VALIDATE extraction + SEE the full
  DAPO_SOLVE_MAX: '1.0'    # solve_rate distribution; then re-run with the calibrated headroom band
  DAPO_DEDUP_AIME: '1'     # drop any training problem matching an AIME-2025 problem
  N_TRAIN: '0'             # 0 = full (filtered) train split
  N_TEST: '500'            # small held-in nominal test (unused during training)

max_retries: 0
timeout_minutes: 45

command: python3 ${CODE_SOURCE_PATH}/scripts/prep_dapo_tool_agent.py
