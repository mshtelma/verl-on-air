# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — 133 HARD, TRAINED model @ the 80-TURN budget.
#
# The MISSING CELL of the turn-budget probe 2x2. We already have:
#   base @ 16t    (air/103/104 -> scored_hard_base16)     n_scored 14
#   base @ 80t    (air/97/98   -> scored_hard_v4)          n_scored 38   <-- huge budget effect
#   trained @ 16t (air/105/106 -> scored_hard_trained16)   n_scored 17
# This job supplies trained @ 80t so the 2x2 is complete. The question it answers:
#   does the 16-turn-trained checkpoint (global_step_45) USE a longer budget on hard
#   (-> beats base@80 = training helped, just eval/deploy longer) or is it stuck in
#   early-submit / abstain habits learned under the 16-turn funnel (-> we must RETRAIN
#   at a long budget before Phase-2 hard-question training pays off)?
#
# EXACTLY air/97 (base @ 80t) with ONLY the model + output dir swapped, so trained@80 is
# directly comparable to base@80 (scored_hard_v4): same 80-turn 3-phase funnel
# (MAX_TURNS=80, NUDGE=20, SUBMIT_ONLY=5), same 256k serve len, same decoding, same corpus.
#
# CHECKPOINT: air/102 (run 694643394691897) final = global_step_45; HF export at
# <ckpt>/global_step_45/actor/model/huggingface/ (vLLM-servable, same as air/105).
#
# Scoring is the separate air/108 job.
#
#   air run --file air/107_officeqa_collect_hard_trained80.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-107-officeqa-collect-hard-trained80
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve: the air/102 TRAINED checkpoint (global_step_45 HF export); 256k ctx like air/97 ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-dense/global_step_45/actor/model/huggingface
  MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-dense/global_step_45/actor/model/huggingface
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'         # 256k: model max -> the ceiling (identical to air/97 base@80)
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + 80-turn 3-phase funnel + PARALLEL (identical to air/97) ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '20'            # last 20 of 80: retrieval locked (== air/97 base@80)
  OQ_SUBMIT_ONLY_WINDOW: '5'       # last 5 of 80: submit_report only (== air/97 base@80)
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'            # 0 = ALL hard questions (133 in officeqa_full.csv)
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard_trained80

  # --- corpus + questions (staged exactly as air/97) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (identical to air/97 base@80) ---------
  EVAL_MAX_TURNS: '80'             # long budget -> the probe's whole point
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 300                # 16-way overlap of 133 hard @ 80 turns + cold model load (== air/97)

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
