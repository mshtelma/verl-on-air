# =============================================================================
# AGENTIC STEP 4 — the full run: fully-async GRPO on Qwen3.5-35B-A3B with a
# MULTI-TURN calculator tool-agent rollout and a self-hosted GLM-5.3 LLM-JUDGE
# reward, all in ONE df1 job (no cross-job connectivity; one image; 20 GB cap).
#
# TOPOLOGY — 4 nodes / 32xH100, split by scripts/dispatch_agentic.sh on POD_RANK:
#   ranks 0-1  TRAINING  (run_grpo_fully_async.sh, NNODES overridden to 2):
#              node 0 = Trainer (8 GPU, TP2/EP8), node 1 = Rollouter (8 GPU,
#              GEN_TP8, vLLM AgentLoop). This is air/31's PROVEN 35B disaggregated
#              config (run 1040372797133433), unchanged except multi-turn + judge.
#   ranks 2-3  JUDGE     (serve_judge.sh, JUDGE_NNODES=2): GLM-5.3 (744B fp8) at
#              TP16 across the 2 nodes. This is air/52c's PROVEN serve recipe
#              (run 945660419035209): ray-pin 2.48 + FLASHMLA_SPARSE + bf16 KV +
#              CUDA graphs (v6 nvrtc fix) -> 17 gradings/s, judge_ok 128/128.
#
# HOW THE HALVES CONNECT — HTTP only (df1 allows intra-job cross-node). The judge
# head publishes its OpenAI endpoint to a shared UC rendezvous file; the training
# reward-loop workers read it as JUDGE_BASE_URL. Two independent Ray clusters
# (training 6379 / ray 2.58 ; judge 6380 / ray 2.48). When training finishes, the
# dispatcher drops a `training_done` sentinel; the judge head's watchdog sees it
# and stops, so the judge GPUs don't idle to the job timeout.
#
# JUDGING RUNS IN PARALLEL WITH GENERATION (verified in verl 0.9.0 source):
# fully-async + an external-HTTP judge enables the streaming reward loop
# (enable_agent_reward_loop = not use_rm = True), so each trajectory is graded
# async the moment it finishes -> grading of batch N overlaps generation of N+1
# and training on N-1. REWARD_MAX_CONCURRENT=64 fires the concurrent grading burst
# the TP16 judge continuous-batches (sized from air/52c's load test). STALENESS=0.5
# gives the async pipeline room to overlap the three stages.
#
# PREREQS: GLM-5.3 staged (air/51b) + GSM8K tool-agent data (air/50) + 35B model.
#
#   air run --file air/53_qwen3_5_35b_agentic_judge.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-53-qwen3_5-35b-agentic-judge
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 32          # 4 nodes x 8 H100 (2 training + 2 judge)
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v6

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # --- dispatcher: which ranks train vs serve the judge --------------------
  TRAINING_NODES: '2'                              # ranks 0-1 train; 2-3 judge
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  JUDGE_WAIT_TIMEOUT: '2400'                       # training waits this long for the judge endpoint

  # --- training topology (VERBATIM from the validated air/31) --------------
  ROLLOUT_NNODES: '1'          # 1 whole node Rollouter + 1 node Trainer (of the 2 training nodes)
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'                  # 1 vLLM replica, TP8 intra-node (NVLink)
  # Rollout CUDA graphs stay ON, but disable vLLM's custom all-reduce: at GEN_TP=8 with
  # this multi-turn max_model_len=8192, graph capture crashes in the custom kernel
  # (custom_all_reduce.cuh:455; air/53 run 371030427696093). Rollout-scoped NCCL fallback
  # fixes it with graphs intact + no trainer impact (de-risked on air/54; lever B).
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'

  # --- fully-async: STALENESS raised to 0.5 for more train||gen||judge overlap
  TRIGGER_SYNC_STEP: '2'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.5'             # air/31 used 0.1; 0.5 (verl genrm ref) widens the overlap window
  PARTIAL_ROLLOUT: 'True'

  # --- agentic multi-turn tool-calling (the calculator @function_tool) -----
  MULTI_TURN: 'True'
  MAX_TURNS: '4'
  # Qwen3.5 emits tool calls in its NATIVE XML form (<function=..><parameter=..>),
  # NOT hermes JSON. hermes (run3) ran json.loads on the XML -> "Failed to decode
  # tool call: Expecting value: line 2 column 1 (char 1)" on EVERY call -> no tool
  # ever executed -> num_turns pinned at 2. verl v0.9.0's `qwen3_coder` parser
  # (Qwen3XMLToolParser, docstring names "qwen3.5") is the right one. De-risked by
  # air/55 (tokenizer render + real verl parser on 1xA10).
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '512'
  # FUNCTION_TOOL_PATH + CUSTOM_REWARD_PATH are set by the dispatcher (HERE-relative).

  # --- LLM-judge reward via verl's rate_limited manager --------------------
  REWARD_MANAGER: rate_limited
  REWARD_SOURCE: judge         # optimise the judge's 0..1 score (rule = validation/fallback)
  REWARD_MAX_CONCURRENT: '64'  # default is 1 (serial!); 64 = the concurrent burst the TP16 judge batches
  REWARD_TIMEOUT: '120'        # verl-level asyncio timeout; MUST exceed JUDGE_TIMEOUT so OUR rule
                               # fallback (preserves signal) fires first, not verl's hard 0.0.

  # --- judge CLIENT knobs (judge_reward.py, runs in the reward-loop actors) -
  JUDGE_MODEL: judge
  JUDGE_MAX_TOKENS: '4096'     # reasoning judge: room to think + emit the JSON verdict
  JUDGE_TIMEOUT: '90'          # aiohttp client timeout; < REWARD_TIMEOUT (see above)
  JUDGE_TEMPERATURE: '0'
  JUDGE_DEBUG: '1'             # DIAGNOSTIC: dump each judge verdict so run3's silent
                              # rule-fallback (judge never called) can't recur unseen.
                              # judge_reward.py also always logs the resolved URL once
                              # and the first judge-call failures even without this.

  # --- judge SERVER knobs (serve_judge.sh, ranks 2-3) ----------------------
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache      # per-node NVMe pre-stage (bulk cp off UC)
  JUDGE_TP: '16'                                    # 2 judge nodes x 8 H100
  JUDGE_RAY_VERSION: '2.48.0'                       # pin ray on judge nodes only (vllm#45318)
  JUDGE_MAX_MODEL_LEN: '16384'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_HEALTH_TIMEOUT: '2400'                      # first cross-node TP16 load of 744 GB
  JUDGE_MAX_LIFETIME: '13800'                       # backstop self-exit (< timeout) if training skips the sentinel
  # Graphs ON (no --enforce-eager): v6's nvrtc symlink fixed the capture JIT link
  # (air/52c run7); serve_judge.sh always adds --disable-custom-all-reduce.
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-35b-agentic-judge

max_retries: 0
timeout_minutes: 240          # judge load + 35B/vLLM init on 4 nodes + ~8 syncs of multi-turn agentic rollout

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/gsm8k_tool/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/gsm8k_tool/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-agentic-judge
  total_epochs: 15             # data headroom; the rollouter stops at total_rollout_steps
  ppo_mini_batch_size: 16      # % train-DP(4) == 0
  rollout_n: 4
  total_rollout_steps: 256     # /32 samples per sync -> ~8 weight-sync cycles (a real reward trajectory)
  max_prompt_length: 1024
  max_response_length: 1024    # per-turn; multi-turn episode = (1024+1024)*4 = 8192
  actor_lr: 1e-6

# AI Runtime runs this once per node; the dispatcher routes each POD_RANK to its role.
command: |
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
