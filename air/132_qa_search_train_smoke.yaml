# =============================================================================
# AGENTIC SEARCH/RAG TRAINING INTEGRATION SMOKE — judge-free (rule-based EM reward).
#
# Proves the NQ+HotpotQA ToolAgentLoop wiring in the REAL verl v0.9.0 fully-async container:
#   * stock ToolAgentLoop + 3 @function_tools (vector_search / keyword_search / read_article)
#     over the Databricks Vector Search index, via FUNCTION_TOOL_PATH (== the GSM8K calc_tool wiring);
#   * rule-based EM reward (scripts/reward/qa_search_reward.py) with REWARD_MANAGER=naive -- NO judge
#     nodes, NO rate limiting, NO rendezvous. Binary reward -> standard GRPO norm (NORM_ADV_BY_STD
#     left at default, UNLIKE the graded OfficeQA reward);
#   * tiny LR -> this proves wiring + retrieval-under-rollout QPS, it is NOT a learning result and
#     NOT the baseline (that is the OOB probe: rollout_n high, actor_lr 0 / eval-only).
#
# PREREQS (fill the 3 markers below):
#   1. air/131 has written train/test parquet + corpus.parquet.
#   2. scripts/qa_search/create_vs_index.py has built the VS index -> set QA_VS_ENDPOINT / QA_VS_INDEX.
#   3. The search tool needs workspace auth to query VS. If this job's workspace == the VS index
#      workspace, ambient auth may suffice; otherwise set DATABRICKS_HOST and inject a PAT via the
#      secret below (create it first, e.g. `databricks secrets put-secret msh databricks_token`).
#
# Two nodes / 16xH100: rank 0 trainer, rank 1 Rollouter. TRAINING_NODES == all nodes -> the
# dispatcher runs judge-free. QA episodes are SMALL (2048 prompt + 512/turn x 8 turns ~ 20k tokens),
# far under the budget that OOM'd the 16-turn OfficeQA run.
#
#   air run --file air/132_qa_search_train_smoke.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-132-qa-search-train-smoke
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16          # 2 nodes x 8 H100: 1 trainer + 1 Rollouter
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # All 2 nodes train; no judge role. The dispatcher runs judge-free.
  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  # Proven 35B fully-async topology from air/31/53/77, no judge nodes.
  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'

  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  # Agentic search multi-turn contract: Qwen native parser; short episodes.
  MULTI_TURN: 'True'
  MAX_TURNS: '8'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '4000'    # CHARACTERS; top_k=5 x ~600-char snippets fits
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/scripts/tools/qa_search_tools.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/qa_search_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: naive            # pure-CPU EM check; no judge/rate-limit needed.
  # compute_score returns a dict {score, em, cover_em, f1, ...} so em/f1 show up in train metrics.
  # If this verl build's `naive` manager rejects a dict return, switch to: REWARD_MANAGER=rate_limited
  # + REWARD_MAX_CONCURRENT='64' (limited.py runs the sync fn in an executor and handles dicts).

  # --- Vector Search backend for the tools (built by air/133, same df1 workspace -> ambient auth) ---
  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_corpus_index
  QA_SEARCH_TOP_K: '5'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qa-search-train-smoke

# Uncomment + create the secret if the tools need an explicit PAT to reach Vector Search:
# secrets:
#   DATABRICKS_TOKEN: 'msh/databricks_token'

max_retries: 0
timeout_minutes: 120

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/qa_search/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/qa_search/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qa-search-train-smoke
  total_epochs: 1
  ppo_mini_batch_size: 16
  rollout_n: 8
  total_rollout_steps: 32         # UNIQUE PROMPTS: 32 = two full 16-sample syncs
  max_prompt_length: 2048         # QA system+tool prompt + question (short vs OfficeQA)
  max_response_length: 512        # per-turn; episode budget ~ 8*(2048+512) = 20k
  actor_lr: 1e-6                  # smoke: wiring + retrieval QPS, not learning

command: |
  set -euo pipefail
  # The search tools query Vector Search over REST via the PREINSTALLED databricks-sdk (0.139.0),
  # so there is NO pip install: installing databricks-vectorsearch downgraded protobuf below the
  # image's vLLM gencode and stopped vLLM from starting (air/134). Ambient auth resolves in-job.
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
