# =============================================================================
# WAIT for the Vector Search index to finish PROVISIONING_INITIAL_SNAPSHOT and go ONLINE.
# air/133 timed out at the 120m job cap while embedding 507k passages; air/135 showed it ~79% done
# (402k/507k). This job just polls wait_until_ready (no table load, no create, no sync) and exits
# SUCCESS when ONLINE. Cheap A10.
#
#   air run --file air/136_wait_vs_index.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-136-wait-vs-index
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_corpus_index

max_retries: 0
timeout_minutes: 90

command: |
  set -euo pipefail
  pip install -q databricks-sdk databricks-vectorsearch || pip install -q databricks-sdk databricks-vectorsearch
  python3 ${CODE_SOURCE_PATH}/scripts/qa_search/create_vs_index.py --skip-load --wait-only
