# =============================================================================
# MuSiQue AGENTIC-SEARCH GRPO -- PURE-EM @ 12 turns, DEEP (1 trainer + 2 rollout nodes).
# The WINNING recipe (air/149: pure-EM + MAX_TURNS=12) climbs cleanly -- step_10 EM=56.0, step_20=58.5
# vs base@12t=54, with recall HELD ~80 and conversion (EM|retrieved) rising 68.7->73.1. But air/149
# (1 trainer + 1 rollout) is rollout-bound at ~15-20min/sync -> only ~step_38 in the 10h cap, which
# reaches ~60% but never tests the CEILING.
#
# This run is IDENTICAL to air/149 in every learning-relevant knob (pure-EM QA_RETRIEVAL_BONUS=0.0,
# MAX_TURNS=12, top_k=5, ppo_mini=32, rollout_n=16, actor_lr=2e-6, total_rollout_steps=3200 -> same
# 100-sync LR horizon, same SAVE_FREQ=10 ladder) EXCEPT the topology: 3 nodes split 1 TRAINER + 2
# ROLLOUT (ROLLOUT_NNODES=2). Agentic 12-turn generation is rollout-bound, so 2 rollout replicas ~2x
# the sample throughput -> ~2x the sync rate -> reaches ~step_60-70 within 10h (and air/149's step_38-
# equivalent in ~5h). Each sync is still exactly 32 samples/one gradient step, so step_N here is
# DIRECTLY COMPARABLE to air/149 step_N -- just reached sooner and carried deeper. Trainer is 1 node
# (8 GPU, TP=2 -> DP=4, ppo_mini 32%4=0), identical to air/149's proven-fitting trainer.
#
# Runs in PARALLEL with air/149 (the 2-node safety net). Goal: confirm whether conversion keeps
# climbing toward ~77 (air/143 step-60 level) at recall ~80 -> ~62%+, i.e. test the upper end of the
# user's 60-70 EM target. Ladder-eval its checkpoints exactly like air/149:
#   air run -f air/144_musique_trained_eval.yaml -p df1 --override \
#     env_variables.MODEL_PATH=<ckpt>/actor/model/huggingface (BARE /Volumes, no dbfs: prefix) \
#     env_variables.EVAL_MODEL_PATH=<same> env_variables.EVAL_MAX_TURNS=12 \
#     env_variables.EVAL_OUT=... env_variables.EVAL_TRACE_OUT=...
#
# 3 nodes / 24xH100, judge-free (TRAINING_NODES==NUM_NODES).
#   air run --file air/150_musique_grpo_t12_pureem_deep.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-150-musique-grpo-t12-pureem-deep
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 24
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN

  TRAINING_NODES: '3'              # == NUM_NODES -> judge-free (rule-based EM reward)
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  ROLLOUT_NNODES: '2'              # 2 rollout nodes (was 1) -> ~2x sample throughput; trainer gets the remaining 1
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'
  ROLLOUT_PREFIX_CACHING: 'True'

  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  MULTI_TURN: 'True'
  MAX_TURNS: '12'                  # the proven turn lever
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '4000'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/scripts/tools/qa_search_tools.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/qa_search_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: naive
  QA_RETRIEVAL_BONUS: '0.0'        # pure Search-R1 EM (the winner; bonus proven inert-to-harmful)

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'

  SAVE_FREQ: '10'                  # checkpoint every 10 syncs (same ladder as air/149)
  TEST_FREQ: '-1'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: musique-grpo-t12-pureem-deep

max_retries: 0
timeout_minutes: 600

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/qa_musique/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/musique-grpo-t12-pureem-deep
  total_epochs: 2
  ppo_mini_batch_size: 32
  rollout_n: 16
  total_rollout_steps: 3200
  max_prompt_length: 2048
  max_response_length: 512
  actor_lr: 2e-6

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
