# =============================================================================
# OfficeQA PATH-REPORT GRPO -- 32-turn, THROUGHPUT-FIXED (prefix caching + bigger staleness buffer).
#
# air/123 (run 73892722737269) confirmed the DENSE config runs but exposed a PIPELINE-OVERLAP stall:
# per step (2065s) the TRAINER sits idle 57% waiting for generation (timing_s/gen 1179s) while the
# ROLLOUT GPUs run at only ~40% util -- BOTH sides under-utilized. Diagnosis (verl source + live
# fully_async metrics):
#   * Each 32-turn episode takes ~815s avg. enable_prefix_caching was OFF, so every turn re-prefills
#     the ENTIRE growing conversation (O(turns^2) prefill) AND the ~1600-tok system prompt -- shared
#     verbatim across all 64xN concurrent trajectories -- is recomputed per sequence instead of cached
#     once. This is the dominant generation tax.
#   * The staleness buffer was tiny: max_required_samples = ppo_mini(16) x (staleness 0.5 + 1) x
#     trigger_sync(2) = 48. The rollout PAUSES (drains active_tasks -> 0, observed live) as soon as
#     in-flight+buffered hits 48, so it cannot run ahead during the trainer's 886s compute window ->
#     poor overlap -> the 57% trainer idle.
#
# TWO LEVERS (user-directed), everything else VERBATIM from air/123 (n=64, temp 1.2 unchanged so the
# reward-density comparison stays clean):
#   * PREFIX CACHING ON (new ROLLOUT_PREFIX_CACHING launcher knob). Reuses the shared system-prompt
#     prefix across all trajectories + prior-turn KV within each episode -> far less prefill, and
#     dedups the shared prefix in KV -> LOWER KV pressure too. SAFE: verl frees/flushes the vLLM
#     cache on each weight sync (verified from source), so no stale-KV logprobs reach the gradient.
#   * BIGGER STALENESS BUFFER: staleness_threshold 0.5 -> 1.5 -> max_required_samples = 16 x 2.5 x 2
#     = 80. The rollout can now buffer ~80 groups before pausing (vs 48) -> keeps generating through
#     the trainer's compute window -> higher rollout util + the trainer finds fresh samples ready ->
#     shorter gen wait. Active concurrency stays 48 (= 3 nodes x 16/replica) so KV pressure is
#     unchanged; only the run-ahead buffer grows. Tolerates 1-param-version-old samples (still ~on
#     policy for GRPO); dropped_stale_samples stays ~0.
#
# SAME data (officeqa_path_report_t32, funnel unchanged -> no re-prep). Memory safe (backward is
# micro_bsz=1, ~57GB/80GB). output_dir officeqa-path-report-t32c. Eval air/119/120 -> repoint
# CKPT_ROOT to t32c when ready. Further free levers if still gen-bound: ROLLOUT_GPU_MEM_UTIL 0.7->0.85
# (more KV on the dedicated rollout pool) or cut MAX_TURNS 32->16 (shorter episodes; air/102 learned).
#
#   air run --file air/124_officeqa_path_report_grpo_t32_faster.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-124-officeqa-path-report-grpo-t32-faster
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 48          # 6 nodes x 8 H100: 1 trainer + 3 rollout (TRAINING_NODES=4) + 2 judge
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # --- dispatcher: 4 training-side nodes (ranks 0-3), 2 judge (ranks 4-5) --------
  TRAINING_NODES: '4'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  JUDGE_WAIT_TIMEOUT: '2400'

  # --- training topology: 1 trainer node + 3 rollout nodes -----------------------
  ROLLOUT_NNODES: '3'              # 3 whole rollout nodes -> 3x generation capacity
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'

  # --- fully-async ------------------------------------------------------------
  TRIGGER_SYNC_STEP: '2'
  REQUIRE_BATCHES: '1'
  STALENESS: '1.5'                 # 0.5 -> 1.5: max_required_samples 48 -> 80 (bigger run-ahead buffer -> better overlap)
  PARTIAL_ROLLOUT: 'True'
  SAVE_FREQ: '5'                   # every 5 syncs (current_param_version) -> HF ckpt

  # --- agentic multi-turn: the PATH-REPORT custom loop + BaseTools -----------
  MULTI_TURN: 'True'
  MAX_TURNS: '32'                  # unchanged from air/123 (memory-safe; data funnel matches)
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '2048'
  TOOL_CONFIG_PATH: ${CODE_SOURCE_PATH}/scripts/officeqa/config/path_report_tools.yaml
  AGENT_LOOP_CONFIG_PATH: ${CODE_SOURCE_PATH}/scripts/officeqa/config/path_report_agent.yaml
  OQ_NUDGE_WINDOW: '8'             # MUST match officeqa_path_report_t32 data (last 8 lock retrieval)
  OQ_SUBMIT_ONLY_WINDOW: '4'       # last 4 submit-only

  # --- exploration temperature (unchanged from air/123) -----------------------
  ROLLOUT_TEMP: '1.2'

  # --- THROUGHPUT LEVER: vLLM prefix caching ON (new launcher knob) ------------
  ROLLOUT_PREFIX_CACHING: 'True'   # reuse shared system-prompt + prior-turn KV -> big rollout speedup; SAFE (verl flushes cache on weight sync)

  # --- reward: the VALIDATED path-report verifier as an in-loop reward --------
  REWARD_MANAGER: rate_limited
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/officeqa_path_report_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MAX_CONCURRENT: '48'
  REWARD_TIMEOUT: '900'
  NORM_ADV_BY_STD_IN_GRPO: 'False'
  OQ_RL_ANSWER_TOL: '0.0'
  OQ_RL_JUDGE_RETRIES: '2'

  # --- judge CLIENT knobs -----------------------------------------------------
  JUDGE_MODEL: judge
  JUDGE_MAX_TOKENS: '10240'
  JUDGE_REASONING_EFFORT: high
  JUDGE_TIMEOUT: '600'
  JUDGE_TEMPERATURE: '0'

  # --- judge SERVER knobs (serve_judge.sh, ranks 4-5): full GLM-5.3 TP16 ------
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_MAX_MODEL_LEN: '131072'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_HEALTH_TIMEOUT: '2400'
  JUDGE_MAX_LIFETIME: '46800'      # 13h > 12h timeout -> judge alive the whole run
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: officeqa-path-report-t32c

max_retries: 1
timeout_minutes: 720             # ~12h wall

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/officeqa_path_report_t32/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/officeqa_path_report_t32/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-t32c
  total_epochs: 20
  ppo_mini_batch_size: 16          # 16 % trainer-DP(4) == 0 (1 trainer node, TP2 -> DP4)
  rollout_n: 64                    # BIGGER groups (unchanged from air/123)
  total_rollout_steps: 3200        # ~100 syncs; ABOVE what 12h reaches so the WALL binds
  max_prompt_length: 2048
  max_response_length: 1024
  actor_lr: 2e-6

command: |
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
