# =============================================================================
# RUNG 5b — FULLY-ASYNC / DISAGGREGATED: Qwen3.5-35B-A3B MoE, 2 nodes (16xH100),
#           split WHOLE-NODE: 1 node Trainer (8 GPU) + 1 node Rollouter (8 GPU).
#
# This is the first MULTI-NODE fully-async run and the real point of the ladder:
# the Trainer and the Rollouter live on DISJOINT nodes, with a MessageQueue
# between them and a CROSS-NODE NCCL weight sync (checkpoint_engine backend=nccl)
# carrying trainer weights -> rollout over EFA. It uses verl's purpose-built
# recipe (fully_async_policy.fully_async_main), NOT the v1 separate_async trainer
# that collided rollout onto the trainer GPUs.
#
# WHY 35B AND NOT THE 9B SMOKE: Qwen3.5-9B is a small DENSE model with TIED
# word-embeddings (no separate lm_head.weight in the safetensors); the classic
# legacy-mbridge loader wants that tensor and dead-ends at weight load. The MoE
# targets (35B-A3B, 122B-A10B) have UNTIED embeddings, so the classic path — the
# only path verl's Qwen3.5 recipes actually test — loads them. The 9B smoke
# (air/30) still PROVED the disaggregation itself (Rollouter + Trainer on disjoint
# GPUs, both models built) before hitting that loader wall.
#
# TOPOLOGY (whole-node split via ROLLOUT_NNODES=1):
#   NNODES=2 (num_accelerators 16 / 8) -> Trainer gets NNODES-ROLLOUT_NNODES = 1
#   whole node (8 GPU), Rollouter gets ROLLOUT_NNODES = 1 whole node (8 GPU).
#   Trainer parallelism = rung3's PROVEN 35B classic 8-GPU config:
#     TP=2 PP=1 CP=1 EP=8 ETP=1  -> train-DP = 8/(TP*PP) = 4, expert-DP = 1.
#   Classic Megatron distributed optimizer (ZeRO-1) parks ~390 GB Adam state in
#   HOST RAM (optimizer_offload_fraction=1) since expert-DP=1 — exactly as rung3
#   did on 8 GPU (worked; needs ~400-500 GB CPU RAM on the trainer node).
#   Rollouter = 1 vLLM replica, GEN_TP=8 across the 8 rollout GPUs (NVLink,
#   intra-node), DEDICATED (no training state resident) -> can run util 0.7.
#
# PRIOR RESULT (2026-09-10, run 1040372797133433, total_rollout_steps=64): the
# plumbing is ALREADY PROVEN end-to-end — disjoint Trainer/Rollouter across the 2
# nodes, vLLM AgentLoop server, MessageQueue, TWO cross-node NCCL weight syncs
# (param_version 1->2), and 2 healthy GRPO steps with reward improving 0.11->0.27.
# It exited 1 only on a cosmetic teardown artifact of verl's experimental async
# main (finished component interrupts the other); the launcher now guards that so
# a clean completion reports SUCCESS. THIS run scales total_rollout_steps 64->512
# to watch a sustained ~16-sync / ~32-step reward trajectory and confirm the green exit.
#
# WHAT TO CHECK IN THE LOG:
#   * a SUSTAINED reward trend across ~16 syncs (critic/rewards/mean per step),
#     not just 2 points — is GRPO actually moving the 35B on geo3k?
#   * stable repeated CROSS-NODE NCCL weight syncs (param_version climbing 1..16)
#   * flat trainer memory across steps (max_memory_reserved_gb ~44, cpu ~960) —
#     no leak/creep over a longer run
#   * the job reports SUCCESS (exit-code guard working on a real completion)
#
#   air run --file air/31_qwen3_5_35b_async.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-31-qwen3_5-35b-fully-async
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16        # 2 nodes x 8 H100; node count derived as 16/8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v6

# Snapshot the launcher so a tweak does not require a ~16 GB image rebuild.
code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  # EFA/RDMA is already PROVEN on df1 multi-node (rung4: 2502 GDRDMA lines, 0 TCP
  # fallback) so NCCL stays at WARN (errors still surface). vLLM at INFO so we SEE
  # the AgentLoop server + rollout + the 35B KV/weights map at GEN_TP=8. Bump NCCL
  # to INFO on a retry only if the cross-node weight sync misbehaves.
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # --- disaggregation split: WHOLE-NODE (1 trainer node + 1 rollout node) ---
  ROLLOUT_NNODES: '1'          # 1 whole node to the Rollouter -> 1 node (8 GPU) to the Trainer
  TP: '2'                      # trainer TP (rung3-proven 35B classic; must divide 16 heads)
  PP: '1'
  CP: '1'
  EP: '8'                      # 256 experts -> 32 experts/rank; expert-DP=1 on 8 GPU
  ETP: '1'
  GEN_TP: '8'                  # rollout: 1 vLLM replica, TP=8 intra-node (NVLink)
  OFFLOAD_FRACTION: '1'        # park Adam state in host RAM (classic ZeRO-1, expert-DP=1)
  ROLLOUT_GPU_MEM_UTIL: '0.7'  # DEDICATED rollout GPUs (no training resident) -> generous KV

  # --- fully-async knobs ---
  TRIGGER_SYNC_STEP: '2'       # local updates between weight syncs
  REQUIRE_BATCHES: '1'         # mini-batches fetched per update
  STALENESS: '0.1'             # >0 => genuinely async (proves the async path)
  PARTIAL_ROLLOUT: 'True'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-35b-fully-async

max_retries: 0
timeout_minutes: 180          # 35B load + Megatron/vLLM init on 2 nodes + ~2 syncs (rung3 was ~25 min for the sync path)

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/geo3k/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/geo3k/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-fully-async
  total_epochs: 15             # data headroom only; the rollouter stops at total_rollout_steps regardless (64-prompt subset x rollout_n=4 = 256 samples/epoch)
  ppo_mini_batch_size: 16      # % train-DP(4) == 0
  rollout_n: 4
  # syncs = total_rollout_steps / (trigger_sync * require_batches * ppo_mini) = /32.
  # 512 -> ~16 weight-sync cycles -> ~32 optimizer steps: a real reward trajectory,
  # not just a 2-step plumbing smoke. ~16 syncs x ~200s + ~10min setup ~= 1h.
  total_rollout_steps: 512
  max_prompt_length: 1024
  max_response_length: 2048
  actor_lr: 1e-6

command: |
  bash ${CODE_SOURCE_PATH}/scripts/run_grpo_fully_async.sh
