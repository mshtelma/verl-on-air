# =============================================================================
# MuSiQue AGENTIC-SEARCH GRPO -- PURE-EM @ 12 turns, DENSER GRPO GROUPS (rollout_n 16->32).
# Tier-2 test of the ~57% plateau (air/149 converged there: conversion flat ~72.6, recall ~78). The
# hypothesis: air/149's 2-prompt/sync x 16-rollout groups give a NOISY within-group advantage
# estimate, so conversion learning stalls in gradient noise. DENSER groups (32 rollouts/prompt) give
# a lower-variance advantage -> conversion may climb past the ~73 plateau.
#
# CLEAN ISOLATION of "denser groups": rollout_n 16->32 AND ppo_mini 32->64 together, so prompts/sync
# stays = ppo_mini/rollout_n = 64/32 = 2 (IDENTICAL to air/149's 32/16 = 2). Changing rollout_n ALONE
# would drop prompts/sync to 1 and confound group-density with prompt-diversity. Consequence: each
# sync now consumes 64 samples (vs 32), so air/151 step_10 (=10 syncs x 64 = 640 samples) is
# comparable in DATA-SEEN to air/149 step_20 (=20 syncs x 32 = 640) -- i.e. air/151 step_10 already
# reaches air/149's PEAK-equivalent. total_rollout_steps=3200 -> 50 syncs; LR horizon unchanged.
# ppo_mini 64 % trainer-DP(=1 node x 8 / TP2 = 4) = 0 ✓.
#
# TOPOLOGY: 1 TRAINER + 1 ROLLOUT (2 nodes), IDENTICAL to air/149 -- deliberately NOT air/150's 1T+2R,
# because air/150 step_10 came in LOW (51 vs 56) showing the 2:1 rollout:trainer ratio raises async
# staleness and shifts the trajectory. Matching air/149's 1:1 keeps this a clean single-variable
# (group-density) test. rollout_n=32 ~2x rollout work/prompt -> on 2 nodes reaches ~step_20-25 in 10h
# (>= air/149's data-seen at plateau), enough to see if denser groups lift the ceiling.
#
# SUCCESS = conversion (EM|retrieved) climbs >73 sustained and/or EM > 58.5 (air/149 peak). Eval its
# checkpoints exactly like air/149: air/144 --override MODEL_PATH=<ckpt> (BARE /Volumes) EVAL_MAX_TURNS=12.
#   air run --file air/151_musique_grpo_t12_pureem_rn32.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-151-musique-grpo-t12-pureem-rn32
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN

  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  ROLLOUT_NNODES: '1'              # 1 trainer + 1 rollout (== air/149; NOT air/150's 1T+2R staleness)
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'
  ROLLOUT_PREFIX_CACHING: 'True'

  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  MULTI_TURN: 'True'
  MAX_TURNS: '12'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '4000'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/scripts/tools/qa_search_tools.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/qa_search_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: naive
  QA_RETRIEVAL_BONUS: '0.0'        # pure Search-R1 EM (the winner)

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'

  SAVE_FREQ: '10'                  # checkpoint every 10 syncs (each sync now = 64 samples)
  TEST_FREQ: '-1'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: musique-grpo-t12-pureem-rn32

max_retries: 0
timeout_minutes: 600

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/qa_musique/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/musique-grpo-t12-pureem-rn32
  total_epochs: 2
  ppo_mini_batch_size: 64          # was 32; raised WITH rollout_n so prompts/sync stays 2 (isolates density)
  rollout_n: 32                    # was 16; DENSER GRPO groups (the lever under test)
  total_rollout_steps: 3200
  max_prompt_length: 2048
  max_response_length: 512
  actor_lr: 2e-6

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
