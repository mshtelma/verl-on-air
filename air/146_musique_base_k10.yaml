# =============================================================================
# MuSiQue BASE re-baseline at top_k=10 -- the apples-to-apples reference for the air/145 run.
# The original 52% base (air/141) was measured at top_k=5. air/145 trains with top_k=10, which changes
# retrieval for BOTH models, so the trained checkpoints must be compared to the BASE evaluated under
# the SAME top_k=10 (+ same tool char caps), not to the old 52%. This job produces that reference.
#
# Identical to the air/144 eval harness except: MODEL_PATH = the untrained base 35B, QA_SEARCH_TOP_K=10,
# QA_TOOL_MAX_CHARS=7000, and dedicated output paths. Same 200 MuSiQue-dev / same big index / greedy EM.
#
#   air run --file air/146_musique_base_k10.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-146-musique-base-k10
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # Untrained base 35B -- the reference model.
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '32768'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: eval_search_agentic.py

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '10'            # match air/145's training-time retrieval
  QA_TOOL_MAX_CHARS: '7000'        # match air/145 so all 10 passages reach the model
  QA_VAL_PARQUET: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet

  EVAL_LIMIT: '200'                # same 200 dev Qs as air/141 for apples-to-apples
  EVAL_MAX_TURNS: '8'
  EVAL_MAX_TOKENS: '512'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  QA_REWARD_METRIC: em
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/musique_base_k10.json
  EVAL_TRACE_OUT: /Volumes/main/mshtelma/verl/eval/musique_base_k10_traces.jsonl

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
