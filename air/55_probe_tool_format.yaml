# =============================================================================
# air/55 — CHEAP de-risk of BUG 2 (tool-call format) before re-spending 32xH100.
# air/53 run3 emitted 120x "Failed to decode tool call: Expecting value: line 2
# column 1 (char 1)" and never ran the calculator: TOOL_FORMAT=hermes json.loads'd
# what Qwen3.5 actually emits. This job loads ONLY the Qwen3.5-35B-A3B TOKENIZER
# (no weights, no GPU compute -> seconds on 1xA10), renders the model's own chat
# template with the calculator tool + an assistant tool call, and round-trips it
# through verl v0.9.0's `qwen3_coder` and `hermes` parsers to prove which is right.
# PASS => flip air/53 TOOL_FORMAT to qwen3_coder with confidence (already staged).
#
#   air run --file air/55_probe_tool_format.yaml -p df1
# =============================================================================

experiment_name: verl-on-air-55-probe-tool-format
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v6

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN
  # The exact model air/53 trains — the tokenizer/chat_template is ground truth
  # for the tool-call wire format the model was trained to emit.
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B

max_retries: 0
timeout_minutes: 30

command: |
  python3 ${CODE_SOURCE_PATH}/scripts/probe_tool_format.py
