# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — easy-30 v4: ANTI-ABSTENTION + 3-phase funnel.
#
# Owner-directed fix for PREMATURE ABSTENTION (v3 easy: 10/30 abstained, and all 10 had
# gold answers; hard: 29/29 abstentions had gold). Diagnosis: 100% of abstainers had
# substantial retrieved data (median ~26 OK observations) -- they GAVE UP, they did not
# fail retrieval. So the fix is prompt/endgame, NOT more retrieval, NOT compaction.
#
# THREE changes (all in path_report_collect.py, CPU-tested 70/38/9):
#   1. Anti-abstention wording: the actor is told to commit its BEST SUPPORTED answer when it
#      has relevant figures, and to reserve "DATA NOT AVAILABLE" for genuinely-nothing-relevant.
#      (Grounded, not "always guess" -- the value-fabrication gate + judge zero out any
#      ungrounded attempt, so this cannot game the reward; it only recovers answerable ones.)
#   2. 3-phase funnel: explore (all tools) -> last OQ_NUDGE_WINDOW=20 steps forbid ALL retrieval
#      (search/grep/read/list), compute+submit stay -> last OQ_SUBMIT_ONLY_WINDOW=5 steps only
#      submit_report is available.
#   3. The ENTIRE structure (budget + both windows + anti-abstention) is stated PROMINENTLY in
#      the system prompt, filled with the real numbers, so the actor PLANS for it. This is the
#      key OOD guard: a model whose tools vanish unannounced drifts out-of-distribution; one told
#      the rules up front stays in its normal agentic regime.
#
# WHY easy-30 first: it is the clean A/B vs collect_v3/scored_v3 (same 30 Q; baseline 10 abstain,
# 14 scored). Easy episodes commit early, so the funnel is largely INERT here -- this isolates the
# anti-abstention PROMPT effect. The full funnel+budget gets its real test on hard (next job).
# Budget raised 48->80 (funnel caps gathering at turn 60 ~ like the well-behaved 64 hard run, so
# no extra OOD/overflow pressure); serve len at the model max.
#
#   air run --file air/95_officeqa_collect_easy_v4.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-95-officeqa-collect-easy-v4
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve (same model/TP as air/93; model-max context) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'         # model max; easy commits early so overflow risk is low
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: submit contract + anti-abstention + 3-phase funnel + PARALLEL ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '20'            # last 20 steps: forbid ALL retrieval (search/grep/read/list); compute stays
  OQ_SUBMIT_ONLY_WINDOW: '5'       # last 5 steps: submit_report is the ONLY tool
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: easy       # SAME 30 easy Q as v1/v2/v3 for a clean A/B on abstention
  OQ_COLLECT_LIMIT: '30'
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_easy_v4

  # --- corpus + questions (staged exactly as air/93) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding ------------------------------------------------------------
  EVAL_MAX_TURNS: '80'             # "even further" (v3 easy was 48); funnel caps gathering at turn 60
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 180                # 30 easy @ conc 16, most submit early, + cold model load

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
