# =============================================================================
# OfficeQA SYNTH-HARD DIFFICULTY PROBE -- FULL (1200 episodes = 150 questions x 8 samples).
#
# In-band difficulty filter for the 150 synthetic hard questions (officeqa_pilot_records/
# hard_synth_pilot_150.jsonl). Runs the BASE model as an agent @80 turns at TEMPERATURE 0.7 so
# each question is sampled 8x -> per-question answer-correctness PASS-RATE. Questions the base
# always solves (p~1) or never solves (p~0) give no GRPO gradient; the learnable band is the
# middle. Scoring is DETERMINISTIC answer-correctness (scripts/officeqa/hard_synth_probe.py
# score) -- no GPU judge needed for difficulty triage.
#
# The 8 samples/question are encoded as duplicated uids 'HS####_sK' in the probe CSV
# (scripts/officeqa/hard_synth_probe.py to-csv). FULL runs all 150 questions (OQ_COLLECT_LIMIT=0).
# Sized from the air/113 smoke: 48 ep in 33 min (single clean run) -> ~540-630 min collect here,
# so timeout 600. SAFETY: the collector writes one CLOSED parts/<uid>.json per episode (durable on
# the object-storage Volume the instant it completes), so an overrun/kill is fully salvageable --
# `hard_synth_probe.py aggregate --run-dir <dir>` rebuilds captures.jsonl from whatever finished,
# then a short top-up run covers any unfinished questions.
#
# Identical actor serve + funnel to air/97 (base@80) EXCEPT: synthetic CSV, temp 0.7, all 150 Qs,
# probe out dir.
#
#   air run --file air/114_officeqa_probe_synth_hard_full.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-114-officeqa-probe-synth-hard-full
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve: BASE model, 256k ctx (identical to air/97 base@80) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector over the SYNTHETIC probe CSV, temp 0.7 for sample variance ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '20'            # == air/97 base@80
  OQ_SUBMIT_ONLY_WINDOW: '5'
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'           # FULL: all 150 questions x 8 samples = 1200 episodes
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/synth_hard_probe.csv
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/probe_synth_hard_full

  # --- corpus (same clean corpus the questions were built from) ---
  OFFICEQA_STAGE: '1'
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding: temp 0.7 (SAMPLING -> per-question pass-rate) ---
  EVAL_MAX_TURNS: '80'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0.7'

max_retries: 1
# Sized from the air/113 smoke (48 ep / 33 min single clean run) -> ~540-630 min for 1200 ep, so
# 600 with the durable parts/ as the safety net for any overrun (aggregate + short top-up). NOTE:
# the smoke's FIRST attempt stalled and hit a 180-min wall -- that was an ANOMALY (the identical
# relaunch ran clean in 33 min), not a throughput limit; max_retries handles a hard failure, and
# durable per-episode writes handle a stall/overrun.
timeout_minutes: 600

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
