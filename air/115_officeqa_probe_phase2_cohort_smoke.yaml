# =============================================================================
# OfficeQA PHASE-2 COHORT DIFFICULTY PROBE -- SMOKE (192 episodes = 24 questions x 8 samples).
#
# First GPU probe of the NEW source-verified main-pool questions (officeqa_pipeline.py:
# fy_share_change + quarter_share_gap), AFTER the name-quality filter (officeqa_name_quality.py).
# These templates + this hint-free wording have NEVER been probed -- the old air/113/114 probe used
# the pre-source-verify truth-by-construction questions. This smoke validates the whole pipeline on
# the new format (clean CSV -> base actor retrieves from the SAME clean corpus with NO location
# hints -> captures -> CPU pass-rate) and calibrates timing/throughput/error before the full probe.
#
# Cohort: 16 fy_share_change + 8 quarter_share_gap, 22 distinct clean canonical concepts, |answer|
# 1.0-37.7pp (magnitude-floored to skip rounding-noise share changes), FY 1933-1972. Runs the BASE
# model as an agent @80 turns at TEMPERATURE 0.7 so each question is sampled 8x -> per-question
# answer-correctness PASS-RATE; the learnable band (mixed 1-7/8) is the GRPO-useful middle.
# Scoring is DETERMINISTIC answer-correctness (scripts/officeqa/hard_synth_probe.py score) against
# probe_cohort_smoke_key.json -- no GPU judge needed for difficulty triage.
#
# Identical actor serve + funnel to air/113 EXCEPT: phase-2 cohort CSV, all 192 rows, phase2 out dir.
#
#   air run --file air/115_officeqa_probe_phase2_cohort_smoke.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-115-officeqa-probe-phase2-cohort-smoke
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve: BASE model, 256k ctx (identical to air/113 base@80) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector over the PHASE-2 cohort CSV, temp 0.7 for sample variance ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '20'            # == air/113 base@80
  OQ_SUBMIT_ONLY_WINDOW: '5'
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'           # SMOKE CSV already IS the 24-question cohort (192 rows)
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/phase2/probe_cohort_smoke.csv
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/phase2/probe_cohort_smoke

  # --- corpus (the SAME clean corpus the questions were verified against) ---
  OFFICEQA_STAGE: '1'
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding: temp 0.7 (SAMPLING -> per-question pass-rate) ---
  EVAL_MAX_TURNS: '80'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0.7'

max_retries: 1
# 192 ep @80t. air/113 smoke: 48 ep in ~33 min (single clean run) -> ~130 min here; +staging/serve
# warmup. Budget 300 with margin. The collector writes one CLOSED parts/<uid>.json per completed
# episode (durable on the object-storage Volume), so an overrun/kill is fully salvageable:
# `hard_synth_probe.py aggregate --run-dir <dir>` rebuilds captures.jsonl from whatever finished.
timeout_minutes: 300

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
