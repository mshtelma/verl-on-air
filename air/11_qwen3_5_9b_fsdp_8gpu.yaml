# =============================================================================
# RUNG 2 — Qwen3.5-9B (dense) + Megatron-FSDP on one 8xH100 node.
#
# Same code path as rung 1 at a size where sharding actually matters, so this is
# where genuine Megatron-FSDP behaviour (all-gather/reduce-scatter overlap,
# DTensor checkpointing) first gets exercised. Still dense => EP=1.
#
# This is also the rung to use if you want to DEMO Megatron-FSDP on a single
# node: with a dense model, DP is unconstrained and FSDP shards cleanly, whereas
# 35B-A3B at EP=8 on 8 GPUs leaves expert-DP=1 and FSDP has nothing to shard.
# See docs/sizing.md.
#
#   air run --file air/11_qwen3_5_9b_fsdp_8gpu.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-11-qwen3_5-9b-fsdp
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: mshtelma/verl-megatron-air:v1

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN
  RAY_TEMP_DIR: /tmp/ray

  MEGATRON_MODE: fsdp
  OFFLOAD: '0'
  TP: '1'
  PP: '1'
  EP: '1'             # dense: no experts
  ETP: '1'
  GEN_TP: '4'
  ROLLOUT_GPU_MEM_UTIL: '0.6'
  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-9b-fsdp-8gpu

max_retries: 0
timeout_minutes: 150

parameters:
  model_name: Qwen/Qwen3.5-9B
  train_files: /Volumes/main/mshtelma/verl/data/geo3k/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/geo3k/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-9b-fsdp
  total_epochs: 1
  total_training_steps: 3
  train_batch_size: 32
  ppo_mini_batch_size: 32
  rollout_n: 5
  max_prompt_length: 1024
  max_response_length: 2048
  image_key: images

command: bash /app/scripts/run_grpo_megatron.sh
