# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — Deliverable B v3 (bigger turn budget).
#
# Same submit-contract + endgame-window collector as air/87 (v2), but with a much
# larger turn budget to test the v2 findings:
#   * v2 finding #3 (premature abstention): 7/7 abstained questions had real answers;
#     the window=6 lockout of 24 turns plausibly cut retrieval too early. A 48-turn
#     budget gives ~42 turns of unrestricted exploration before the final-6 lockout.
#   * headroom for genuinely long retrieval chains (hard questions need 50+ turns).
# The submit-tool `path` stringify bug found in v2 is fixed in the collector
# (path_report_collect._report_text_from_submit), so v3 captures parse natively.
#
# Turn budget is EVAL_MAX_TURNS (48 here). The actor (Qwen3.5-35B-A3B) supports a
# 262,144-token context; EVAL_SERVE_LEN=196608 holds a 48-turn transcript with large
# table reads. Collection is SEQUENTIAL (one episode at a time) so the long context
# costs no concurrency; only stragglers that use the full budget run longer (most
# episodes submit early). For even harder questions, raise both knobs together.
#
# Scoring is the separate air/92 job (serves GLM-5.3 at 256k seq len).
#
#   air run --file air/91_officeqa_collect_deliverable_b_v3.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-91-officeqa-collect-deliverable-b-v3
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve (same model/TP as air/87; larger serve window for the 48-turn budget) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '196608'         # 192k: 48-turn transcript w/ large table reads (model max 262k)
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + endgame window (the report-yield fix, path-decode fixed) ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '6'             # last 6 of 48 turns: nudge + lock search/grep (compute stays)
  OQ_COLLECT_DIFFICULTY: easy       # same split as v1/v2 for a clean A/B/C
  OQ_COLLECT_LIMIT: '30'
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_v3

  # --- corpus + questions (staged exactly as air/87) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (matched to air/87 except the larger turn budget) ---------
  EVAL_MAX_TURNS: '48'             # BIGGER budget (v2 was 24; v1 was 16)
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 300                # 48-turn cap x 30 sequential episodes (most submit early) + cold load

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
