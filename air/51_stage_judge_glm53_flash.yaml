# =============================================================================
# AGENTIC STEP 2 — stage the JUDGE model (GLM-5.3-Flash, FP8) into UC, once.
#
# GLM-5.3-Flash (zai-org/GLM-5.3-Flash): 320B total / 18B active MoE, MIT license,
# natively multimodal. The FP8 base checkpoint (~226 GB, 62 shards) is the H100
# lane (NVFP4 quants are Blackwell/FP4-only and had day-0 corruption bugs). ~226 GB
# fp8 -> ~28 GB/GPU at TP8 on an 8xH100 node, leaving ample KV headroom.
#
# Same mechanism as air/02b (stage_model.py: per-shard download to scratch, then
# sequential FUSE copy; resumable). Staging ONCE to UC means serve-flag iteration
# on this <1-month-old arch (air/52) never re-pulls 226 GB. Runs on 1xA10 (pure
# network + disk). HF_HUB_DISABLE_XET=1 because UC Volumes FUSE rejects Xet writes.
#
#   air run --file air/51_stage_judge_glm53_flash.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-51-stage-judge-glm53-flash
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  version: '5'
  dependencies:
    - huggingface_hub>=0.34
    - hf_transfer

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  HF_HUB_DISABLE_XET: '1'         # UC Volumes FUSE rejects Xet/CAS parallel range writes
  OPENSSL_FORCE_FIPS_MODE: '0'
  MODEL_ID: zai-org/GLM-5.3-Flash
  MODEL_DIR: /Volumes/main/mshtelma/verl/models/GLM-5.3-Flash
  SCRATCH_DIR: /local_disk0/hf_stage

max_retries: 2               # resumable; a retry skips already-staged shards
timeout_minutes: 300         # ~226 GB over download + sequential FUSE copy

command: python3 ${CODE_SOURCE_PATH}/scripts/stage_model.py
