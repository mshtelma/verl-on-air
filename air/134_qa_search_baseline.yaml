# =============================================================================
# AGENTIC SEARCH BASELINE — base Qwen3.5-35B-A3B, agentic, HotpotQA held-out dev.
#
# THE GO/NO-GO for the RL run. Serves the BASE model and runs the agentic search eval
# (scripts/eval_search_agentic.py) over the held-out dev set, retrieving from the Vector Search
# index. Same harness/settings will re-run on the RL checkpoint; the EM delta is the deliverable.
#
# READ: if the base lands in a workable band (~30-55% EM, with WRONG answers not just no-answers)
# there is GRPO signal -> proceed to the full train run. If ~0-15% it may be too hard for signal
# (loosen to cover_em, raise top_k/turns); if already high the model is near-saturated here too.
#
# PREREQS: air/131 (data) + air/133 (VS index ONLINE).
#
#   air run --file air/134_qa_search_baseline.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-134-qa-search-baseline
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '32768'          # 8 turns x (short prompt + ~4k-char tool outputs), ample headroom
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: eval_search_agentic.py

  # Vector Search backend for the tools (built by air/133; same df1 workspace -> ambient auth).
  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_corpus_index
  QA_SEARCH_TOP_K: '5'
  QA_VAL_PARQUET: /Volumes/main/mshtelma/verl/data/qa_search/test.parquet

  EVAL_LIMIT: '200'                # probe subset of the 500-row dev set
  EVAL_MAX_TURNS: '8'
  EVAL_MAX_TOKENS: '512'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  QA_REWARD_METRIC: em             # headline; cover_em also reported
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/qa_search_base.json
  EVAL_TRACE_OUT: /Volumes/main/mshtelma/verl/eval/qa_search_base_traces.jsonl

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  # The search tools query Vector Search over REST via the PREINSTALLED databricks-sdk (0.139.0),
  # so there is NO pip install: installing databricks-vectorsearch downgraded protobuf below the
  # image's vLLM gencode and stopped vLLM from starting (air/134 first attempt). Ambient auth in-job.
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
