# =============================================================================
# MuSiQue AGENTIC-SEARCH GRPO v2 -- RETRIEVAL-AWARE reward + top_k=10.
# The diagnostic (scripts/qa_search/diagnose_traces.py on the air/144 ladder traces) showed EM is
# almost exactly recall x conversion, and that the air/143 pure-EM run IMPROVED conversion
# (EM|retrieved 65.8%->77.2%) but REGRESSED retrieval recall (79.0%->72.5%) -- the model learned to
# search less thoroughly because only the final answer was rewarded. Net EM only +4 (52->56).
#
# This run attacks the recall regression with TWO levers, holding everything else == air/143 so the
# effect is attributable:
#   (1) QA_RETRIEVAL_BONUS=0.2 -- the reward now gives a WRONG answer a small additive credit when the
#       trajectory SURFACED a gold answer in a retrieved passage (detected inside <tool_response> spans
#       only -> not farmable by echoing the gold in reasoning; see scripts/reward/qa_search_reward.py
#       + tests). A correct answer still scores exactly 1.0, so reward stays in [0,1] and standard GRPO
#       norm applies. This keeps recall high AND densifies the signal on all-wrong GRPO groups.
#   (2) QA_SEARCH_TOP_K=10 (was 5) -- more passages per query directly lifts recall. 10x ~600-char
#       snippets ~ 6.6k chars, so the tool-side clip (QA_TOOL_MAX_CHARS) and the loop-side tool cap
#       (MAX_TOOL_RESPONSE_LEN) are both raised 4000->7000 so all 10 actually reach the model.
#
# EM = recall x conversion, so protecting recall at ~79 with the +11pt conversion already learned
# projects to ~61%; top_k lifting recall toward ~85 projects to ~65%. (Projection, not a promise.)
#
# APPLES-TO-APPLES EVAL: the 52% base was measured at top_k=5. Because top_k=10 changes retrieval for
# BOTH models, the trained checkpoints must be compared to a FRESH base baseline at top_k=10
# (air/146_musique_base_k10.yaml), NOT to the old 52%. Trained-ckpt eval = air/144 with overrides:
#   env_variables.MODEL_PATH / EVAL_MODEL_PATH = <ckpt>/actor/model/huggingface,
#   env_variables.QA_SEARCH_TOP_K=10, env_variables.QA_TOOL_MAX_CHARS=7000, env_variables.EVAL_OUT=...
#
# Two nodes / 16xH100, judge-free.  air run --file air/145_musique_grpo_retrieval.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-145-musique-grpo-retrieval
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN

  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'
  ROLLOUT_PREFIX_CACHING: 'True'   # SAFE: verl flushes the prefix cache on each weight sync

  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  MULTI_TURN: 'True'
  MAX_TURNS: '8'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '7000'    # was 4000; fits top_k=10 x ~600-char snippets (loop-side cap)
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/scripts/tools/qa_search_tools.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/qa_search_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: naive
  QA_RETRIEVAL_BONUS: '0.2'        # NEW: additive credit for surfacing the gold (recall shaping)

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '10'            # was 5; more passages/query -> higher retrieval recall
  QA_TOOL_MAX_CHARS: '7000'        # was default 4000; tool-side clip must fit 10 passages

  SAVE_FREQ: '10'                  # checkpoint every 10 syncs (HF export -> eval ladder)
  TEST_FREQ: '-1'                  # eval offline on saved checkpoints (air/144-style), not inline

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: musique-grpo-retrieval

max_retries: 0
timeout_minutes: 600

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/qa_musique/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/musique-grpo-retrieval
  total_epochs: 2
  ppo_mini_batch_size: 32
  rollout_n: 16
  total_rollout_steps: 3200
  max_prompt_length: 2048
  max_response_length: 512
  actor_lr: 2e-6

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
