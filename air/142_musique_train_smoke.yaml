# =============================================================================
# MuSiQue AGENTIC-SEARCH TRAINING SMOKE — judge-free (rule-based EM reward).
# Proves the training-side rollout wiring on MuSiQue + the big union index before the full run:
#   * stock ToolAgentLoop + 3 @function_tools (vector_search/keyword_search/read_article) querying
#     Vector Search over REST via the PREINSTALLED databricks-sdk (NO pip install -> vLLM protobuf
#     stays intact, the air/134 lesson);
#   * rule-based EM reward (qa_search_reward.py), REWARD_MANAGER=naive, binary reward -> standard
#     GRPO norm (NORM_ADV_BY_STD default; unlike the graded OfficeQA reward);
#   * launcher AGENT_LOOP_CONFIG_PATH default fix (air/132 first attempt);
#   * tiny LR, 2 syncs -> proves wiring + retrieval-under-rollout QPS + THE OPEN QUESTION: does
#     ambient VS auth reach verl's Ray rollout actors? (baseline air/141 only proved it in the main
#     eval process.) If tool_errors spike here, capture host+token in dispatch_agentic.sh and export.
#
# Two nodes / 16xH100, judge-free (TRAINING_NODES==all). MuSiQue episodes ~ 8*(2048+512)=20k tokens.
#   air run --file air/142_musique_train_smoke.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-142-musique-train-smoke
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16          # 2 nodes x 8 H100: 1 trainer + 1 Rollouter
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'

  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  MULTI_TURN: 'True'
  MAX_TURNS: '8'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '4000'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/scripts/tools/qa_search_tools.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/qa_search_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: naive

  # Bigger union index (built by air/139/140; same df1 workspace -> ambient auth, no pip install).
  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: musique-train-smoke

max_retries: 0
timeout_minutes: 120

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/qa_musique/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/musique-train-smoke
  total_epochs: 1
  ppo_mini_batch_size: 16
  rollout_n: 8
  total_rollout_steps: 32         # 2 full 16-sample syncs
  max_prompt_length: 2048
  max_response_length: 512        # per-turn; episode budget ~ 8*(2048+512) = 20k
  actor_lr: 1e-6                  # smoke: wiring, not learning

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
