# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — 133 HARD, BASE model, at the 16-TURN TRAINING FUNNEL.
#
# This is the BASE arm of the base-vs-trained hard-Q A/B for the air/102 GRPO run. To measure
# what training actually did, both arms are evaluated IN-DISTRIBUTION: the exact funnel the model
# trained under (air/102: MAX_TURNS=16, OQ_NUDGE_WINDOW=4, OQ_SUBMIT_ONLY_WINDOW=2), NOT air/97's
# 80-turn regime. (air/97/98 "scored_hard_v4" is an 80-turn base baseline and is NOT comparable to
# a 16-turn-trained model, so it is not reused here.) The trained arm (air/105, once the air/102
# checkpoint lands) uses IDENTICAL knobs with only EVAL_MODEL_PATH/MODEL_PATH swapped -> a clean A/B.
#
# Derived from air/97 (same corpus/questions/scorer contract). Changed vs air/97:
#   * EVAL_MAX_TURNS 80 -> 16                 (== air/102 MAX_TURNS)
#   * OQ_NUDGE_WINDOW 20 -> 4                 (== air/102 OQ_NUDGE_WINDOW: last 4 turns lock retrieval)
#   * OQ_SUBMIT_ONLY_WINDOW 5 -> 2            (== air/102 OQ_SUBMIT_ONLY_WINDOW: last 2 turns submit-only)
#   * EVAL_SERVE_LEN 262144 -> 131072         (16 turns needs << 256k; 128k is ample + servable 8xH100)
#   * OQ_COLLECT_OUT -> .../collect_hard_base16
#   * timeout 300 -> 180                       (16-turn episodes are ~1/5 the length of 80-turn)
# Everything else (model=BASE, TP8, corpus, top_k, temperature 0, require-submit, concurrency 16,
# difficulty hard, limit 0=all 133) is VERBATIM from air/97 so the harness behaviour is identical.
#
# Scoring is the separate air/104 job (same validated judge + gates + answer-key as air/98).
#
#   air run --file air/103_officeqa_collect_hard_base16.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-103-officeqa-collect-hard-base16
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve: BASE model, same TP as air/97; right-sized context for 16 turns ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '131072'         # 128k: 16 turns x (<=2048 gen + <=2048 tool) ~= 67k -> 128k is 2x headroom
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + IN-DISTRIBUTION 16-turn 3-phase funnel + PARALLEL ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '4'             # last 4 of 16: forbid ALL retrieval (search/grep/read/list); compute stays
  OQ_SUBMIT_ONLY_WINDOW: '2'       # last 2 of 16: submit_report is the ONLY tool
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'            # 0 = ALL hard questions (133 in officeqa_full.csv)
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard_base16

  # --- corpus + questions (staged exactly as air/97) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (matched to air/97 except the 16-turn budget) ---------
  EVAL_MAX_TURNS: '16'             # == air/102 training MAX_TURNS (in-distribution)
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 180                # 16-way overlap of 133 hard @ 16 turns + cold model load

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
