# =============================================================================
# MuSiQue BASELINE (bigger corpus) -- the re-probe / go-no-go after the HotpotQA pivot.
# Serves base Qwen3.5-35B-A3B and runs the agentic search eval over MuSiQue held-out dev, retrieving
# from the BIGGER union index (wiki_qa_big_corpus_index). Same harness as air/134; the EM number tells
# us whether MuSiQue+bigcorpus lands in the learnable band (~30-45%). If still too easy -> escalate to
# full wiki-18 (21M). If workable -> proceed to GRPO training.
# PREREQS: air/138 (data+corpus) + air/139/140 (big index ONLINE).
#
#   air run --file air/141_musique_baseline.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-141-musique-baseline
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '32768'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: eval_search_agentic.py

  # Bigger union index (built by air/139/140; same df1 workspace -> ambient auth, no pip install).
  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'
  QA_VAL_PARQUET: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet

  EVAL_LIMIT: '200'
  EVAL_MAX_TURNS: '8'
  EVAL_MAX_TOKENS: '512'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  QA_REWARD_METRIC: em
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/musique_base.json
  EVAL_TRACE_OUT: /Volumes/main/mshtelma/verl/eval/musique_base_traces.jsonl

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
