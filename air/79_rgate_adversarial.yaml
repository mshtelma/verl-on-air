# =============================================================================
# R-GATE: adversarial reward-trust probe. Serve the full GLM-5.3 judge at TP16 and
# grade a small set of HAND-CRAFTED right-number / wrong-route trajectories
# (scripts/reward/tests/rgate_adversarial.jsonl, built by make_rgate_fixtures.py):
#   RG02 total-vs-component, RG03 wrong-period, RG04 unsupported guess,
#   RG05 fabricated evidence, RG06 composite missing component  -> expect LUCKY;
#   RG01 grounded, RG07 valid ALT source, RG08 padded-but-grounded -> expect GROUNDED;
#   RG09 wrong number -> gated.
# The reward-trust question (docs plan Section 6.5, Gate R): does the judge FLAG the
# lucky cases (lucky_wrong_source / support=false / low route) instead of crediting a
# correct number reached by the wrong route? This is the gate the pilot never closed.
#
# JUDGE = full GLM-5.3 (GlmMoeDsaForCausalLM, native FP8) at TP16 across 2x 8xH100 --
# the SAME judge that will drive training (user: full GLM-5.3, not Flash). Reuses the
# proven serve_judge.sh path from air/52c/air/73. Difference vs air/73: the judge now
# sees the WHOLE trajectory (JUDGE_MAX_MODEL_LEN 131072, OQ_JUDGE_TRAJ_CHARS 0 = no
# head/tail truncation; over-budget -> quarantine), and it scores the R-gate fixtures.
#
#   air run --file air/79_rgate_adversarial.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-79-rgate-adversarial
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16               # 2x 8xH100 -> TP16 for the 755 GB FP8 judge
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'

  # --- judge serve (full GLM-5.3, TP16, 2 nodes) -- proven config from air/52c/73 ---
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_SERVED_NAME: judge
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_MAX_MODEL_LEN: '131072'                 # judge must see the WHOLE trajectory (no head/tail truncation)
  JUDGE_HEALTH_TIMEOUT: '2400'                  # first cross-node TP16 load of 755 GB
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  # --- run the grounded-reward scorer over the R-gate fixtures ---
  OQ_SCORE_TRAJECTORIES: '1'
  OQ_TRACES_IN: reward/tests/rgate_adversarial.jsonl   # snapshot-relative (travels with the code)
  OQ_SCORES_OUT: /Volumes/main/mshtelma/verl/eval/rgate_scores.jsonl
  OQ_SCORE_LIMIT: '0'                           # all 9 fixtures
  OQ_JUDGE_ALL: '1'                             # judge every fixture incl. the wrong-answer control
  OQ_REWARD_MODE: grounded
  OQ_TIGHT_TOL: '0.0'

  # --- judge client: WHOLE trajectory, fail-closed over budget ---
  JUDGE_MODEL: judge
  JUDGE_REASONING_EFFORT: high                  # GLM-5.3: low|high|max; default "max" overran the budget
  JUDGE_MAX_TOKENS: '10240'
  JUDGE_TEMPERATURE: '0'
  JUDGE_TIMEOUT: '600'
  JUDGE_CONCURRENCY: '4'                         # only 9 records; keep it gentle
  JUDGE_DEBUG: '1'
  OQ_JUDGE_TRAJ_CHARS: '0'                       # 0 = send the whole trajectory (no truncation)
  OQ_JUDGE_TRAJ_MAX: '300000'                    # hard ceiling -> quarantine rather than truncate

max_retries: 0
timeout_minutes: 90

# AI Runtime runs this once per node: rank 0 = Ray head + API server + the scorer,
# rank 1 = Ray worker that joins and idles until the head's Ray port closes.
command: bash ${CODE_SOURCE_PATH}/scripts/serve_judge.sh
