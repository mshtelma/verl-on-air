# =============================================================================
# OfficeQA PATH-REPORT COLLECTOR SMOKE — 1-2 real EASY questions, base actor.
#
# Purpose (handoff Section 6, pilot Section 7 step 2): prove the LIVE collector
# end-to-end on GPU before any full collection. It serves the base actor
# (Qwen3.5-35B-A3B, the same model + serving path as air/71's eval), stages the
# Treasury corpus, then drives the terminal-JSON path-report contract through the
# INSPECTION-VERIFIED wrapper in scripts/officeqa/path_report_collect.py
# (reuses eval_officeqa_agentic's tokenizer/parser/tool primitives).
#
# What this smoke ANSWERS (the only things still unverified after CPU work):
#   * does the served model emit parseable qwen3_coder tool calls in this harness,
#   * does it (sometimes) emit ONE terminal JSON {answer, path:[...]} object,
#   * are runtime observation IDs delivered + cited, delivery/chronology recorded.
# It is NOT a measurement: no scoring, no judge, no reward. Inspect the capture
# record by hand (termination, observations[].delivered_to_request, terminal_text)
# then STOP for review (do not chain a full collection off a green smoke).
#
# Scoring is OFFLINE and separate: path_report_pilot.py --episodes <captures.jsonl>
# --judge-base-url <GLM-5.3 endpoint>. This job writes ONLY the capture record.
#
#   air run --file air/84_officeqa_collect_smoke.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-84-officeqa-collect-smoke
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve (identical to air/71 baseline: same model, TP, serve len) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '49152'          # multi-turn (16) + large table tool outputs
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- run the collector instead of the eval client -----------------------------
  # serve_and_eval.sh exports EVAL_BASE_URL/EVAL_MODEL after /health, then runs this
  # script with NO CLI args; OQ_COLLECT_LIVE=1 makes it collect from env (_live_from_env).
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_COLLECT_DIFFICULTY: easy       # 1-2 EASY questions for the smoke
  OQ_COLLECT_LIMIT: '2'
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/collect_smoke_v1

  # --- corpus + questions (staged exactly as air/71) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (base-actor defaults, matched to air/71) ------------------
  EVAL_MAX_TURNS: '16'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 90

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
