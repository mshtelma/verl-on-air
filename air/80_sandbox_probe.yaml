# =============================================================================
# SANDBOX VIABILITY PROBE (Gate S). Does the df1 serverless-GPU runtime PERMIT
# unprivileged user namespaces? That is the prerequisite for the compute tool's
# bubblewrap OS sandbox (scripts/tools/py_compute.py): we own the image and will
# install `bwrap`, but only the RUNTIME (k8s / seccomp / AppArmor) can grant userns
# -- so probe it DIRECTLY before spending a full v7 rebuild.
#
# Runs on the CURRENT v6 (bwrap not installed there yet): the decisive line is the
# `USERNS(user+mnt+net)` unshare() attempt. OK  -> bwrap will work once installed
# (rebuild v7, wire the sandbox); BLOCKED -> pivot to the honest no-FS/net-boundary
# fallback (process + rlimits only, documented as such). 1xA10, CPU-bound, cheap.
#
#   air run --file air/80_sandbox_probe.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-80-sandbox-probe
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'

max_retries: 0
timeout_minutes: 20

command: python3 ${CODE_SOURCE_PATH}/scripts/tools/sandbox_probe.py
