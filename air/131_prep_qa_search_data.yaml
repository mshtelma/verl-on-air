# =============================================================================
# AGENTIC SEARCH/RAG (NQ + HotpotQA) DATA PREP — Search-R1 style.
# Produces, on the Volume, everything the training job and the Vector Search index need:
#   * train.parquet / test.parquet   (verl tool-agent schema; scripts/prep_nq_hotpotqa_agentic.py)
#   * corpus.parquet                  (curated Wikipedia subset: HotpotQA gold+distractor paragraphs,
#                                       deduped by title; scripts/qa_search/build_corpus.py)
# MVP = HotpotQA only (self-contained corpus + the multi-hop showcase). Add NQ later once the
# wiki-18 subset backs NQ retrieval (QA_DATASETS=hotpotqa,nq + a corpus seed).
#
# HotpotQA/NQ are PUBLIC on HF; HF_TOKEN just avoids anonymous rate limits.
# After this job, build the Vector Search index (see scripts/qa_search/create_vs_index.py) before
# air/132.
#
#   air run --file air/131_prep_qa_search_data.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-131-prep-qa-search-data
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  QA_HF_CACHE: /local_disk0/hf_cache

  QA_DATASETS: hotpotqa                 # MVP; set 'hotpotqa,nq' once NQ corpus seed exists
  QA_TOOL_OUT_DIR: /Volumes/main/mshtelma/verl/data/qa_search
  QA_CORPUS_OUT: /Volumes/main/mshtelma/verl/data/qa_search/corpus.parquet
  QA_PREP_TRAIN_LIMIT: '0'              # 0 = all HotpotQA train (~90k)
  QA_PREP_VAL_LIMIT: '500'             # held-out dev slice for baseline/eval
  QA_CORPUS_SPLITS: train,validation

secrets:
  HF_TOKEN: 'msh/hf_token'

max_retries: 0
timeout_minutes: 60

command: |
  set -euo pipefail
  python3 ${CODE_SOURCE_PATH}/scripts/prep_nq_hotpotqa_agentic.py
  python3 ${CODE_SOURCE_PATH}/scripts/qa_search/build_corpus.py
