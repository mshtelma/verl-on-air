# =============================================================================
# STEP 2 — stage Qwen3.5-35B-A3B (~70 GB) into the UC Volume, once.
#
# Do NOT skip this and let training pull from HF: that is 10-20 min of paid
# H100 time on EVERY run. Stage once, then point model_name at the Volume.
#
#   air run --file air/02_stage_model.yaml -p df1 --watch
#
# Runs on 1xA10 because this is pure network+disk; no GPU work happens.
# Volume needs ~150 GB total across model + data + checkpoints.
# =============================================================================

experiment_name: verl-on-air-02-stage-model

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: mshtelma/verl-megatron-air:v1

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'   # ~3-5x faster than the pure-python downloader
  HF_MAX_WORKERS: '8'
  OPENSSL_FORCE_FIPS_MODE: '0'
  MODEL_ID: Qwen/Qwen3.5-35B-A3B
  MODEL_DIR: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B

# Qwen3.5 is Apache-2.0 and public, so no HF_TOKEN. For a gated model add:
# secrets:
#   HF_TOKEN: 'my_scope/hf_token'

max_retries: 1
timeout_minutes: 120

command: python3 /app/scripts/stage_model.py
