# =============================================================================
# MuSiQue AGENTIC-SEARCH GRPO v3 -- RETRIEVAL-AWARE reward + MAX_TURNS=12 (at top_k=5).
# Supersedes air/145 (killed): the base@k10 re-baseline proved top_k=10 does NOT lift recall
# (79->78, flat) -- for multi-hop, recall is gated by QUERY FORMULATION and TURN BUDGET, not passage
# depth. And a turn-budget analysis of the base traces showed the real wall: 47% of base episodes hit
# the 8-turn cap and 75% of RETRIEVAL misses were still searching when cut off. Pure-EM GRPO (air/143)
# made it worse by teaching the model to quit early (at-cap 94->35 /200) -- the same behaviour that
# dropped recall 79->72.5%.
#
# So this run drops the depth lever and applies the TWO levers the data supports, both attacking
# "quit early / can't search enough -> low recall":
#   (1) QA_RETRIEVAL_BONUS=0.2 -- small additive credit to a WRONG answer that SURFACED the gold in a
#       <tool_response> (not farmable via reasoning; scripts/reward/qa_search_reward.py, 20/20 tests).
#       Keeps recall high + densifies signal on all-wrong GRPO groups. Correct still = exactly 1.0.
#   (2) MAX_TURNS 8->12 -- headroom so the reward-driven "keep searching until the gold surfaces"
#       behaviour isn't capped. Synergistic with (1). k5 tool responses (~3k chars) keep episodes
#       light enough that 12 turns stays well under the actor-backward memory ceiling (air/143 @8t
#       peaked ~43/80GB; ~12t projects ~55-60GB).
#
# Everything else == air/143 (top_k=5, caps default 4000, rollout_n16/ppo_mini32/lr2e-6) so the effect
# is attributable to {reward + turns}. EVAL at MAX_TURNS=12 vs the base@12 re-baseline (air/148), NOT
# vs the old 52% (base@8) -- the base is turn-starved at 8 so its fair reference is higher.
#   air run --file air/147_musique_grpo_rr_t12.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-147-musique-grpo-rr-t12
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN

  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'
  ROLLOUT_PREFIX_CACHING: 'True'   # SAFE: verl flushes the prefix cache on each weight sync

  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  MULTI_TURN: 'True'
  MAX_TURNS: '12'                  # was 8; base hit the 8-cap on 47% of episodes / 75% of retrieval misses
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '4000'    # k5 default (reverted from air/145's 7000)
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/scripts/tools/qa_search_tools.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/qa_search_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: naive
  QA_RETRIEVAL_BONUS: '0.2'        # recall shaping (the proven lever)

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'             # reverted from 10 (depth proved a dud for recall)

  SAVE_FREQ: '10'                  # checkpoint every 10 syncs (HF export -> eval ladder)
  TEST_FREQ: '-1'                  # eval offline on saved checkpoints (air/144-style), not inline

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: musique-grpo-rr-t12

max_retries: 0
timeout_minutes: 600

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/qa_musique/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/musique-grpo-rr-t12
  total_epochs: 2
  ppo_mini_batch_size: 32
  rollout_n: 16
  total_rollout_steps: 3200
  max_prompt_length: 2048
  max_response_length: 512
  actor_lr: 2e-6

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
