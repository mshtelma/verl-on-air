# =============================================================================
# RUNG 3 — Qwen3.5-35B-A3B MoE, CLASSIC Megatron on ONE 8xH100 node.
#
# This is the KNOWN-GOOD baseline: it reproduces the exact topology verl says it
# tested in examples/grpo_trainer/run_qwen3_5_35b_megatron.sh
#   "Tested parallelism config (8 GPUs / 1 node): TP=2 PP=1 CP=1 EP=8 ETP=1 GEN_TP=8"
# with ALL_OFFLOAD=True. Corroborated by verl's perf table for the near-identical
# Qwen3-30B-A3B (8 GPUs / EP=8 / full offload / MFU 0.40).
#
# HOW IT FITS: the distributed optimizer is ZeRO-1 — it shards optimizer state
# across DP but REPLICATES params and grads. With EP=8 on 8 GPUs, expert-DP=1, so
# ~390 GB of Adam state has nowhere to go on-device and is parked in HOST RAM
# (optimizer_offload_fraction=1). Budget ~400-500 GB CPU RAM per node; step 0's
# smoke test prints the actual figure. If host RAM is short, go to rung 4.
#
# Run this first if rung 4 misbehaves — it isolates "MoE model too big" from
# "Megatron-FSDP wiring".
#
#   air run --file air/20_qwen3_5_35b_classic_8gpu.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-20-qwen3_5-35b-classic
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v2

env_variables:
  HF_HOME: /tmp/hf
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN
  RAY_TEMP_DIR: /tmp/ray

  MEGATRON_MODE: classic     # legacy mbridge + distributed optimizer (ZeRO-1)
  OFFLOAD: '1'               # mandatory at 8 GPUs; see docs/sizing.md
  OFFLOAD_FRACTION: '1'
  TP: '2'                    # must divide 16 attention heads
  PP: '1'
  CP: '1'
  EP: '8'                    # 256 experts -> 32 experts/rank
  ETP: '1'
  GEN_TP: '8'                # vLLM TP within the node (NVLink)
  ROLLOUT_GPU_MEM_UTIL: '0.6'
  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-35b-classic-8gpu

max_retries: 0
timeout_minutes: 300

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/geo3k/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/geo3k/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-classic
  total_epochs: 1
  total_training_steps: 3      # smoke; set 0 to remove the cap
  train_batch_size: 32         # (32 * 5) % 8 == 0
  ppo_mini_batch_size: 32
  rollout_n: 5
  max_prompt_length: 1024
  max_response_length: 2048
  actor_lr: 1e-6
  image_key: images

command: bash /app/scripts/run_grpo_megatron.sh
