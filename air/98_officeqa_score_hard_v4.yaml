# =============================================================================
# OfficeQA PATH-REPORT SCORING — ALL 133 HARD v4 (anti-abstention funnel captures).
#
# Scores air/97 with the SAME validated judge + deterministic gates + answer-key labeling
# as air/94/96, three SEPARATE labels, OFFLINE PREVIEWS. Right-sized 128k judge
# (JUDGE_MAX_MODEL_LEN=131072): 262144 does NOT fit GLM-5.3 KV on 16xH100, and the judge
# request MEASURED <=141k chars (~59k tokens) even on air/93's 63-observation hard reports,
# so 128k is >2x headroom and 0 UNKNOWN held on air/94. Parallel scorer (conc 8).
#
# Compare scored_hard_v4 to scored_hard (air/94, the pre-funnel hard baseline):
#   * abstention should fall from 29 (the funnel + anti-abstention prompt push commitment);
#   * n_scored / answered should rise IF the recovered commitments are correct+supported;
#   * faithfulness must hold -- n_ref_invalid / n_value_fabricated stay ~0 among SCORED
#     (the gates zero any ungrounded "best estimate", so pushing for answers cannot inflate).
# The crown-jewel contract check to re-confirm on more data: correct answers with an
# unsupported/fabricated path get ZEROED (air/94 zeroed 4 lucky-right + caught 2 fabrications).
#
# Exits non-zero only on an integrity violation.
#
# PRECONDITION: air/97 must have written captures.jsonl to OQ_EPISODES_FILE below.
#
#   air run --file air/98_officeqa_score_hard_v4.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-98-officeqa-score-hard-v4
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16               # 2x 8xH100 -> TP16 for the 755 GB FP8 judge
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'

  # --- judge serve (full GLM-5.3, TP16, 2 nodes) -- proven config from air/92/94/96 ---
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_SERVED_NAME: judge
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_MAX_MODEL_LEN: '131072'                 # 128k: right-sized + fits KV (256k does NOT; see air/94)
  JUDGE_HEALTH_TIMEOUT: '2400'
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  # --- score the hard v4 captures with the full tool history ---
  OQ_SCORE_EPISODES: '1'
  OQ_EPISODES_FILE: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard_v4/captures.jsonl
  OQ_SCORE_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/scored_hard_v4   # immutable
  OQ_ANSWER_KEY: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OQ_ANSWER_TOL: '0.0'
  OQ_SCORE_MAX_RETRIES: '2'
  OQ_MAX_HISTORY_BYTES: '480000'                # never binds (hard max request ~141k chars ~= 59k tokens)
  OQ_SCORE_CONCURRENCY: '8'                     # parallel judge calls (I/O-bound); ~100+ valid hard reports

  # --- judge client knobs (path_report_pilot.make_http_judge reads these) ---
  JUDGE_MODEL: judge
  JUDGE_REASONING_EFFORT: high
  JUDGE_MAX_TOKENS: '10240'
  JUDGE_TEMPERATURE: '0'
  JUDGE_TIMEOUT: '900'

max_retries: 0
timeout_minutes: 210                             # 133 hard reports x (gates + judge) at conc 8 + judge cold-load

command: bash ${CODE_SOURCE_PATH}/scripts/serve_judge.sh
