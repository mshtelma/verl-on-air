# =============================================================================
# STEP 2c — convert the staged Qwen3.5-122B-A10B HF safetensors into a Megatron
#           dist_checkpointing tree, so RL training can run with
#           `*.megatron.use_dist_checkpointing=True` + `.dist_checkpointing_path`.
#
# WHY: verl's checkpoint save couples model-save FORMAT to use_dist_checkpointing:
#   with it False (default) the `model` content is exported as a FULL-GATHER HF
#   file via mbridge -> OOM at 122B (run 444713674103804: _save_model_as_hf_via
#   _bridge, needed 3 GiB with 2.45 free). With it True the save is a sharded
#   dist checkpoint (no gather) -- but that same flag ALSO switches INIT to load
#   from a dist checkpoint instead of HF. So we must first produce that dist
#   checkpoint from HF. The stock scripts/converter_hf_to_mcore.py can't: these
#   are multimodal `Qwen3_5MoeForConditionalGeneration` (text_config+vision_config)
#   and it has no branch for that arch. scripts/convert_hf_to_mcore_dist.py reuses
#   verl's own vanilla-mbridge build+load path instead (proven by the 122B run).
#
# TOPOLOGY: 1 node / 8xH100, TP=1 PP=1 EP=8 (converter forces TP=1; dist ckpt is
#   reshard-aware, so training loads it at TP=2/EP=16). EP=8 shards the 256
#   experts 32/rank so no rank holds all of them; pure inference (no optimizer/
#   grads/activations) -> ~40-55 GiB/GPU, comfortable on 80 GiB.
#
# WRITE PATH: torch_dist writes many shard files in parallel. All 8 ranks are on
#   ONE node, so we write to node-local /local_disk0 (fast NVMe, no FUSE), THEN
#   sequentially `cp` onto the UC Volume -- the FUSE mount rejects parallel range
#   writes (same reason staging streams sequentially).
#
#   air run --file air/02c_convert_122b_mcore_dist.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-02c-convert-122b-mcore-dist
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8          # 1 node, 8xH100
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  NCCL_DEBUG: WARN
  CUDA_DEVICE_MAX_CONNECTIONS: '1'                      # Megatron requirement
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  HF_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-122B-A10B
  LOCAL_OUT: /local_disk0/mcore_dist
  UC_OUT: /Volumes/main/mshtelma/verl/models/Qwen3.5-122B-A10B-mcore-dist
  EP: '8'

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  echo "=== /local_disk0 free space (need ~244 GB) ==="
  df -h /local_disk0 || true
  rm -rf "${LOCAL_OUT}"

  echo "=== convert HF -> Megatron dist checkpoint (TP=1 PP=1 EP=${EP}) ==="
  # Single-node rendezvous MUST be on loopback: --standalone binds the TCPStore
  # to the container hostname (node.host.local), which is not routable back to
  # itself in the air network (errno 113, run 261266183131425). Force 127.0.0.1.
  export MASTER_ADDR=127.0.0.1
  export MASTER_PORT=29500
  torchrun --nnodes=1 --node_rank=0 --nproc_per_node=8 \
    --master_addr=127.0.0.1 --master_port=29500 \
    "${CODE_SOURCE_PATH}/scripts/convert_hf_to_mcore_dist.py" \
    --hf_model_path "${HF_MODEL_PATH}" \
    --output_path "${LOCAL_OUT}" \
    --tp 1 --pp 1 --ep "${EP}" \
    --trust_remote_code

  echo "=== local output ==="
  du -sh "${LOCAL_OUT}"; ls -la "${LOCAL_OUT}" | head -30

  echo "=== sequential copy onto UC Volume (FUSE: no parallel range writes) ==="
  rm -rf "${UC_OUT}"; mkdir -p "${UC_OUT}"
  cp -r "${LOCAL_OUT}/." "${UC_OUT}/"

  echo "=== UC output ==="
  ls -la "${UC_OUT}" | head -30
  echo "CONVERSION COMPLETE -> ${UC_OUT}"
