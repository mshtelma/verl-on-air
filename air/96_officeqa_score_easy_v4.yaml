# =============================================================================
# OfficeQA PATH-REPORT SCORING — easy-30 v4 (anti-abstention A/B).
#
# Scores air/95 with the SAME validated judge + gates + answer-key labeling as air/92/94.
# Right-sized 128k judge (measured need ~56k tokens; 262144 does NOT fit GLM-5.3 KV on 16xH100),
# and the PARALLEL scorer (OQ_SCORE_CONCURRENCY) so 30 reports finish fast.
#
# Compare scored_easy_v4 to scored_v3 (the pre-fix baseline): abstentions should drop from 10
# and scored/answered rise, with faithfulness held (the fabrication gate + judge zero out any
# ungrounded "best estimate", so pushing for answers cannot inflate the score).
#
# PRECONDITION: air/95 must have written captures.jsonl to OQ_EPISODES_FILE below.
#
#   air run --file air/96_officeqa_score_easy_v4.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-96-officeqa-score-easy-v4
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16               # 2x 8xH100 -> TP16 for the 755 GB FP8 judge
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'

  # --- judge serve (full GLM-5.3, TP16, 2 nodes) -- proven config from air/92/94 ---
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_SERVED_NAME: judge
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_MAX_MODEL_LEN: '131072'                 # 128k: right-sized + fits KV (256k does NOT; see air/92)
  JUDGE_HEALTH_TIMEOUT: '2400'
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  # --- score the v4 captures ---
  OQ_SCORE_EPISODES: '1'
  OQ_EPISODES_FILE: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_easy_v4/captures.jsonl
  OQ_SCORE_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/scored_easy_v4   # immutable
  OQ_ANSWER_KEY: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OQ_ANSWER_TOL: '0.0'
  OQ_SCORE_MAX_RETRIES: '2'
  OQ_MAX_HISTORY_BYTES: '480000'                # never binds at easy sizes; fits 128k ctx
  OQ_SCORE_CONCURRENCY: '8'                     # parallel judge calls (I/O-bound); fast for 30 reports

  # --- judge client knobs (path_report_pilot.make_http_judge reads these) ---
  JUDGE_MODEL: judge
  JUDGE_REASONING_EFFORT: high
  JUDGE_MAX_TOKENS: '10240'
  JUDGE_TEMPERATURE: '0'
  JUDGE_TIMEOUT: '900'

max_retries: 0
timeout_minutes: 150

command: bash ${CODE_SOURCE_PATH}/scripts/serve_judge.sh
