# =============================================================================
# RUNG 5a — FULLY-ASYNC PLUMBING SMOKE: Qwen3.5-9B, single node, 4 train + 4
#           rollout GPUs (disaggregated within one 8xH100 node).
#
# Uses verl's PURPOSE-BUILT fully-async recipe (NOT the v1 separate_async trainer
# that collided on GPU placement in the first attempt):
#   python -m verl.experimental.fully_async_policy.fully_async_main
#          --config-name=fully_async_ppo_megatron_trainer ...
# Modeled on verl's own example:
#   verl/experimental/fully_async_policy/shell/geo3k_qwen25vl_7b_megatron_4_4.sh
#
# WHY single-node 4+4: cheapest, cleanest validation of the Rollouter/Trainer
# disaggregation + NCCL weight sync, with NO cross-node NCCL as a variable. The
# split is WITHIN the node (N_GPUS_ROLLOUT=4 -> 4 training GPUs), exactly like
# the canonical example. Trainer GPUs stay rollout-free because
# use_dynamic_resource_scheduling defaults to False.
#
# WHAT TO CHECK IN THE LOG:
#   * Rollouter + Trainer come up on DISJOINT GPUs (no vLLM OOM this time —
#     the trainer's Megatron model is NOT on the rollout GPUs)
#   * the standalone vLLM server (AgentLoop / server mode) starts and serves
#   * MessageQueue fills; Trainer fetches require_batches*ppo_mini samples
#   * >=1 NCCL parameter synchronization trainer->rollout completes
#   * >=1 GRPO update with healthy reward/kl
#
# Backend: classic Megatron + CPU-offloaded optimizer (what verl's fully-async
# examples use); 9B dense -> EP=1, TP=2 on 4 training GPUs.
#
#   air run --file air/30_qwen3_5_9b_async_smoke.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-30-qwen3_5-9b-fully-async-smoke
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8         # single node; launcher splits 4 rollout + 4 train
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v6

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  # First fully-async run: WARN NCCL (single node -> little cross-GPU noise) but
  # INFO vLLM so we SEE the AgentLoop server + rollout come up. Revert to WARN
  # once the path is understood.
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # --- disaggregation split (within the single node) ---
  N_GPUS_ROLLOUT: '4'          # -> 4 training GPUs (8 - 4)
  TP: '2'                      # trainer tensor-parallel (4 train GPUs -> DP=2)
  PP: '1'
  EP: '1'                      # 9B dense: no experts
  ETP: '1'
  GEN_TP: '1'                  # rollout TP=1 -> 4 vLLM DP replicas on 4 GPUs
  ROLLOUT_GPU_MEM_UTIL: '0.8'  # dedicated rollout GPUs: no training resident

  # --- fully-async knobs ---
  TRIGGER_SYNC_STEP: '2'       # local updates between weight syncs
  REQUIRE_BATCHES: '1'         # mini-batches fetched per update
  STALENESS: '0.1'             # >0 => genuinely async (proves the async path)
  PARTIAL_ROLLOUT: 'True'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-9b-fully-async-smoke

max_retries: 0
timeout_minutes: 90

parameters:
  model_name: Qwen/Qwen3.5-9B
  train_files: /Volumes/main/mshtelma/verl/data/geo3k/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/geo3k/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-9b-fully-async
  total_epochs: 1
  ppo_mini_batch_size: 16
  rollout_n: 4
  total_rollout_steps: 64      # ~2 weight-sync cycles (32 samples/sync); smoke
  max_prompt_length: 1024
  max_response_length: 2048

command: |
  bash ${CODE_SOURCE_PATH}/scripts/run_grpo_fully_async.sh
