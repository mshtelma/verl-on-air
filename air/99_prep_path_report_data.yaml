# =============================================================================
# Prepare the OfficeQA PATH-REPORT GRPO training data (Phase 1: EASY bootstrap).
#
# Runs scripts/officeqa/prep_officeqa_path_report.py -> writes train/test parquet to the Volume
# (agent_name=path_report_agent, submit system prompt funnel-filled, ground_truth=gold answer).
# The FUNNEL KNOBS here MUST match the training smoke (air/100): max_turns / nudge / submit-only.
#
#   air run --file air/99_prep_path_report_data.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-99-prep-path-report-data
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10          # no GPU work; just CSV read + parquet write to the Volume

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7   # has `datasets`

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_PR_OUT_DIR: /Volumes/main/mshtelma/verl/data/officeqa_path_report
  OFFICEQA_PR_DIFFICULTY: easy          # Phase 1: EASY only (133 hard = held-out eval)
  OFFICEQA_PR_LIMIT: '0'                # 0 = all easy (~113)
  # Funnel knobs -> baked into the system prompt; MUST equal air/100's EVAL_MAX_TURNS /
  # OQ_NUDGE_WINDOW / OQ_SUBMIT_ONLY_WINDOW.
  EVAL_MAX_TURNS: '16'
  OQ_NUDGE_WINDOW: '4'
  OQ_SUBMIT_ONLY_WINDOW: '2'
  OFFICEQA_PR_VAL_FRAC: '0.1'

max_retries: 0
timeout_minutes: 30

command: python3 ${CODE_SOURCE_PATH}/scripts/officeqa/prep_officeqa_path_report.py
