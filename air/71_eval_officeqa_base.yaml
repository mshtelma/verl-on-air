# =============================================================================
# OfficeQA BASELINE — base Qwen3.5-35B-A3B, agentic, full officeqa_full (246 Q).
#
# THE GO/NO-GO for the RL run. OfficeQA is Databricks' grounded-reasoning benchmark
# over U.S. Treasury Bulletins; frontier LLMs score <34% WITH the corpus, so there
# is large real headroom (unlike competition math, which is correctness-saturated
# for this model). officeqa_full = 133 hard + 113 easy -> difficulty breakdown.
#
# READ: if the base lands in a workable band (roughly 10-40% exact, with WRONG
# answers not just no-answers) we have GRPO signal and proceed to synthesize
# training questions -> train -> eval the checkpoint (the delta is the deliverable).
# If ~0% the task is too hard for signal (fall back to easy-only or add a tool);
# if already high the model is at the frontier here too.
#
#   air run --file air/71_eval_officeqa_base.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-71-eval-officeqa-base
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '49152'          # multi-turn (16) + large table tool outputs; model ctx 262k
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: eval_officeqa_agentic.py

  OFFICEQA_STAGE: '1'
  # Authoritative HF release, staged to the Volume by air/03_fetch_officeqa_hf.yaml.
  # 246 = 133 hard (= OfficeQA Pro, the HEADLINE number) + 113 easy (difficulty breakdown).
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  EVAL_LIMIT: '0'                  # all 246
  EVAL_MAX_TURNS: '16'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/officeqa_base.json

max_retries: 0
timeout_minutes: 120

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
