# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — ALL 133 HARD, v4 ANTI-ABSTENTION + 3-PHASE FUNNEL.
#
# The real test of the owner-directed fix. Easy (air/95/96) was a clean A/B for the
# anti-abstention PROMPT effect but left the funnel INERT (easy commits early). Hard is
# where the funnel actually engages: v3 hard left 29/29 abstentions sitting on gold
# answers and a 5-episode no-submit-at-cap tail -- both are what the funnel is built to
# convert into commitments.
#
# Same funnel as air/95 (identical params so easy/hard compare cleanly):
#   * explore (all tools) for turns 1..60
#   * last OQ_NUDGE_WINDOW=20 (turns 61..75): ALL retrieval locked (search/grep/read/list);
#     compute + submit_report stay -> context growth from big observations STOPS here, which
#     also CONTAINS overflow (v3 hard overflowed at 49-63 turns of full retrieval; capping
#     retrieval at turn 60 keeps that ceiling ~the same as the proven air/93 budget-64 run).
#   * last OQ_SUBMIT_ONLY_WINDOW=5 (turns 76..80): submit_report is the ONLY tool -> forces a
#     terminal, converting the no-submit / give-up tail into committed answers.
# The WHOLE structure (budget + both windows + numbers) is stated PROMINENTLY in the system
# prompt (the OOD guard: the actor plans for vanishing tools instead of being surprised).
#
# What to measure vs air/93 (budget 64, window 8, no submit-only): abstention should fall
# from 29/133, no_submit_at_cap from 5 -> ~0 (the submit-only window forces it), overflow
# should stay near 6% (retrieval-lock at turn 60 contains it). Faithfulness stays honest
# regardless -- the value-fabrication gate + judge zero any ungrounded "best estimate", so
# pushing for answers CANNOT inflate the score (proven on easy v4: 0 inflation, 1 fabricated
# correct-answer deterministically zeroed).
#
# Budget 48(easy v3) -> 64(hard air/93) -> 80 here ("even further", per owner); serve len at
# the model max. Scoring is the separate air/98 job.
#
#   air run --file air/97_officeqa_collect_hard_v4.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-97-officeqa-collect-hard-v4
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve (same model/TP as air/93; model-max context) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'         # 256k: the actor's full context (model max) -> the ceiling
  EVAL_GPU_UTIL: '0.90'            # more KV blocks for long 262k sequences at concurrency 16
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + anti-abstention + 3-phase funnel + PARALLEL ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '20'            # last 20 of 80: forbid ALL retrieval (search/grep/read/list); compute stays
  OQ_SUBMIT_ONLY_WINDOW: '5'       # last 5 of 80: submit_report is the ONLY tool
  OQ_COLLECT_CONCURRENCY: '16'     # thread-pool overlap; 133 hard episodes in ~2-3h instead of ~13-22h
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'            # 0 = ALL hard questions (133 in officeqa_full.csv)
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard_v4

  # --- corpus + questions (staged exactly as air/93) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (matched to air/93 except the larger turn budget) ---------
  EVAL_MAX_TURNS: '80'             # "even further" (air/93 hard was 64); funnel caps gathering at turn 60
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 300                # 16-way overlap of 133 hard @ 80 turns + cold model load; slack for KV preemption

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
