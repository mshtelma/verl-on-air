experiment_name: verl-on-air-82-rgate-expanded
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16               # 2x 8xH100 -> TP16 for the 755 GB FP8 judge
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'

  # --- judge serve (full GLM-5.3, TP16, 2 nodes) -- proven config from air/79 ---
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_SERVED_NAME: judge
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_MAX_MODEL_LEN: '131072'                 # judge must see the WHOLE trajectory
  JUDGE_HEALTH_TIMEOUT: '2400'                  # first cross-node TP16 load of 755 GB
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  # --- run the expanded R-gate suite + thresholds ---
  OQ_RGATE_RUN: '1'
  OQ_TRACES_IN: reward/tests/rgate_expanded.jsonl   # snapshot-relative (travels with the code)
  OQ_SCORES_OUT: /Volumes/main/mshtelma/verl/eval/rgate_expanded_scores.jsonl
  OQ_RGATE_REPORT: /Volumes/main/mshtelma/verl/eval/rgate_expanded.report.json
  OQ_REWARD_MODE: grounded
  OQ_TIGHT_TOL: '0.0'

  # --- judge client: WHOLE trajectory, fail-closed over budget ---
  JUDGE_MODEL: judge
  JUDGE_REASONING_EFFORT: high                  # GLM-5.3: low|high|max; default "max" overran the budget
  JUDGE_MAX_TOKENS: '10240'
  JUDGE_TEMPERATURE: '0'                        # pinned: gate reproducibility
  JUDGE_TIMEOUT: '600'
  JUDGE_CONCURRENCY: '16'                       # historical 339-case diagnostic; not an approved gate
  JUDGE_DEBUG: '1'
  OQ_JUDGE_TRAJ_CHARS: '0'                      # 0 = send the whole trajectory (no truncation)
  OQ_JUDGE_TRAJ_MAX: '300000'                   # hard ceiling -> quarantine rather than truncate

max_retries: 0
timeout_minutes: 150

# AI Runtime runs this once per node: rank 0 = Ray head + API server + the R-gate
# scorer, rank 1 = Ray worker that joins and idles until the head's Ray port closes.
command: bash ${CODE_SOURCE_PATH}/scripts/serve_judge.sh
