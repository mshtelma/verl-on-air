# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — ALL 133 HARD questions (parallel, max seq len).
#
# Goal (owner): get a COMMITTED answer on most hard questions (even wrong ones) to
# prove the harness has enough TURNS and enough SEQ LENGTH to carry a hard question
# to a submit. This is a CAPACITY/coverage run, not a scoring run -- scoring is the
# separate air/94 job.
#
# Two failure modes we are measuring (the collector prints a termination histogram):
#   * non-commitment  -> `no_submit_at_cap` (mitigated by the endgame nudge + budget)
#   * context overflow -> `actor_error` (a vLLM 400 when the transcript exceeds
#     max-model-len). "Measure, then decide": we run at the model's MAX seq len and
#     count how often this actually happens; only if it is material do we add
#     actor-side history compaction (which the ledger makes judge-safe).
#
# What changed vs air/91 (easy v3):
#   * difficulty=hard, LIMIT=0 -> all 133 hard questions.
#   * OQ_COLLECT_CONCURRENCY=16: the collector now runs episodes on a thread pool
#     (each episode is an independent run_episode with its own loop+session). 133
#     sequential episodes at 64 turns would be ~10-18h; at 16-way overlap it is ~1-2h.
#     Per-episode results are unchanged (temp=0, independent) and written in input order.
#   * EVAL_SERVE_LEN=262144: the actor's (Qwen3.5-35B-A3B) full context -> the ceiling.
#   * EVAL_MAX_TURNS=64 (hard chains need 50+); OQ_NUDGE_WINDOW=8 (last 8 of 64 ~ 12.5%,
#     the same fraction as v3's 6/48).
#   * EVAL_GPU_UTIL=0.90: more KV headroom for 262k. vLLM V1 pages/preempts under KV
#     pressure (correctness preserved), so high concurrency at long context is safe,
#     only possibly slower. Note: KV preemption is NOT overflow -- a 400 from exceeding
#     262144 tokens is the overflow we are counting; preemption just recomputes.
#
#   air run --file air/93_officeqa_collect_hard.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-93-officeqa-collect-hard
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve (same model/TP as air/91; MAX seq len + more KV headroom) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'         # 256k: the actor's full context (model max) -> the ceiling
  EVAL_GPU_UTIL: '0.90'            # more KV blocks for long 262k sequences at concurrency 16
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + endgame window + PARALLEL episodes ----------
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '8'             # last 8 of 64 turns: nudge + lock search/grep (compute stays)
  OQ_COLLECT_CONCURRENCY: '16'     # thread-pool overlap; 133 hard episodes in ~1-2h instead of ~10-18h
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'            # 0 = ALL hard questions (133 in officeqa_full.csv)
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard

  # --- corpus + questions (staged exactly as air/91) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (matched to air/91 except the larger turn budget) ---------
  EVAL_MAX_TURNS: '64'             # BIGGER budget for hard chains (v3 easy was 48)
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 300                # 16-way overlap of 133 hard @ 64 turns + cold model load; slack for KV preemption

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
