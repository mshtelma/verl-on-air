# =============================================================================
# OfficeQA PATH-REPORT SCORING — Deliverable B, phase 2 (offline scoring of rollouts).
#
# Scores the REAL capture records collected by air/85 (phase 1) against the VALIDATED
# support judge, producing the actor-usability report -- with NO human reviewer:
#   * deterministic reference gate   (nonexistent / cross-episode / undelivered / impossible chronology)
#   * deterministic value-fabrication gate (leaf value absent from the whole delivered trace)
#   * answer-correctness auto-labeled from the OfficeQA answer key (uid,answer) via score_answer
#   * semantic support/faithfulness from GLM-5.3 (the judge validated GREEN in air/83)
# The three labels stay SEPARATE (never conflated); scores are OFFLINE PREVIEWS, never
# optimizer inputs. serve_judge.sh (OQ_SCORE_EPISODES=1) runs path_report_pilot.py on rank 0
# against localhost and exits non-zero only on an INTEGRITY violation (not on low usability).
#
# Serves the full GLM-5.3 judge (TP16 across 2x 8xH100 -- the proven air/52c/air/73/air/83
# config). This is the SAME serve harness as the judge-validation job; only the rank-0 client
# differs (score real episodes vs. score truth-by-construction fixtures).
#
# PRECONDITION: air/85 must have written captures.jsonl to OQ_EPISODES_FILE below.
#
#   air run --file air/86_officeqa_score_deliverable_b.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-86-officeqa-score-deliverable-b
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16               # 2x 8xH100 -> TP16 for the 755 GB FP8 judge
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'

  # --- judge serve (full GLM-5.3, TP16, 2 nodes) -- proven config from air/52c/air/73/air/83 ---
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache   # per-node NVMe pre-stage (bulk cp off UC FUSE)
  JUDGE_SERVED_NAME: judge
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'                   # vllm#45318 multi-node fix (pin on judge nodes)
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_MAX_MODEL_LEN: '32768'                  # support prompt (question + report + tool history) + thinking + JSON
  JUDGE_HEALTH_TIMEOUT: '2400'                  # first cross-node TP16 load of 755 GB
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  # --- run the Deliverable-B episode scorer (not the fixture validator or GSM8K test) ---
  OQ_SCORE_EPISODES: '1'
  OQ_EPISODES_FILE: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_v1/captures.jsonl
  OQ_SCORE_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/scored_v1   # immutable
  OQ_ANSWER_KEY: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv          # uid,answer -> answer-correctness
  OQ_ANSWER_TOL: '0.0'                          # exact/headline match (same default as the eval)
  OQ_SCORE_MAX_RETRIES: '2'

  # --- judge client knobs (path_report_pilot.make_http_judge reads these) ---
  JUDGE_MODEL: judge
  JUDGE_REASONING_EFFORT: high                  # GLM-5.3: low|high|max; default "max" overran budget -> 38% non-parse
  JUDGE_MAX_TOKENS: '10240'                     # room for "high" thinking + the JSON verdict
  JUDGE_TEMPERATURE: '0'
  JUDGE_TIMEOUT: '600'

max_retries: 0
timeout_minutes: 120

# AI Runtime runs this once per node. serve_judge.sh reads the injected topology
# (NUM_NODES/POD_RANK/MASTER_ADDR): rank 0 = Ray head + vLLM API + the scoring
# client (then exit); rank 1 = Ray worker that joins, idles, and drains when the head
# closes its Ray port.
command: bash ${CODE_SOURCE_PATH}/scripts/serve_judge.sh
