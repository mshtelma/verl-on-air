# =============================================================================
# OfficeQA PATH-REPORT COLLECTION -- 133 HARD, the air/128 LONG 16-turn run, @ 80-turn eval.
#
# The held-out hard eval (collect arm) for air/128 (run 901521827131216: air/102's proven 16-turn
# config run ~100 syncs, SAVE_FREQ=10 -> ladder global_step_10/20/.../100 under officeqa-path-report-t16-long).
# Model TRAINED at 16 turns, EVALUATED at 80 turns (train-short/eval-long, same as air/102/126). Directly
# comparable to base@80 (scored_hard_v4) and every other @80t arm.
#
# PARAMETERIZED BY RUNG so ONE recipe evals ANY checkpoint on the ladder -> plot the evolution curve:
#   air run -f air/129_officeqa_collect_hard_t16long.yaml --override env_variables.OQ_CKPT_STEP=20 -p df1 --watch
#   air run -f air/129_officeqa_collect_hard_t16long.yaml --override env_variables.OQ_CKPT_STEP=50 -p df1 --watch
#   air run -f air/129_officeqa_collect_hard_t16long.yaml --override env_variables.OQ_CKPT_STEP=100 -p df1 --watch
# OQ_CKPT_STEP defaults to 'latest' (highest global_step_N present). Output dir encodes the RESOLVED step
# (collect_hard_t16long_step<N>) so rungs never collide. Score each with the SAME --override via air/130.
#
# Everything else (80-turn funnel, 256k serve, temp 0, corpus/questions) is VERBATIM air/126.
#
#   air run --file air/129_officeqa_collect_hard_t16long.yaml -p df1 --watch     # latest rung
# =============================================================================

experiment_name: verl-on-air-129-officeqa-collect-hard-t16long
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- WHICH RUNG to eval: a global_step_<N> under officeqa-path-report-t16-long, or 'latest' -----
  # Override per rung: --override env_variables.OQ_CKPT_STEP=50
  OQ_CKPT_STEP: 'latest'

  # --- actor serve: the air/128 TRAINED checkpoint (resolved in command below); 256k ctx like air/126 ---
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'         # 256k: model max -> the ceiling (identical to air/126)
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + 80-turn 3-phase funnel + PARALLEL (identical to air/126) ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '20'            # last 20 of 80: retrieval locked (== air/126)
  OQ_SUBMIT_ONLY_WINDOW: '5'       # last 5 of 80: submit_report only (== air/126)
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'            # 0 = ALL hard questions (133 in officeqa_full.csv)
  # OQ_COLLECT_OUT is set in the command (encodes the resolved rung) -> collect_hard_t16long_step<N>

  # --- corpus + questions (staged exactly as air/126) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (identical to air/126) ---------
  EVAL_MAX_TURNS: '80'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 300                # 16-way overlap of 133 hard @ 80 turns + cold model load (== air/126)

# Resolve the requested rung (OQ_CKPT_STEP, or LATEST global_step_N with an HF export), name the output
# dir after the RESOLVED step (so rungs never collide), then serve+collect.
command: |
  CKPT_ROOT=/Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-t16-long
  STEP="${OQ_CKPT_STEP:-latest}"
  if [ "${STEP}" = "latest" ]; then
    CKPT=$(ls -d ${CKPT_ROOT}/global_step_*/actor/model/huggingface 2>/dev/null \
           | awk -F'global_step_' '{n=$2+0; print n"\t"$0}' | sort -n | tail -1 | cut -f2-)
    STEP=$(printf '%s' "${CKPT}" | awk -F'global_step_' '{n=$2+0; print n}')
  else
    CKPT="${CKPT_ROOT}/global_step_${STEP}/actor/model/huggingface"
  fi
  if [ -z "${CKPT}" ] || [ ! -d "${CKPT}" ]; then
    echo "FATAL: no HF checkpoint at '${CKPT}' (root ${CKPT_ROOT}, requested step '${OQ_CKPT_STEP:-latest}')" >&2
    echo "Available rungs:" >&2; ls -d ${CKPT_ROOT}/global_step_*/actor/model/huggingface 2>/dev/null >&2
    exit 1
  fi
  echo "Eval checkpoint (resolved step ${STEP}): ${CKPT}"
  export EVAL_MODEL_PATH="${CKPT}" MODEL_PATH="${CKPT}"
  export OQ_COLLECT_OUT="/Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard_t16long_step${STEP}"
  echo "Collect output: ${OQ_COLLECT_OUT}"
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
