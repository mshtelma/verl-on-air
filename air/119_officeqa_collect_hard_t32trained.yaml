# =============================================================================
# OfficeQA PATH-REPORT COLLECTION -- 133 HARD, the air/122 32-TURN-TRAINED model, evaluated @ 80 turns.
#
# The held-out hard eval (collect arm) for the air/122 run. The model is TRAINED at 32 turns but
# EVALUATED at 80 turns (train-short/eval-long, same as air/102). Directly comparable to the BASE
# @ 80t baseline (air/97/98 -> scored_hard_v4) and the air/102 16-turn-trained @ 80t (air/107/108):
# same 80-turn 3-phase funnel (MAX_TURNS=80, NUDGE=20, SUBMIT_ONLY=5), same 256k serve len, same
# decoding (temp 0), same corpus/questions. This AUTO-DISCOVERS the LATEST global_step_N under the
# air/122 output dir (the run is timeout-bound, so the final step count is not known ahead of time).
# Run this AFTER air/122 has written at least one checkpoint.
#
# Scoring is the separate air/120 job.
#
#   air run --file air/119_officeqa_collect_hard_t32trained.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-119-officeqa-collect-hard-t32trained
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve: the air/122 TRAINED checkpoint (resolved in command below); 256k ctx like air/107 ---
  # EVAL_MODEL_PATH / MODEL_PATH are exported by the command (latest global_step_N HF export).
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'         # 256k: model max -> the ceiling (identical to air/107)
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + 80-turn 3-phase funnel + PARALLEL (identical to air/107) ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '20'            # last 20 of 80: retrieval locked (== air/97/107)
  OQ_SUBMIT_ONLY_WINDOW: '5'       # last 5 of 80: submit_report only (== air/97/107)
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'            # 0 = ALL hard questions (133 in officeqa_full.csv)
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard_t32trained

  # --- corpus + questions (staged exactly as air/107) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (identical to air/97/107) ---------
  EVAL_MAX_TURNS: '80'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 300                # 16-way overlap of 133 hard @ 80 turns + cold model load (== air/107)

# Resolve the LATEST checkpoint (highest global_step_N with an HF export), then serve+collect.
command: |
  CKPT_ROOT=/Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-t32
  CKPT=$(ls -d ${CKPT_ROOT}/global_step_*/actor/model/huggingface 2>/dev/null \
         | awk -F'global_step_' '{n=$2+0; print n"\t"$0}' | sort -n | tail -1 | cut -f2-)
  if [ -z "${CKPT}" ]; then echo "FATAL: no HF checkpoint under ${CKPT_ROOT}" >&2; exit 1; fi
  echo "Using LATEST trained checkpoint: ${CKPT}"
  export EVAL_MODEL_PATH="${CKPT}" MODEL_PATH="${CKPT}"
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
