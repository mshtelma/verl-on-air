# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — Deliverable B v2 (report-yield fix re-collection).
#
# Re-collects the same easy-question split as air/85, but with the two report-yield
# cures landed this pass (both CPU-tested; path_report_collect.py):
#   1. SUBMIT contract (OQ_REQUIRE_SUBMIT=1): the actor is advertised a submit_report
#      tool and FINISHES by calling it. Printing text no longer ends the task -- a
#      no-tool-call turn is nudged to submit. Models commit to "call the finish tool"
#      far more reliably than to "stop calling tools" (the air/85 failure mode: 13/30
#      hit the turn cap still calling tools, most WITH the data already in hand).
#   2. ENDGAME window (OQ_NUDGE_WINDOW=6): in the last 6 turns an escalating nudge is
#      injected and search/grep are locked (compute + submit stay available), forcing
#      synthesis before the budget runs out.
# Plus a larger budget (24 vs 16) and serve window. The no-synthesis guarantee is
# unchanged: only an explicit submit produces a report; a turn cap still yields none.
#
# Turn budget is a knob (EVAL_MAX_TURNS): 24 here for an easy-split A/B vs air/85.
# The model supports 262,144-token context, so budget is bounded by the serve window
# (KV memory), NOT the model -- collection is SEQUENTIAL (one episode at a time), so a
# long context costs no concurrency. For hard questions raise EVAL_MAX_TURNS to ~48-64
# and EVAL_SERVE_LEN accordingly.
#
# Scoring is the separate air/88 job (serves GLM-5.3, scores this job's captures.jsonl).
#
#   air run --file air/87_officeqa_collect_deliverable_b_v2.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-87-officeqa-collect-deliverable-b-v2
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve (same model/TP as air/85; larger serve window for the bigger budget) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '98304'          # 96k: fits a 24-turn transcript w/ large table reads (model max 262k)
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + endgame window (the report-yield fix) ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'            # finish by calling submit_report (Replace contract)
  OQ_NUDGE_WINDOW: '6'             # last 6 turns: nudge + lock search/grep (compute stays)
  OQ_COLLECT_DIFFICULTY: easy       # same split as air/85 for a clean A/B
  OQ_COLLECT_LIMIT: '30'
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_v2

  # --- corpus + questions (staged exactly as air/85) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (matched to air/85 except the larger turn budget) ---------
  EVAL_MAX_TURNS: '24'             # KNOB: raise to ~48-64 for hard questions (+ EVAL_SERVE_LEN)
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 240                # 24 turns x 30 sequential episodes + cold load

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
