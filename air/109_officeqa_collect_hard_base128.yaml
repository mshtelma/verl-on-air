# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — 133 HARD, BASE model @ the 128-TURN budget.
#
# TURN-BUDGET PROBE, higher tier. base@16=14 -> base@80=38 (n_scored) showed the turn budget
# is the DOMINANT lever on hard (nearly tripled just from more turns). Owner directive: use
# >= 100 turns for hard (80 = min; the OfficeQA paper used 200 with STRONGER/longer-context
# models). 128 is the max that stays clean within OUR stack's context ceilings:
#   * actor Qwen3.5-35B = 256k ctx, and per-turn reasoning is RETAINED (accumulates ~<=2048
#     tok/turn); heaviest base@80 episode was ~128k tok, so 128 turns fits, ~200 would overflow.
#   * judge GLM-5.3 = 131072 ctx; base@80 max judge request ~141k chars (~59k tok), ~128 turns
#     -> ~95k tok (fits); ~200 turns overflows the judge (-> UNKNOWN, verifier failure).
#
# EXACTLY air/97 (base @ 80t) with ONLY the turn budget raised + output dir changed:
#   EVAL_MAX_TURNS 80 -> 128, OQ_NUDGE_WINDOW 20 -> 28 (retrieval turns 1-100, locked 101-128),
#   OQ_SUBMIT_ONLY_WINDOW 5 (submit-only 124-128). Retrieval extends 60 -> 100 turns (the lever),
#   plus a 28-turn converge/compute tail. Same 256k serve len, decoding, corpus, base model.
#
# Scoring is the separate air/111 job. Trained @ 128t is air/110/112.
#
#   air run --file air/109_officeqa_collect_hard_base128.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-109-officeqa-collect-hard-base128
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve: BASE model, 256k ctx (identical to air/97) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'         # 256k: model max -> the ceiling (identical to air/97)
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + 128-turn 3-phase funnel + PARALLEL ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '28'            # last 28 of 128: retrieval locked (retrieval runs turns 1-100)
  OQ_SUBMIT_ONLY_WINDOW: '5'       # last 5 of 128: submit_report only
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'            # 0 = ALL hard questions (133 in officeqa_full.csv)
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard_base128

  # --- corpus + questions (staged exactly as air/97) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (identical to air/97 except the turn budget) ---------
  EVAL_MAX_TURNS: '128'            # >= 100 per owner directive; within actor+judge ctx ceilings
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 540                # 16-way overlap of 133 hard @ up to 128 turns + cold model load

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
