# =============================================================================
# OfficeQA TRAINING INTEGRATION SMOKE — deliberately small and JUDGE-FREE.
#
# Purpose: prove the OfficeQA ToolAgentLoop + reward wiring in the REAL verl v0.9.0
# fully-async container before any judged or large-scale run. This is the FIRST run
# expected to form real optimizer batches (2 steps), but still NOT a learning-signal
# experiment and NOT a baseline (tiny LR). It uses:
#   * 32 real EASY OfficeQA questions (disjoint from the hard-133 eval set; verified
#     gold answers, no synthesis) packaged by scripts/officeqa/prep_officeqa_tool_agent.py;
#   * two full 16-prompt-group syncs (TRIGGER_SYNC_STEP=1, ppo_mini=16) -> the FIRST
#     real optimizer batches/steps for OfficeQA; still tiny LR, not a learning result;
#   * the SAME 5 tools as eval (search/grep/read/list/compute);
#   * OQ_REWARD_MODE=answer (strict answer-only control; no judge nodes);
#   * bwrap compute sandbox in image v7 (air/80 proved df1 permits the boundary);
#   * MAX_TOOL_RESPONSE_LEN=8000 characters so the training actor sees at least the
#     evidence eval sees (verl's multi_turn cap is characters, not tokens);
#   * NORM_ADV_BY_STD_IN_GRPO=False (the graded-reward contract; harmless for the
#     answer-only smoke and already exercised in config resolution).
#
# Two nodes / 16xH100: rank 0 trainer, rank 1 Rollouter. No GLM judge GPUs. The
# known remaining integration item this smoke is meant to expose is group handling
# for reward status=unknown; answer-mode should not produce unknowns.
#
#   air run --file air/77_officeqa_train_smoke.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-77-officeqa-train-smoke
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16          # 2 nodes x 8 H100: 1 trainer + 1 Rollouter
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # All 2 nodes train; no judge role. The dispatcher skips endpoint waiting.
  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  # OfficeQA corpus/index staged on the Rollouter before tools are used.
  OFFICEQA_STAGE: '1'
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # Proven 35B fully-async topology from air/31/53, no judge nodes.
  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'

  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  # OfficeQA multi-turn contract: Qwen native parser, realistic evidence budget.
  # MAX_TURNS=8 for the SMOKE: 16 turns x (8192+1024) = 147k-token episodes OOM'd
  # the trainer at the first optimizer step (run 805654108465557, grad-norm NCCL
  # all_reduce 'Cuda failure 2 out of memory'). 8 turns -> 73k budget. Eval keeps 16.
  MULTI_TURN: 'True'
  MAX_TURNS: '8'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '8000'   # CHARACTERS in verl v0.9.0 ToolAgentLoop
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/scripts/tools/officeqa_tools.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/officeqa_grounded_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: rate_limited
  REWARD_MAX_CONCURRENT: '16'
  REWARD_TIMEOUT: '60'

  OQ_REWARD_MODE: answer
  OFFICEQA_PREP_LIMIT: '32'        # air/77 re-runs prep; 32 prompts = 2 full syncs
  OFFICEQA_PREP_DIFFICULTY: easy
  NORM_ADV_BY_STD_IN_GRPO: 'False'
  # Unknown-verdict whole-group quarantine (sentinel + sitecustomize GRPO patch).
  # Answer-mode produces no unknowns, so this run validates that the patch LOADS
  # and wraps cleanly before the judged run depends on it; required '1' for judged.
  OQ_REWARD_QUARANTINE: '1'
  OQ_COMPUTE_TIMEOUT_S: '15'
  OQ_COMPUTE_MEM_MB: '4096'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: officeqa-train-smoke32

max_retries: 0
timeout_minutes: 180

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/officeqa_tool/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/officeqa_tool/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/officeqa-train-smoke32
  total_epochs: 1
  ppo_mini_batch_size: 16
  rollout_n: 4
  total_rollout_steps: 32         # UNIQUE PROMPTS: 32 = two full 16-sample syncs
  max_prompt_length: 8192         # OfficeQA system/tool prompt + long question
  max_response_length: 1024       # per-turn; episode budget becomes 16*(8192+1024)
  actor_lr: 1e-7                  # smoke: wiring, not learning

command: |
  set -euo pipefail
  python3 ${CODE_SOURCE_PATH}/scripts/officeqa/prep_officeqa_tool_agent.py
  if [ "${OFFICEQA_STAGE:-0}" = "1" ]; then
    bash ${CODE_SOURCE_PATH}/scripts/officeqa/stage_officeqa.sh
  fi
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
