# =============================================================================
# PERF RUN B (SYNC) — Qwen3.5-122B-A10B CLASSIC Megatron, CO-LOCATED rollout,
#   32 GPU (4 nodes). The sync half of the async-vs-sync throughput comparison
#   (async half = air/40). SAME 32-GPU budget, model, seq lengths, rollout_n.
#
# Sync == the run_grpo_megatron.sh path (rungs 1-4): one process trains AND rolls
# out on the same 32 GPUs; vLLM wakes for generation and sleeps for training, and
# every step ends with an actor->vLLM weight resync on those same GPUs. Classic
# Megatron + full CPU offload, TP=2 PP=1 EP=16 ETP=1 -> train-DP=16, expert-DP=2
# (~0.84 TB host RAM/node). MUST set MEGATRON_MODE=classic (launcher defaults to
# fsdp, which for the 122B would need ~128 GPU co-located — see docs/sizing.md).
#
# HONEST RISK: co-located 122B is marginal. EP=16 (like air/40) is REQUIRED just to
# clear model init: at EP=8 replicated params+grads are ~70 GiB/GPU (init OOM).
#
# ATTEMPT 1 (run 328511878149731, PP=1/EP=16/GEN_TP=8/util0.35) FAILED at vLLM KV
# init: "No available memory for the cache blocks" -- the 122B vLLM weights (~30
# GiB at GEN_TP=8) exceeded the util budget (0.35*80=28 GiB), leaving nothing for
# KV; and raising util collides with the co-located Megatron (~76 GiB): 76+35 >> 80.
# So co-location cannot fit 122B at 32 GPU with PP=1/GEN_TP=8 at ANY util.
#
# ATTEMPT 2 (this config): attack BOTH sides. PP=2 halves Megatron (~76 -> ~40 GiB);
# GEN_TP=16 halves vLLM weights (~30 -> ~15 GiB, cross-node rollout TP). util 0.3
# gives vLLM 24 GiB (15 weights + 9 KV). Budget: 40 (Megatron) + 24 (vLLM) = 64 < 80.
# If THIS still OOMs, the headline finding stands (co-location doesn't scale to 122B;
# disaggregation -- air/40 -- is required) and the next lever is more GPUs. Kept SHORT.
#
# METRICS: same as air/40 — perf/throughput (/32 = tokens/GPU/s), perf/mfu/actor,
# timing_s/{gen,ref,update_actor,step}, memory. Contrast the async overlap: here
# gen and train are SERIAL (vLLM sleeps during train), so timing_s/step ~=
# gen + ref + update_actor + weight_sync, with no rollout/train overlap.
#
#   air run --file air/41_qwen3_5_122b_sync_metrics.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-41-qwen3_5-122b-classic-sync-metrics
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 32        # 4 nodes x 8 H100 (same budget as air/40)
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v5

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  MEGATRON_MODE: classic       # REQUIRED: fsdp co-located 122B would need ~128 GPU
  OFFLOAD: '1'                 # classic ZeRO-1 + full CPU offload (like rung3)
  OFFLOAD_FRACTION: '1'
  TP: '2'                      # 32 Q-heads / 2
  PP: '2'                      # split 48 layers into 2 pipeline stages -> HALVES per-GPU Megatron footprint (~76 -> ~40 GiB). Needed for co-location room.
  CP: '1'
  EP: '16'                     # 256 experts -> 16/rank
  ETP: '1'
  GEN_TP: '16'                 # vLLM TP across 2 nodes -> HALVES 122B vLLM weights (30 -> ~15 GiB/GPU). The first sync run FAILED at vLLM KV init because weights (30 GiB) > util budget (28); GEN_TP=16 fixes that.
  ROLLOUT_GPU_MEM_UTIL: '0.3'  # 0.3*80=24 GiB: ~15 GiB weights + ~9 GiB KV. Leaves ~56 GiB for the PP=2 Megatron (~40). 40+24=64 < 80.

  # --- checkpointing (SHARDED dist checkpoint -> UC Volume) ---
  # Same fix as air/40: use_dist_checkpointing=True -> sharded dist save (no HF
  # full-gather OOM) AND init-load from DIST_CKPT_PATH (the HF->dist checkpoint
  # from air/02c, verified 245 GB in UC). Reshard-aware (TP1/EP8 -> TP2/EP16).
  USE_DIST_CKPT: 'True'
  DIST_CKPT_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-122B-A10B-mcore-dist
  # save_freq in TRAINER GLOBAL STEPS here; =4 with total_training_steps=6 -> one
  # sharded save mid-run. NOTE: use_dist_checkpointing only changes the CHECKPOINT
  # save; the vLLM weight RESYNC (update_weights) is a separate path and still the
  # co-location OOM risk -> escalation is PP=2, then more GPUs (util is NOT a lever:
  # it sizes only the KV tag, asleep during the resync -- rung4 lesson).
  SAVE_FREQ: '4'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-122b-classic-sync-metrics

max_retries: 0
timeout_minutes: 180

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-122B-A10B
  train_files: /Volumes/main/mshtelma/verl/data/geo3k/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/geo3k/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-122b-classic
  total_epochs: 4              # 64-prompt subset / train_batch_size 32 = 2 steps/epoch -> 8 available, capped below
  total_training_steps: 6      # step 1 compile + steady steps; save at step 4 (mid-run)
  train_batch_size: 32         # (32 * rollout_n 4) % 32 GPU == 0; /train-DP 16 = 2 prompts/rank
  ppo_mini_batch_size: 32      # == train_batch_size -> 1 optimizer update/step (like rung3)
  rollout_n: 4
  max_prompt_length: 1024
  max_response_length: 2048
  actor_lr: 1e-6
  image_key: images

command: |
  bash ${CODE_SOURCE_PATH}/scripts/run_grpo_megatron.sh
