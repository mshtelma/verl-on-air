# =============================================================================
# OfficeQA TRACE generation -- base Qwen3.5-35B-A3B, agentic, with STRUCTURED
# trajectory capture (EVAL_TRACE=1). Same eval as air/71, but each question's full
# trajectory (reasoning + every tool call's args + the tool OUTPUT) is:
#   * logged to MLflow as spans (inspectable in the MLflow UI, queryable via
#     mlflow.search_traces), and
#   * written as a JSONL bundle to the Volume (EVAL_TRACE_OUT) for the grounding
#     judge (air/73), which produces the (trajectory, reward) records to validate.
#
# This is step 1 of the grounded-reward validation pilot: get ~100+ real base-model
# trajectories with their retrieval detail, so the reward's ability to separate
# genuinely-grounded correct answers from lucky-wrong-source ones can be checked by
# hand BEFORE the reward drives training.
#
#   air run --file air/72_eval_officeqa_trace.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-72-eval-officeqa-trace
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '49152'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: eval_officeqa_agentic.py

  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  EVAL_LIMIT: '0'                  # all 246 -> full trajectory set (judge job samples ~100)
  EVAL_MAX_TURNS: '16'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/officeqa_base_traced.json

  # --- trajectory tracing (MLflow spans + JSONL bundle for the grounding judge) ---
  EVAL_TRACE: '1'
  EVAL_TRACE_OUT: /Volumes/main/mshtelma/verl/eval/officeqa_traces.jsonl
  EVAL_MLFLOW_TRACE: '1'
  MLFLOW_EXPERIMENT: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

max_retries: 0
timeout_minutes: 120

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
