# =============================================================================
# STEP 0 — image pre-flight on 1xA10 (~2 min, cheapest possible check).
#
# Validates the whole import graph, the transformers/Qwen3.5 arch pin, that
# Megatron-Bridge can resolve the model, that a C compiler exists for Triton's
# runtime JIT, and — critically — reports host CPU RAM, which is what decides
# whether OFFLOAD=1 is viable at all.
#
#   air run --file air/00_smoke_test.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-00-smoke
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v2

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  SMOKE_MODEL_ID: Qwen/Qwen3.5-35B-A3B   # config-only download, not weights
  SMOKE_VERBOSE: '1'

max_retries: 0
timeout_minutes: 30

# scripts/ ships via code_source (NOT the baked /app copy) so the pre-flight checks
# themselves can be iterated in ~2 min without rebuilding and re-registering a 16 GB
# image. The IMAGE is still what is under test -- imports, nvcc, drivers all come
# from it; only the checking code is snapshotted.
command: python3 ${CODE_SOURCE_PATH}/scripts/smoke_test.py
