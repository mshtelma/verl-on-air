# =============================================================================
# WAIT for the BIGGER Vector Search index (air/139) to finish provisioning and go ONLINE.
# ~1M+ passage embed via gte-large-en; scaling from the 507k run (~90m) this is ~3-4h, so a long
# timeout. If it still times out, VS keeps provisioning server-side -- just re-run this job, or check
# with: create_vs_index.py --skip-load --status-only.
#
#   air run --file air/140_wait_big_vs_index.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-140-wait-big-vs-index
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index

max_retries: 0
timeout_minutes: 300

command: |
  set -euo pipefail
  # Non-vLLM job; databricks-vectorsearch (for get_index/wait_until_ready) is safe to install here.
  pip install -q databricks-vectorsearch || pip install -q databricks-vectorsearch
  python3 ${CODE_SOURCE_PATH}/scripts/qa_search/create_vs_index.py --skip-load --wait-only
