# =============================================================================
# AGENTIC STEP 3 (DE-RISK) — serve the judge + validate the reward path, one node.
#
# Brings up GLM-5.3-Flash as an OpenAI-compatible SGLang endpoint on 1x 8xH100,
# then runs scripts/reward/judge_reward.py --live against localhost. This proves
# THREE things cheaply, before any multi-node agentic training run:
#   1. our stack can serve GLM-5.3-Flash on x86 H100 (glm5_next is <1-month-old);
#   2. the OpenAI endpoint answers;
#   3. judge_reward.py's prompt + JSON parsing + rule fallback all work end-to-end.
#
# Uses the OFFICIAL SGLang image (lmsysorg/sglang:glm-5.3-flash, amd64, updated
# 2026-09-02 with the weight-load/startup fixes) — NOT our verl training image;
# the judge is fully decoupled (own engine/version, reached only over HTTP).
# Reads the FP8 weights from UC (air/51), so serve-flag iteration never re-pulls.
#
# VALIDATE_ONLY=1 => the job serves, self-tests, prints the reward dict, and exits.
# If serving needs a flag tweak, add it via JUDGE_EXTRA_ARGS (e.g. a reasoning
# parser) and resubmit — weights load from UC, so each iteration is fast.
#
#   air run --file air/52_serve_judge_validate.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-52-serve-judge-validate
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: lmsysorg/sglang:glm-5.3-flash

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /local_disk0/hf
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'

  JUDGE_ENGINE: sglang
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3-Flash   # staged by air/51
  # First attempt (run 155527338320081) proved SGLang serves glm5_next fine, but
  # loading 306 GiB straight off UC FUSE ran at ~450 MiB/s (~95 min) and blew the
  # health deadline at 42%. Fix: copy once to local NVMe (~12 min), serve from there.
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_SERVED_NAME: judge
  JUDGE_TP: '8'
  JUDGE_GPU_MEM_UTIL: '0.90'      # SGLang --mem-fraction-static
  JUDGE_MAX_MODEL_LEN: '16384'    # judge sees question + trajectory; ample for GSM8K
  JUDGE_HEALTH_TIMEOUT: '1800'    # now bounds only the fast local-NVMe load + graph capture
  JUDGE_DISABLE_THINKING: '1'     # fast terse JSON verdicts
  VALIDATE_ONLY: '1'
  # NOTE: no JUDGE_EXTRA_ARGS needed — run 155527338320081 confirmed SGLang
  # auto-detects reasoning_parser=deepseek-r1, tool_call_parser=glm45 for this model.

max_retries: 0                    # bleeding-edge serve; inspect failures, don't auto-retry
timeout_minutes: 120              # one-time UC->NVMe copy (~12 min) + load + validate

command: bash ${CODE_SOURCE_PATH}/scripts/serve_judge.sh
