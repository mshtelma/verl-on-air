# =============================================================================
# OfficeQA PHASE-2 RE-PROBE -- HINT-FREE WORDING (288 episodes = 36 questions x 8 samples).
#
# The air/115 smoke found the source-verified questions TOO EASY for base 35B (23/24 solved on
# every sample), because the wording named the table title (a navigation hint) and the data is
# single-table. This re-probe tests the fix (officeqa_pipeline.py de-hinted wording: "find the
# schedule that reports X as one component of a larger total ... its share of that schedule's
# total", NO table title; answer-unique via the denominator-uniqueness gate).
#
# Cohort (frozen: probe_cohort_reprobe.jsonl, tagged _probe_group):
#   - ab (24): the EXACT 24 air/115 smoke questions, now de-hinted -> clean A/B on the WORDING
#     variable alone (qid is spec-based, so same question, only wording changed).
#   - hard_slice (12): de-hinted, sub-1pp answers (precision-hard), distinct concepts.
# Base Qwen3.5-35B-A3B TP8, temp 0.7, 80 turns, conc 16. DETERMINISTIC answer-correctness scoring
# offline (hard_synth_probe.py score) against probe_cohort_reprobe_key.json, split by _probe_group.
#
# Identical serve/funnel to air/115 EXCEPT: reprobe CSV, out dir.
#   air run --file air/116_officeqa_probe_phase2_reprobe.yaml -p df1
# =============================================================================

experiment_name: verl-on-air-116-officeqa-probe-phase2-reprobe
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve: BASE model, 256k ctx (identical to air/115) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector over the HINT-FREE re-probe CSV, temp 0.7 ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '20'
  OQ_SUBMIT_ONLY_WINDOW: '5'
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'           # CSV already IS the 36-question cohort (288 rows)
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/phase2/probe_cohort_reprobe.csv
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/phase2/probe_cohort_reprobe

  # --- corpus (the SAME clean corpus the questions were verified against) ---
  OFFICEQA_STAGE: '1'
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding: temp 0.7 (SAMPLING -> per-question pass-rate) ---
  EVAL_MAX_TURNS: '80'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0.7'

max_retries: 1
# air/115 ran 192 ep in ~24 min wall (short ~9-turn episodes). 288 ep -> ~35 min collect + warmup.
# Budget 240. Durable per-episode parts/ salvage any overrun (aggregate + top-up).
timeout_minutes: 240

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
