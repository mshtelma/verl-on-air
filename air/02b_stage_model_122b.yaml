# =============================================================================
# STEP 2b — stage Qwen3.5-122B-A10B (~244 GB, 39 safetensors shards) into the UC
#           Volume, once. Prereq for the 122B async-vs-sync perf comparison.
#
# Same mechanism as air/02 (stage_model.py: per-file download to local scratch,
# then sequential streaming copy onto the FUSE Volume; resumable — a timeout/retry
# skips files already present at the correct byte size). Runs on 1xA10 because it
# is pure network + disk (no GPU work); keeping it off the custom image means the
# 244 GB pull does not wait on a Docker build.
#
# Public, Apache-2.0 (gated=False, verified via the HF API) -> no HF_TOKEN needed.
# Scratch peak is bounded to the largest single shard (~6-7 GB), not the whole
# 244 GB, so /local_disk0 is sufficient.
#
#   air run --file air/02b_stage_model_122b.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-02b-stage-model-122b
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  version: '5'
  dependencies:
    - huggingface_hub>=0.34
    - hf_transfer          # ~3-5x faster than the pure-python downloader

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  HF_HUB_DISABLE_XET: '1'         # UC Volumes FUSE rejects Xet/CAS parallel range writes (EOPNOTSUPP)
  OPENSSL_FORCE_FIPS_MODE: '0'
  MODEL_ID: Qwen/Qwen3.5-122B-A10B
  MODEL_DIR: /Volumes/main/mshtelma/verl/models/Qwen3.5-122B-A10B
  SCRATCH_DIR: /local_disk0/hf_stage

max_retries: 2               # resumable; a retry skips already-staged shards
timeout_minutes: 300         # ~244 GB (3.5x the 35B) over download + sequential FUSE copy

command: python3 ${CODE_SOURCE_PATH}/scripts/stage_model.py
