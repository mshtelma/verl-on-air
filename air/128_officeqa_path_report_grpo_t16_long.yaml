# =============================================================================
# OfficeQA PATH-REPORT GRPO -- the FIRST SUCCESSFUL config (air/102), run LONGER (~100 syncs).
#
# WHY: air/102 (16-turn, rollout_n=16, temp 1.0, run 831..-family -> ckpt officeqa-path-report-dense)
# is the first config that ran CLEAN TO COMPLETION (45 syncs, NO OOM) and the one that learned held-out
# report well-formedness. air/125 (16-turn but DENSER: n=64, temp 1.2) OOM'd at cpv 21 AND its held-out
# hard eval came back ~PARITY with base (answer_correct 41->43, within noise; McNemar p~0.84) -- i.e.
# easy-Q GRPO has PLATEAUED across air/102 (16 syncs) + air/125 (20 syncs). This run asks the remaining
# empirical question: does anything keep EVOLVING with MORE steps (well-formedness gains, eventual
# reward-collapse / overfit), traced via a fine checkpoint ladder -> per-rung held-out eval? It is NOT
# expected to suddenly move hard-Q accuracy (reward sparsity on the ~113 easy Qs is the ceiling); the
# ladder + eval curve is the deliverable.
#
# = air/102 VERBATIM, changed ONLY to run longer + safely:
#   * total_rollout_steps 1440 -> 3200  (~100 syncs; steps = total/(TRIGGER_SYNC_STEP*ppo_mini)=3200/32)
#   * SAVE_FREQ 30 -> 10                 (10-rung ladder: HF ckpt at cpv 10/20/.../100 -> evolution curve)
#   * JUDGE_MAX_LIFETIME 14400 -> 66000  (BUG FIX: air/102's 4h judge death zeroed its back-half reward;
#                                         over ~16h the judge MUST outlive the whole run -- as air/125 did)
#   * timeout 540 -> 1080m (18h)         (100 syncs @ ~9min/sync + ~50m init + 10 HF saves + margin)
#   * +ROLLOUT_PREFIX_CACHING True       (rollout-side speedup ONLY; verl flushes the vLLM prefix+KV cache
#                                         on EVERY weight sync -> no stale-KV logprobs reach the gradient;
#                                         does NOT change training math or backward memory -> not a confound)
#   * output_dir/EXPERIMENT_NAME -> ...-t16-long (own dir; does not collide with air/102's -dense)
#
# KEPT VERBATIM = the OOM-SAFE air/102 values (this is why we run THIS config, not air/125's denser one):
#   rollout_n 16, temp 1.0 (default), max_response_length 1024, actor_lr 2e-6, STALENESS 0.5, MAX_TURNS 16,
#   funnel 4/2, officeqa_path_report data (no re-prep), 32 GPU (1 trainer + 1 rollout + 2 judge). At
#   micro_bsz=1 the actor backward is one full episode and peak mem tracks the LONGEST -- temp 1.0 + 16t
#   is the profile that never OOM'd (air/102, 45 syncs). Residual late-OOM risk over 100 syncs is real but
#   SAVE_FREQ=10 makes even an early death yield a usable ladder.
#
# Eval (repeatable, follow-on): collect+score the ladder on the 133 hard @ 80t (air/126/127 pattern),
# CKPT_ROOT -> officeqa-path-report-t16-long, per rung -> plot answer_correct / valid / abstain vs cpv.
#
#   air run --file air/128_officeqa_path_report_grpo_t16_long.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-128-officeqa-path-report-grpo-t16-long
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 32          # 4 nodes x 8 H100 (2 training + 2 judge) -- VERBATIM air/102
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # --- dispatcher: ranks 0-1 train, 2-3 judge (VERBATIM air/102) --------------
  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  JUDGE_WAIT_TIMEOUT: '2400'

  # --- training topology (VERBATIM air/102 / air/57 / air/31) ----------------
  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'

  # --- fully-async ------------------------------------------------------------
  TRIGGER_SYNC_STEP: '2'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.5'                 # VERBATIM air/102 (kept clean; prefix caching is the only speedup added)
  PARTIAL_ROLLOUT: 'True'
  # LONGER-RUN ladder: HF ckpt every 10 syncs (cpv) under output_dir/global_step_<cpv>/actor/model/
  # huggingface/ -> cpv 10/20/.../100 = 10 rungs for the evolution curve (SAVE_FREQ counts syncs).
  SAVE_FREQ: '10'

  # --- agentic multi-turn: the PATH-REPORT custom loop + BaseTools -----------
  MULTI_TURN: 'True'
  MAX_TURNS: '16'                  # PROVEN, OOM-SAFE regime (air/102); bounds the micro_bsz=1 backward
  TOOL_FORMAT: qwen3_coder         # Qwen3.5 native XML tool calls (proven air/55/53)
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '2048'    # officeqa table reads need room
  TOOL_CONFIG_PATH: ${CODE_SOURCE_PATH}/scripts/officeqa/config/path_report_tools.yaml
  AGENT_LOOP_CONFIG_PATH: ${CODE_SOURCE_PATH}/scripts/officeqa/config/path_report_agent.yaml
  # Funnel windows the custom loop reads (MUST match air/99's data-prep prompt): last 4 turns lock
  # retrieval (compute+submit only), last 2 turns submit-only.
  OQ_NUDGE_WINDOW: '4'
  OQ_SUBMIT_ONLY_WINDOW: '2'

  # --- exploration temperature: 1.0 (VERBATIM air/102 default) ---------------
  # DELIBERATELY kept at 1.0 (not air/125's 1.2): higher temp lengthens the episode tail, and at
  # micro_bsz=1 a longer episode is what OOMs the actor backward. 1.0 is the OOM-safe value.
  ROLLOUT_TEMP: '1.0'

  # --- THROUGHPUT LEVER: vLLM prefix caching ON (verl flushes cache on weight sync -> SAFE) -----
  ROLLOUT_PREFIX_CACHING: 'True'

  # --- reward: the VALIDATED path-report verifier as an in-loop reward --------
  REWARD_MANAGER: rate_limited     # REQUIRED: only this manager merges tool_extra_fields->extra_info
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/officeqa_path_report_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MAX_CONCURRENT: '32'
  REWARD_TIMEOUT: '900'            # > JUDGE_TIMEOUT; the judge call can be slow on long reports
  NORM_ADV_BY_STD_IN_GRPO: 'False' # graded reward must NOT be std-normalized (else scale collapses)
  OQ_RL_ANSWER_TOL: '0.0'
  OQ_RL_JUDGE_RETRIES: '2'

  # --- judge CLIENT knobs -----------------------------------------------------
  JUDGE_MODEL: judge
  JUDGE_MAX_TOKENS: '10240'        # GLM-5.3 reasoning + the strict support JSON
  JUDGE_REASONING_EFFORT: high
  JUDGE_TIMEOUT: '600'
  JUDGE_TEMPERATURE: '0'

  # --- judge SERVER knobs (serve_judge.sh, ranks 2-3): full GLM-5.3 TP16 ------
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_MAX_MODEL_LEN: '131072'    # right-sized (256k does NOT fit GLM-5.3 KV; see air/92/94)
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_HEALTH_TIMEOUT: '2400'
  JUDGE_MAX_LIFETIME: '66000'      # 18.3h > 18h timeout -> judge alive the WHOLE run (fixes air/102's 4h death)
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: officeqa-path-report-t16-long

# One retry as insurance against a transient judge Ray-cluster-formation flake (only 8/16 GPUs join
# the TP16 head); a retry gets a fresh node allocation. (Also covers a transient infra flake on the
# long wall -- and SAVE_FREQ=10 means a retry resumes from a fresh run, keeping earlier rungs on disk.)
max_retries: 1
timeout_minutes: 1080            # 18h: ~50m init + ~100 syncs @ ~9min (rollout_n=16) + 10 HF saves + margin

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/officeqa_path_report/train.parquet   # 16-turn funnel (air/99)
  val_files: /Volumes/main/mshtelma/verl/data/officeqa_path_report/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-t16-long
  total_epochs: 20
  ppo_mini_batch_size: 16          # 16 % trainer-DP(4) == 0 (1 trainer node, TP2 -> DP4)
  rollout_n: 16                    # VERBATIM air/102 (the OOM-safe density; NOT air/125's 64)
  total_rollout_steps: 3200        # ~100 syncs (steps = total/(TRIGGER_SYNC_STEP*ppo_mini) = 3200/32)
  max_prompt_length: 2048          # officeqa system prompt (funnel) + question
  max_response_length: 1024        # per-turn cap; episode budget = multi-turn accumulation
  actor_lr: 2e-6                   # VERBATIM air/102 (kl_loss_coef=0.01 keeps it stable)

# AI Runtime runs this once per node; the dispatcher routes each POD_RANK to train vs judge.
command: |
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
