# =============================================================================
# OfficeQA PATH-REPORT SCORING -- 133 HARD, the air/128 LONG 16-turn run @ 80t eval (scores air/129).
#
# The scorer for the air/128 held-out hard eval ladder. IDENTICAL scoring knobs to air/98/108/127
# (validated GLM-5.3 judge TP16 + deterministic gates + answer-key; three SEPARATE labels; UNKNOWN !=
# negative; offline previews). Contract holds: correct-but-unsupported answers still get ZEROED. Each
# scored_hard_t16long_step<N> is directly comparable to base@80 (scored_hard_v4) -> the evolution curve.
#
# PARAMETERIZED BY RUNG, matching air/129. Pass the SAME --override you gave air/129:
#   air run -f air/130_officeqa_score_hard_t16long.yaml --override env_variables.OQ_CKPT_STEP=20 -p df1 --watch
# OQ_CKPT_STEP defaults to 'latest' (highest collect_hard_t16long_step<N> that air/129 produced).
#
# PRECONDITION: air/129 must have written collect_hard_t16long_step<N>/captures.jsonl for that rung.
# Judge serve + all judge/gate/answer-key knobs VERBATIM from air/127.
#
#   air run --file air/130_officeqa_score_hard_t16long.yaml -p df1 --watch     # scores the latest collected rung
# =============================================================================

experiment_name: verl-on-air-130-officeqa-score-hard-t16long
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16               # 2x 8xH100 -> TP16 for the full GLM-5.3 judge
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'

  # --- WHICH RUNG to score: must match the air/129 --override that produced the captures -----
  OQ_CKPT_STEP: 'latest'

  # --- judge serve (full GLM-5.3, TP16, 2 nodes) -- proven config from air/92/94/96/98/108/127 ---
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_SERVED_NAME: judge
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_MAX_MODEL_LEN: '131072'                 # 128k: right-sized + fits KV (256k does NOT; see air/94)
  JUDGE_HEALTH_TIMEOUT: '2400'
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  # --- score the trained-long hard captures with the full tool history ---
  OQ_SCORE_EPISODES: '1'
  # OQ_EPISODES_FILE + OQ_SCORE_OUT are set in the command (encode the resolved rung).
  OQ_ANSWER_KEY: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OQ_ANSWER_TOL: '0.0'
  OQ_SCORE_MAX_RETRIES: '2'
  OQ_MAX_HISTORY_BYTES: '480000'                # matches air/98/108/127 so all arms are scored identically
  OQ_SCORE_CONCURRENCY: '8'                     # parallel judge calls (I/O-bound)

  # --- judge client knobs (path_report_pilot.make_http_judge reads these) ---
  JUDGE_MODEL: judge
  JUDGE_REASONING_EFFORT: high
  JUDGE_MAX_TOKENS: '10240'
  JUDGE_TEMPERATURE: '0'
  JUDGE_TIMEOUT: '900'

# One retry as insurance against the transient judge Ray-cluster-formation flake (only 8/16 GPUs
# joined the TP16 head); a retry gets a fresh node allocation.
max_retries: 1
timeout_minutes: 210                             # 133 hard reports x (gates + judge) at conc 8 + judge cold-load

# Resolve the collected rung (OQ_CKPT_STEP, or the LATEST collect_hard_t16long_step<N>), point the
# scorer at its captures + an immutable per-rung output dir, then serve the judge + score.
command: |
  BASE=/Volumes/main/mshtelma/verl/eval/path_report/deliverable_b
  STEP="${OQ_CKPT_STEP:-latest}"
  if [ "${STEP}" = "latest" ]; then
    D=$(ls -d ${BASE}/collect_hard_t16long_step* 2>/dev/null \
        | awk -F'_step' '{n=$NF+0; print n"\t"$0}' | sort -n | tail -1 | cut -f2-)
    STEP=$(printf '%s' "${D}" | awk -F'_step' '{n=$NF+0; print n}')
  else
    D="${BASE}/collect_hard_t16long_step${STEP}"
  fi
  if [ ! -s "${D}/captures.jsonl" ]; then
    echo "FATAL: no captures.jsonl at '${D}' (requested step '${OQ_CKPT_STEP:-latest}'); run air/129 for this rung first" >&2
    echo "Available collects:" >&2; ls -d ${BASE}/collect_hard_t16long_step* 2>/dev/null >&2
    exit 1
  fi
  export OQ_EPISODES_FILE="${D}/captures.jsonl"
  export OQ_SCORE_OUT="${BASE}/scored_hard_t16long_step${STEP}"
  echo "Scoring rung step ${STEP}: ${OQ_EPISODES_FILE} -> ${OQ_SCORE_OUT}"
  bash ${CODE_SOURCE_PATH}/scripts/serve_judge.sh
