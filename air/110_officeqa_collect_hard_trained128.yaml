# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — 133 HARD, TRAINED model @ the 128-TURN budget.
#
# The TRAINED arm of the 128-turn probe (pairs with air/109 base@128). IDENTICAL to air/109
# except EVAL_MODEL_PATH/MODEL_PATH point at the air/102 checkpoint (global_step_45 HF export)
# and OQ_COLLECT_OUT is the trained dir. Completes the >=100-turn 2x2:
#     base@16=14   base@80=38   base@128=?      (does budget keep helping beyond 80?)
#     trained@16=17  trained@80=(cancelled)  trained@128=?  (does the 16t-trained ckpt use a long budget?)
#
# NOTE: the checkpoint was TRAINED under a 16-turn funnel, so 128 turns is OUT of distribution
# for its learned behavior -- that is exactly the question (does it generalize to a long budget,
# or is it stuck in early-submit habits -> retrain at long budget for Phase-2).
#
# Scoring is the separate air/112 job.
#
#   air run --file air/110_officeqa_collect_hard_trained128.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-110-officeqa-collect-hard-trained128
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve: the air/102 TRAINED checkpoint (global_step_45 HF export); 256k ctx ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-dense/global_step_45/actor/model/huggingface
  MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-dense/global_step_45/actor/model/huggingface
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '262144'         # identical to air/109 (base arm)
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + 128-turn 3-phase funnel + PARALLEL (identical to air/109) ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '28'            # == air/109
  OQ_SUBMIT_ONLY_WINDOW: '5'       # == air/109
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'            # 0 = ALL hard questions (133)
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard_trained128

  # --- corpus + questions (staged exactly as air/109) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (identical to air/109) ---------
  EVAL_MAX_TURNS: '128'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 540

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
