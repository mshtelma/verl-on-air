# =============================================================================
# OfficeQA PATH-REPORT GRPO -- 32-turn, DENSER groups + more rollout GPUs + higher temp (~12h).
#
# air/122 (run 555826006971431) fixed the OOM and confirmed reward FIRES (cpv 3,6 hit reward_max=1.0)
# but it is SPARSE (mean ~0.01; most GRPO groups all-zero -> little gradient) and the run is
# GENERATION-BOUND (rollouter ~90% busy, trainer ~73% IDLE). This run attacks both:
#   * BIGGER GROUPS: rollout_n 32 -> 64. More samples/prompt -> far more prompts land a MIXED
#     win/lose group -> denser GRPO gradient (the diagnosed Phase-1 lever; at ~3% success P(>=1 win)
#     rises 62%->86%).
#   * HIGHER TEMP: rollout temperature 1.0 -> 1.2 (new ROLLOUT_TEMP launcher knob). More exploration
#     diversity -> more prompts stumble onto a scoring path -> denser reward.
#   * MORE ROLLOUT GPUs (the gen-bound fix): 1 -> 3 rollout nodes. The trainer is 73% idle so adding
#     TRAINER gpus does nothing; 3x rollout capacity for 2x samples (n=64) -> ~1.5x FASTER syncs AND
#     the bigger group. 48 GPU = 1 trainer + 3 rollout + 2 judge (TRAINING_NODES=4, ROLLOUT_NNODES=3).
#   * FINER CKPTS: SAVE_FREQ 10 -> 5 (cpv 5,10,15,... -> a learning curve to eval; GPUs/IO not a
#     constraint). Saves at ckpt/officeqa-path-report-t32b/global_step_<cpv>/actor/model/huggingface/.
#
# SAME data (officeqa_path_report_t32, 32/8/4 funnel UNCHANGED -> no re-prep). Memory stays safe
# (backward is micro_bsz=1, one 32-turn episode -> ~54GB/80GB; n only affects rollout KV, absorbed by
# the 3 rollout nodes). Judge stays TP16/2-node (most episodes fail the gate before the judge, so it
# is under-utilized -> not the bottleneck). Eval air/119/120 -> repoint CKPT_ROOT to t32b when ready.
#
#   air run --file air/123_officeqa_path_report_grpo_t32_dense.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-123-officeqa-path-report-grpo-t32-dense
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 48          # 6 nodes x 8 H100: 1 trainer + 3 rollout (TRAINING_NODES=4) + 2 judge
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # --- dispatcher: 4 training-side nodes (ranks 0-3), 2 judge (ranks 4-5) --------
  TRAINING_NODES: '4'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  JUDGE_WAIT_TIMEOUT: '2400'

  # --- training topology: 1 trainer node + 3 rollout nodes -----------------------
  ROLLOUT_NNODES: '3'              # 3 whole rollout nodes (was 1) -> 3x generation capacity
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'

  # --- fully-async ------------------------------------------------------------
  TRIGGER_SYNC_STEP: '2'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.5'
  PARTIAL_ROLLOUT: 'True'
  SAVE_FREQ: '5'                   # every 5 syncs (current_param_version) -> HF ckpt; ~8 over 12h

  # --- agentic multi-turn: the PATH-REPORT custom loop + BaseTools -----------
  MULTI_TURN: 'True'
  MAX_TURNS: '32'                  # unchanged from air/122 (memory-safe; data funnel matches)
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '2048'
  TOOL_CONFIG_PATH: ${CODE_SOURCE_PATH}/scripts/officeqa/config/path_report_tools.yaml
  AGENT_LOOP_CONFIG_PATH: ${CODE_SOURCE_PATH}/scripts/officeqa/config/path_report_agent.yaml
  OQ_NUDGE_WINDOW: '8'             # MUST match officeqa_path_report_t32 data (last 8 lock retrieval)
  OQ_SUBMIT_ONLY_WINDOW: '4'       # last 4 submit-only

  # --- higher exploration temperature (new launcher knob) ---------------------
  ROLLOUT_TEMP: '1.2'              # 1.0 -> 1.2: more diverse rollouts -> denser reward signal

  # --- reward: the VALIDATED path-report verifier as an in-loop reward --------
  REWARD_MANAGER: rate_limited
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/officeqa_path_report_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MAX_CONCURRENT: '48'      # more rollout throughput -> allow more concurrent reward calls
  REWARD_TIMEOUT: '900'
  NORM_ADV_BY_STD_IN_GRPO: 'False'
  OQ_RL_ANSWER_TOL: '0.0'
  OQ_RL_JUDGE_RETRIES: '2'

  # --- judge CLIENT knobs -----------------------------------------------------
  JUDGE_MODEL: judge
  JUDGE_MAX_TOKENS: '10240'
  JUDGE_REASONING_EFFORT: high
  JUDGE_TIMEOUT: '600'
  JUDGE_TEMPERATURE: '0'

  # --- judge SERVER knobs (serve_judge.sh, ranks 4-5): full GLM-5.3 TP16 ------
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_MAX_MODEL_LEN: '131072'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_HEALTH_TIMEOUT: '2400'
  JUDGE_MAX_LIFETIME: '46800'      # 13h > 12h timeout -> judge alive the whole run
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: officeqa-path-report-t32b

max_retries: 1
timeout_minutes: 720             # ~12h wall

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/officeqa_path_report_t32/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/officeqa_path_report_t32/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-t32b
  total_epochs: 20
  ppo_mini_batch_size: 16          # 16 % trainer-DP(4) == 0 (1 trainer node, TP2 -> DP4)
  rollout_n: 64                    # BIGGER groups: 32 -> 64 (the anti-sparsity lever)
  total_rollout_steps: 3200        # ~100 syncs; ABOVE what 12h reaches so the WALL binds
  max_prompt_length: 2048
  max_response_length: 1024
  actor_lr: 2e-6

command: |
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
