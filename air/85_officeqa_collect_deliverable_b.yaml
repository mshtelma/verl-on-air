# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — Deliverable B, phase 1 (actor rollouts).
#
# Deliverable B (handoff Section 8 / pilot Section 6): measure ACTOR USABILITY of
# the terminal-JSON path-report contract on REAL rollouts, labeled by machinery only
# (no human reviewer). This job is the COLLECTION half: it serves the base actor
# (Qwen3.5-35B-A3B, identical serving path to air/71 / air/84) and drives ~30 EASY
# OfficeQA questions through the INSPECTION-VERIFIED collector
# (scripts/officeqa/path_report_collect.py). It records ONLY capture records
# (runtime observation IDs + delivery + chronology + terminal report) to the Volume.
#
# It is NOT a measurement: no scoring, no judge, no reward here. Scoring is the
# separate, offline phase-2 job (air/86) which serves GLM-5.3 and runs
# path_report_pilot.py --episodes <this job's captures.jsonl>. Keeping collection and
# scoring in different jobs avoids co-hosting a 35B actor and the 755 GB judge.
#
# Scaled up from the air/84 smoke (2 -> ~30 questions); everything else is identical
# (same model/TP/serve-len/decoding), so the format handling is already GPU-proven.
# Expect a fraction of episodes to hit the 16-turn budget with no synthesized report
# (a real usability finding the smoke surfaced) -- that is DATA, recorded, not an error.
#
#   air run --file air/85_officeqa_collect_deliverable_b.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-85-officeqa-collect-deliverable-b
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve (identical to air/71 baseline + air/84 smoke) ----------------
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '49152'          # multi-turn (16) + large table tool outputs
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- run the collector instead of the eval client -----------------------------
  # serve_and_eval.sh exports EVAL_BASE_URL/EVAL_MODEL after /health, then runs this
  # script with NO CLI args; OQ_COLLECT_LIVE=1 makes it collect from env (_live_from_env).
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_COLLECT_DIFFICULTY: easy       # easy-Q rollouts (pilot Section 6 Deliverable B)
  OQ_COLLECT_LIMIT: '30'            # ~20-40 real questions
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_v1

  # --- corpus + questions (staged exactly as air/71 / air/84) -------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (base-actor defaults, matched to air/71 / air/84) ---------
  EVAL_MAX_TURNS: '16'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 180                # ~10 min cold serve load + ~30 sequential episodes

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
