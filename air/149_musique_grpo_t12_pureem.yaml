# =============================================================================
# MuSiQue AGENTIC-SEARCH GRPO -- PURE-EM @ MAX_TURNS=12 (the ablation for air/147).
# air/147 (retrieval reward + 12 turns) showed FLAT training reward through 11 syncs and step_10 eval
# ~= baseline. Two hypotheses: (a) throughput-limited (~30 syncs max in 10h), (b) the retrieval bonus
# adds little (recall already 79% -> near-constant within GRPO groups -> cancels in the advantage) and
# may dilute the EM gradient that actually drives the CONVERSION gains (air/143's +11pt EM|retrieved).
#
# This run isolates the TURN lever alone: identical to air/147 but QA_RETRIEVAL_BONUS=0.0 (== air/143
# config + MAX_TURNS 8->12). If this climbs like air/143 did (conversion rising via the undiluted EM
# gradient) while the 12 turns hold recall up, it tells us the bonus was unnecessary/counterproductive
# and turns are the real lever. Runs in PARALLEL with air/147; compare step_10/20 of both vs base@12t=54%.
#
# Two nodes / 16xH100, judge-free.  air run --file air/149_musique_grpo_t12_pureem.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-149-musique-grpo-t12-pureem
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN

  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'
  ROLLOUT_PREFIX_CACHING: 'True'

  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  MULTI_TURN: 'True'
  MAX_TURNS: '12'                  # the turn lever (same as air/147)
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '4000'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/scripts/tools/qa_search_tools.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/qa_search_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: naive
  QA_RETRIEVAL_BONUS: '0.0'        # ABLATION: bonus OFF -> pure Search-R1 EM (the only diff vs air/147)

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'

  SAVE_FREQ: '10'
  TEST_FREQ: '-1'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: musique-grpo-t12-pureem

max_retries: 0
timeout_minutes: 600

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/qa_musique/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/musique-grpo-t12-pureem
  total_epochs: 2
  ppo_mini_batch_size: 32
  rollout_n: 16
  total_rollout_steps: 3200
  max_prompt_length: 2048
  max_response_length: 512
  actor_lr: 2e-6

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
