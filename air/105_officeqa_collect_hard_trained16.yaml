# =============================================================================
# OfficeQA PATH-REPORT COLLECTION — 133 HARD, TRAINED model, at the 16-TURN TRAINING FUNNEL.
#
# The TRAINED arm of the base-vs-trained hard-Q A/B for the air/102 GRPO run. IDENTICAL to air/103
# (the base arm) except EVAL_MODEL_PATH/MODEL_PATH point at the air/102 checkpoint's HF export and
# OQ_COLLECT_OUT is the trained dir. Same IN-DISTRIBUTION 16-turn funnel (MAX_TURNS=16, NUDGE=4,
# SUBMIT_ONLY=2) the model trained under -> a clean A/B where the ONLY variable is base vs trained.
#
# CHECKPOINT PATH: verl (mbridge backend, use_dist_checkpointing=False) writes a full HF export at
# <ckpt>/global_step_N/actor/model/huggingface/ (config.json + 14 safetensors shards + tokenizer;
# vLLM-servable, confirmed loadable in air/60). air/102 (run 694643394691897) completed with TWO
# checkpoints: global_step_30 (save_freq multiple) and global_step_45 (final save at run end). This
# is the FINAL = global_step_45 (all 45 syncs). NOTE: air/102's training reward was flat/slightly
# declining with an all-zero back-half, so global_step_45 may not beat base; if it regresses, the
# global_step_30 mid checkpoint is the diagnostic follow-up (re-point this file's paths at it).
#
# Scoring is the separate air/106 job.
#
#   air run --file air/105_officeqa_collect_hard_trained16.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-105-officeqa-collect-hard-trained16
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # --- actor serve: the air/102 TRAINED checkpoint HF export (LATEST global_step_N) ---
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-dense/global_step_45/actor/model/huggingface
  MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/officeqa-path-report-dense/global_step_45/actor/model/huggingface
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '131072'         # identical to air/103 (base arm)
  EVAL_GPU_UTIL: '0.90'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  # --- collector: SUBMIT contract + IN-DISTRIBUTION 16-turn 3-phase funnel + PARALLEL ---
  EVAL_SCRIPT: officeqa/path_report_collect.py
  OQ_COLLECT_LIVE: '1'
  OQ_REQUIRE_SUBMIT: '1'
  OQ_NUDGE_WINDOW: '4'             # == air/103 / air/102 training
  OQ_SUBMIT_ONLY_WINDOW: '2'       # == air/103 / air/102 training
  OQ_COLLECT_CONCURRENCY: '16'
  OQ_COLLECT_DIFFICULTY: hard
  OQ_COLLECT_LIMIT: '0'            # 0 = ALL hard questions (133 in officeqa_full.csv)
  OQ_COLLECT_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard_trained16

  # --- corpus + questions (staged exactly as air/103) ----------------------------
  OFFICEQA_STAGE: '1'
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_clean.zip
  OFFICEQA_SEARCH_TOP_K: '6'

  # --- actor decoding (identical to air/103) ---------
  EVAL_MAX_TURNS: '16'             # == air/102 training MAX_TURNS (in-distribution)
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'

max_retries: 0
timeout_minutes: 180                # 16-way overlap of 133 hard @ 16 turns + cold model load

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
