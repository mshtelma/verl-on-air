# =============================================================================
# OfficeQA PATH-REPORT SCORING — 133 HARD, TRAINED model @ 16-turn funnel (scores air/105).
#
# The TRAINED arm's scorer for the base-vs-trained hard-Q A/B (air/102 GRPO run). IDENTICAL knobs
# to air/104 (the base arm) with only the episodes/out paths swapped -> scored_hard_trained16 is
# directly comparable to scored_hard_base16. Same validated judge + deterministic gates + answer-key
# (three SEPARATE labels; UNKNOWN != negative; offline previews). Improvement = trained's
# n_scored/answered + mean supported-graded score rises over base WITHOUT faithfulness regressing
# (n_ref_invalid / n_value_fabricated among SCORED stay ~0; correct+unsupported still ZEROED).
#
# Derived from air/98/104. Changed ONLY:
#   * OQ_EPISODES_FILE -> .../collect_hard_trained16/captures.jsonl   (air/105's output)
#   * OQ_SCORE_OUT     -> .../scored_hard_trained16                    (immutable)
# Judge serve + all judge/gate/answer-key knobs VERBATIM from air/98 (proven air/92/94/96).
#
# PRECONDITION: air/105 must have written captures.jsonl to OQ_EPISODES_FILE below.
# Exits non-zero only on an integrity violation.
#
#   air run --file air/106_officeqa_score_hard_trained16.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-106-officeqa-score-hard-trained16
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16               # 2x 8xH100 -> TP16 for the full GLM-5.3 judge
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'

  # --- judge serve (full GLM-5.3, TP16, 2 nodes) -- proven config from air/92/94/96/98 ---
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache
  JUDGE_SERVED_NAME: judge
  JUDGE_TP: '16'
  JUDGE_RAY_VERSION: '2.48.0'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_MAX_MODEL_LEN: '131072'                 # 128k: right-sized + fits KV (256k does NOT; see air/94)
  JUDGE_HEALTH_TIMEOUT: '2400'
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  # --- score the trained-16 hard captures with the full tool history ---
  OQ_SCORE_EPISODES: '1'
  OQ_EPISODES_FILE: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/collect_hard_trained16/captures.jsonl
  OQ_SCORE_OUT: /Volumes/main/mshtelma/verl/eval/path_report/deliverable_b/scored_hard_trained16   # immutable
  OQ_ANSWER_KEY: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OQ_ANSWER_TOL: '0.0'
  OQ_SCORE_MAX_RETRIES: '2'
  OQ_MAX_HISTORY_BYTES: '480000'                # never binds (hard max request ~141k chars ~= 59k tokens)
  OQ_SCORE_CONCURRENCY: '8'                     # parallel judge calls (I/O-bound)

  # --- judge client knobs (path_report_pilot.make_http_judge reads these) ---
  JUDGE_MODEL: judge
  JUDGE_REASONING_EFFORT: high
  JUDGE_MAX_TOKENS: '10240'
  JUDGE_TEMPERATURE: '0'
  JUDGE_TIMEOUT: '900'

# One retry as insurance against the transient judge Ray-cluster-formation flake (only 8/16 GPUs
# joined the TP16 head) that hit air/102's first launch; a retry gets a fresh node allocation.
max_retries: 1
timeout_minutes: 210                             # 133 hard reports x (gates + judge) at conc 8 + judge cold-load

command: bash ${CODE_SOURCE_PATH}/scripts/serve_judge.sh
