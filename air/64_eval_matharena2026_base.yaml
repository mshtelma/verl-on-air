# =============================================================================
# UNCONTAMINATED HELD-OUT BASELINE — BASE Qwen3.5-35B-A3B on MathArena 2026, agentic.
#
# MATH-500 and AIME 2024/2025 were all correctness-saturated for this model (right
# 95-100% WHENEVER it answers; AIME 2025 = 44/44 among-answered -> contamination-
# suspect, since a 2026 model has ingested Feb-2025 exams). Per the user's decision we
# move to a GENUINELY held-out set: MathArena's 2026 competitions (AIME 2026 + HMMT Feb
# 2026), released AFTER the model's training cutoff -> truly unseen. Integer/short
# answers -> robust scoring; HMMT is harder than AIME -> more headroom.
#
# THIS BASELINE IS THE GO/NO-GO: if the base is well below the correctness ceiling here
# (some WRONG answers, not just no-answers), we have real headroom and proceed to train
# on hard DAPO -> eval here. If it is STILL ~100%-among-answered, the model is genuinely
# at the frontier and we rethink.
#
#   air run --file air/64_eval_matharena2026_base.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-64-eval-matharena2026-base
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '24576'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'

  EVAL_DATASET: matharena2026    # AIME 2026 (MathArena/aime_2026) + HMMT Feb 2026 (MathArena/hmmt_feb_2026)
  EVAL_LIMIT: '0'                # all 63
  EVAL_MAX_TURNS: '8'
  EVAL_MAX_TOKENS: '4096'
  EVAL_MAX_CONT: '4'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/matharena2026_base.json

max_retries: 0
timeout_minutes: 90

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
