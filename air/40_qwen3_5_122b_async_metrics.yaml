# =============================================================================
# PERF RUN A (ASYNC) — Qwen3.5-122B-A10B fully-async / disaggregated, 24 GPU
#   (3 nodes): 16 trainer GPU (2 nodes) + 8 dedicated rollout GPU (1 node).
#
# Half of the async-vs-sync throughput comparison (the other half is air/41, sync
# co-located). Kept SHORT — a few
# steady steps past the first-step compile — purely to measure tokens/GPU/sec,
# MFU, and the step-time breakdown. It ALSO saves one full resumable checkpoint
# mid-run (SAVE_FREQ) to exercise the 122B dist-checkpoint -> UC write (~1.7 TB).
#
# TOPOLOGY: ROLLOUT_NNODES=1 -> launcher gives the Rollouter 1 whole node (8 GPU)
# and the Trainer the other 2 (16 GPU). Trainer: classic Megatron + full CPU
# offload, TP=2 PP=1 EP=16 ETP=1 -> train-DP=8, expert-DP=1. EP=16 (not 8) because
# classic REPLICATES params+grads across DP; at EP=8 the 122B is ~70 GiB/GPU and
# OOMs at init (run 511710866708108). EP=16 halves expert params -> ~41 GiB, fits.
# CAVEAT: EP=16 spans both trainer nodes -> cross-node expert all-to-all, so this
# is a CONSERVATIVE async throughput (intra-node ETP=2/PP=2 would be faster/fairer).
# Rollouter: 1 vLLM replica, GEN_TP=8; 122B weights ~30 GiB/GPU leaves ~46 GiB KV.
# The disaggregated weight
# sync is an NCCL broadcast (checkpoint_engine backend=nccl), NOT the ZeRO-3
# full-gather — so the trainer pays NO vLLM memory tax at all.
#
# METRICS TO PULL (verl emits all of these per step):
#   perf/throughput (tokens/s; /24 = tokens/GPU/s) - perf/mfu/actor -
#   timing_s/{gen,ref,update_actor,param_sync,step} - timing_per_token_ms/* -
#   actor/perf/{max_memory_reserved_gb,cpu_memory_used_gb} -
#   dynamic_resource/{train,rollout}_resource_utilization + trainer/idle_ratio
#   (the async overlap signal). Skip step 1 (compile); average the rest.
#
#   air run --file air/40_qwen3_5_122b_async_metrics.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-40-qwen3_5-122b-fully-async-metrics
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 24        # 3 nodes: 2 trainer (16 GPU) + 1 rollout (8 GPU)
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # --- disaggregation split: 1 rollout node (8 GPU) + 3 trainer nodes (24 GPU) ---
  ROLLOUT_NNODES: '1'
  TP: '2'                      # 32 Q-heads / 2; trainer tensor-parallel
  PP: '1'
  CP: '1'
  EP: '16'                     # 256 experts -> 16/rank; HALVES expert params+grads to fit 122B init (TP2/EP8 OOM'd at ~70 GiB/GPU). expert-DP = 16/16 = 1
  ETP: '1'
  GEN_TP: '8'                  # 1 vLLM replica across the rollout node
  # intra-node GEN_TP=8 crashed vLLM's CUDA-graph capture in the custom all-reduce
  # kernel ("custom_all_reduce.cuh:455 invalid argument", run 211655681315147, killed
  # every rollout worker at init). enforce_eager skips graph capture -> avoids it.
  # (Cross-node GEN_TP=16 in the sync run used NCCL and was unaffected.)
  ROLLOUT_ENFORCE_EAGER: 'True'
  OFFLOAD_FRACTION: '1'        # park Adam in host RAM (classic ZeRO-1)
  ROLLOUT_GPU_MEM_UTIL: '0.7'  # dedicated rollout GPUs; 122B weights ~28 GiB + KV

  # --- fully-async knobs ---
  TRIGGER_SYNC_STEP: '2'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  # --- checkpointing (SHARDED dist checkpoint -> UC Volume) ---
  # use_dist_checkpointing=True makes BOTH init-load and save use the sharded
  # Megatron dist_checkpointing format. Without it, the `model` content is saved
  # via a FULL-GATHER HF export that OOMs at 122B (run 444713674103804 died there:
  # _save_model_as_hf_via_bridge). The flag ALSO switches init to load from
  # DIST_CKPT_PATH, so we point it at the HF->dist checkpoint produced by air/02c
  # (run 403338495784183, verified 245.2 GB, 8 shards, in UC). Reshard-aware:
  # converted at TP=1/EP=8, loaded here at TP=2/EP=16.
  USE_DIST_CKPT: 'True'
  DIST_CKPT_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-122B-A10B-mcore-dist
  # fully_async_trainer saves when save_freq>0 (counts param-sync versions) + a
  # forced save at completion. save_freq=4 targets ~one sharded save mid-run.
  # Per-step throughput is logged BEFORE the save boundary, so tok/s stays clean.
  SAVE_FREQ: '4'

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-122b-fully-async-metrics

max_retries: 0
timeout_minutes: 180

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-122B-A10B
  train_files: /Volumes/main/mshtelma/verl/data/geo3k/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/geo3k/test.parquet
  # fresh dir: the prior async attempt's output dir holds a stale global_step_4 that
  # would (a) false-pass the exit guard and (b) risk an auto-resume from a foreign ckpt.
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-122b-fully-async-v2
  total_epochs: 5              # data headroom; run is bounded by total_rollout_steps
  ppo_mini_batch_size: 16      # % train-DP(8) == 0  (16 trainer GPU / TP2 = DP8)
  rollout_n: 4
  # syncs = total_rollout_steps / (trigger2 * require1 * ppo_mini16) = /32.
  # 128 -> 4 syncs: step 1 is compile, the rest give steady metrics.
  total_rollout_steps: 128
  max_prompt_length: 1024
  max_response_length: 2048
  actor_lr: 1e-6

command: |
  bash ${CODE_SOURCE_PATH}/scripts/run_grpo_fully_async.sh
