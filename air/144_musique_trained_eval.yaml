# =============================================================================
# MuSiQue TRAINED-CHECKPOINT eval -- the demo delta vs the 52% base (air/141).
# Serves a GRPO checkpoint from air/143 and runs the SAME agentic search eval / same 200 MuSiQue-dev
# / same big index / same EM metric, so the trained-vs-base EM difference is apples-to-apples.
#
# Point MODEL_PATH + EVAL_MODEL_PATH at the checkpoint's HF export. Default is global_step_10; OVERRIDE
# at submit for the actual latest step, e.g.:
#   air run -f air/144_musique_trained_eval.yaml -p df1 \
#     --override env_variables.MODEL_PATH=/Volumes/main/mshtelma/verl/ckpt/musique-grpo/global_step_40/actor/model/huggingface \
#               env_variables.EVAL_MODEL_PATH=/Volumes/main/mshtelma/verl/ckpt/musique-grpo/global_step_40/actor/model/huggingface \
#               env_variables.EVAL_OUT=/Volumes/main/mshtelma/verl/eval/musique_trained_step40.json
# (Confirm the exact checkpoint path exists first.)
# =============================================================================

experiment_name: verl-on-air-144-musique-trained-eval
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  # Point at the trained checkpoint's HF export (override the step at submit).
  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/musique-grpo/global_step_10/actor/model/huggingface
  MODEL_PATH: /Volumes/main/mshtelma/verl/ckpt/musique-grpo/global_step_10/actor/model/huggingface
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '32768'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: eval_search_agentic.py

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'
  QA_VAL_PARQUET: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet

  EVAL_LIMIT: '200'               # same 200 dev Qs as the base (air/141) for apples-to-apples
  EVAL_MAX_TURNS: '8'
  EVAL_MAX_TOKENS: '512'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  QA_REWARD_METRIC: em
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/musique_trained.json
  EVAL_TRACE_OUT: /Volumes/main/mshtelma/verl/eval/musique_trained_traces.jsonl

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
