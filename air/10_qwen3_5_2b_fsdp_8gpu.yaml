# =============================================================================
# RUNG 1 — cheapest end-to-end validation of the ENTIRE target code path.
#
# Qwen3.5-2B is dense but architecturally the same family as 35B-A3B: same
# qwen3_5 arch, same Gated-DeltaNet linear-attention layers, same vision tower,
# same Megatron-Bridge weight mapping, same Megatron-FSDP wiring, same geo3k
# data and same reward. The ONLY things that change on the way to rung 4 are
# the model size and EP. So if this passes, every remaining failure is a
# capacity/topology problem rather than a "does the stack work" problem.
#
# Dense model => EP=1. There are no experts to shard.
#
#   air run --file air/10_qwen3_5_2b_fsdp_8gpu.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-10-qwen3_5-2b-fsdp
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v3

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN
  RAY_TEMP_DIR: /tmp/ray

  MEGATRON_MODE: fsdp
  OFFLOAD: '0'        # 2B fits trivially
  TP: '1'
  PP: '1'
  EP: '1'             # dense: no experts
  ETP: '1'
  GEN_TP: '2'
  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-2b-fsdp-8gpu

max_retries: 0
timeout_minutes: 90

parameters:
  model_name: Qwen/Qwen3.5-2B
  train_files: /Volumes/main/mshtelma/verl/data/geo3k/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/geo3k/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-2b-fsdp
  total_epochs: 1
  total_training_steps: 3      # smoke: prove the loop turns, then stop
  train_batch_size: 32         # (32 * 5) % 8 GPUs == 0
  ppo_mini_batch_size: 32
  rollout_n: 5
  max_prompt_length: 1024
  max_response_length: 1024
  image_key: images

command: bash ${CODE_SOURCE_PATH}/scripts/run_grpo_megatron.sh
