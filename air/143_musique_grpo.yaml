# =============================================================================
# MuSiQue AGENTIC-SEARCH GRPO — the full training run (the demo's learning result).
# Base 35B = 52% EM (air/141). Train with GRPO over MuSiQue-Ans, retrieving from the 604k union
# index via the REST search tools; rule-based EM reward. Save checkpoints periodically -> eval each
# vs the 52% base (air/144). The base->trained EM delta is the deliverable.
#
# Config informed by the air/142 smoke (all validated there): ambient VS auth reaches Ray actors;
# healthy advantages; no OOM at 40/80GB (headroom -> rollout_n 8->16); ~350s/step at rollout_n8.
# Knobs: rollout_n=16 (GRPO group size), ppo_mini=32 (=> 2 prompts/sync), lr 2e-6, MAX_TURNS 8,
# prefix-caching ON (SAFE: verl flushes cache on weight sync). syncs = total_rollout_steps/ppo_mini
# = 3200/32 = up to 100; SAVE_FREQ=10 -> ~10 checkpoints; run governed by the 10h timeout.
# Binary EM reward -> standard GRPO norm (NORM_ADV_BY_STD default; NOT the graded-reward exception).
#
# Two nodes / 16xH100, judge-free.  air run --file air/143_musique_grpo.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-143-musique-grpo
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 16
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN

  TRAINING_NODES: '2'
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous

  ROLLOUT_NNODES: '1'
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'
  ROLLOUT_PREFIX_CACHING: 'True'   # SAFE: verl flushes the prefix cache on each weight sync

  TRIGGER_SYNC_STEP: '1'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.1'
  PARTIAL_ROLLOUT: 'True'

  MULTI_TURN: 'True'
  MAX_TURNS: '8'
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '4000'
  FUNCTION_TOOL_PATH: ${CODE_SOURCE_PATH}/scripts/tools/qa_search_tools.py
  CUSTOM_REWARD_PATH: ${CODE_SOURCE_PATH}/scripts/reward/qa_search_reward.py
  CUSTOM_REWARD_NAME: compute_score
  REWARD_MANAGER: naive

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'

  SAVE_FREQ: '10'                  # checkpoint every 10 syncs (HF export -> eval ladder)
  TEST_FREQ: '-1'                  # eval offline on saved checkpoints (air/144), not inline

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: musique-grpo

max_retries: 0
timeout_minutes: 600

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/qa_musique/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/musique-grpo
  total_epochs: 2
  ppo_mini_batch_size: 32
  rollout_n: 16
  total_rollout_steps: 3200
  max_prompt_length: 2048
  max_response_length: 512
  actor_lr: 2e-6

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
