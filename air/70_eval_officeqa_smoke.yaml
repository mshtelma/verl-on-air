# =============================================================================
# OfficeQA agentic pipeline SMOKE — base Qwen3.5-35B-A3B on 24 questions.
#
# First end-to-end run of the NEW OfficeQA harness: validates data staging
# (bm25s install, corpus unzip, chunks copy), the in-job BM25 index build, the
# 4-tool agentic loop (search/read/list/calculator), <FINAL_ANSWER> extraction,
# and score_answer grading. If green -> air/71 runs the full 246-question baseline.
#
#   air run --file air/70_eval_officeqa_smoke.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-70-eval-officeqa-smoke
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v6

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '49152'          # multi-turn (16) + large table tool outputs; model ctx 262k
  EVAL_STAGE: '1'                  # bulk-copy model UC->NVMe
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: eval_officeqa_agentic.py

  OFFICEQA_STAGE: '1'              # install bm25s, unzip corpus, copy chunks to NVMe
  OFFICEQA_EVAL_CSV: /Volumes/main/mshtelma/verl/data/officeqa/officeqa_full.csv
  OFFICEQA_CORPUS_ZIP: /Volumes/main/mshtelma/verl/data/officeqa/treasury_bulletins_transformed.zip
  OFFICEQA_CHUNKS_SRC: /Volumes/main/mshtelma/verl/data/officeqa/chunks.jsonl
  OFFICEQA_SEARCH_TOP_K: '6'

  EVAL_LIMIT: '24'                 # smoke: first 24 (mixed hard/easy)
  EVAL_MAX_TURNS: '16'
  EVAL_MAX_TOKENS: '2048'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '24'
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/officeqa_smoke.json

max_retries: 0
timeout_minutes: 60

command: |
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
