# =============================================================================
# HARDER-DATA + LONGER RUN — fully-async GRPO on Qwen3.5-35B-A3B with a MULTI-TURN
# calculator tool-agent rollout and a self-hosted GLM-5.3 LLM-JUDGE reward, on
# competition MATH instead of GSM8K, for enough steps to actually watch it learn.
#
# WHY THIS EXISTS: air/53 proved the whole agentic-judge machinery works end-to-end
# (judge grades real trajectories, tools fire, clean SUCCESS), but on GSM8K the
# reward SATURATED — a 35B-A3B + calculator solves grade-school math ~95-100%, so
# critic/score sat at 0.94-1.0 with no trend and GRPO had ~no advantage variance to
# learn from. This run changes exactly two things to turn that into a real learning
# curve, and NOTHING about the validated infra:
#   (1) DATA: Hendrycks MATH, Levels 3-5 (air/56) -> base ~0.3-0.6 = headroom. Its
#       LaTeX answers also make the LLM judge (mathematical-equivalence grading)
#       genuinely better than an exact-match rule.
#   (2) LONGER: total_rollout_steps 256 -> 768 (~8 -> ~24 weight syncs), so the
#       reward/accuracy trend is observable. LR_DECAY_STEPS auto-tracks it.
# The per-sync training curve (critic/score, judge_score, acc) is logged to MLflow
# every sync, so learning is observable even if the job hits its timeout backstop.
#
# EVERYTHING ELSE IS VERBATIM air/53 (the proven config): 4 nodes / 32xH100 split
# by scripts/dispatch_agentic.sh on POD_RANK (ranks 0-1 train TP2/EP8 + GEN_TP8
# rollout; ranks 2-3 serve GLM-5.3 at TP16), HTTP judge over the UC rendezvous file,
# qwen3_coder tool parser, rollout-scoped --disable-custom-all-reduce, rate_limited
# reward manager + judge_reward.py, REWARD_MAX_CONCURRENT=64, STALENESS=0.5.
#
# CHANGED vs air/53: data paths -> math_tool; total_rollout_steps 256->768;
# JUDGE_MAX_LIFETIME 13800->28200 and timeout_minutes 240->480 (the judge must
# outlive a longer training loop; the training_done sentinel still stops it cleanly
# when training finishes first); JUDGE_DEBUG 1->0 (per-verdict dumps are too noisy
# over 24 syncs; the resolved-URL log + first-5-failure logs are NOT debug-gated, so
# a silent-fallback regression still can't hide). judge_reward.py now scores MATH
# answers by LaTeX equivalence (GSM8K numeric path unchanged; unit-tested).
#
# PREREQS: GLM-5.3 staged (air/51b) + MATH tool-agent data (air/56) + 35B model.
#
#   air run --file air/57_qwen3_5_35b_agentic_judge_math.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-57-qwen3_5-35b-agentic-judge-math
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 32          # 4 nodes x 8 H100 (2 training + 2 judge)
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v6

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'true'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  RAY_TEMP_DIR: /tmp/ray
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO

  # --- dispatcher: which ranks train vs serve the judge --------------------
  TRAINING_NODES: '2'                              # ranks 0-1 train; 2-3 judge
  RENDEZVOUS_ROOT: /Volumes/main/mshtelma/verl/rendezvous
  JUDGE_WAIT_TIMEOUT: '2400'                       # training waits this long for the judge endpoint

  # --- training topology (VERBATIM from the validated air/31 / air/53) -----
  ROLLOUT_NNODES: '1'          # 1 whole node Rollouter + 1 node Trainer (of the 2 training nodes)
  TP: '2'
  PP: '1'
  CP: '1'
  EP: '8'
  ETP: '1'
  GEN_TP: '8'                  # 1 vLLM replica, TP8 intra-node (NVLink)
  # Rollout CUDA graphs ON, but disable vLLM's custom all-reduce: at GEN_TP=8 with
  # multi-turn max_model_len=8192, graph capture crashes in the custom kernel
  # (custom_all_reduce.cuh:455; air/53 run 371030427696093). Rollout-scoped NCCL
  # fallback fixes it with graphs intact + no trainer impact (air/54 lever B).
  ROLLOUT_DISABLE_CUSTOM_ALL_REDUCE: 'True'
  OFFLOAD_FRACTION: '1'
  ROLLOUT_GPU_MEM_UTIL: '0.7'

  # --- fully-async: STALENESS 0.5 for train||gen||judge overlap ------------
  TRIGGER_SYNC_STEP: '2'
  REQUIRE_BATCHES: '1'
  STALENESS: '0.5'
  PARTIAL_ROLLOUT: 'True'

  # --- agentic multi-turn tool-calling (the calculator @function_tool) -----
  MULTI_TURN: 'True'
  MAX_TURNS: '4'
  # Qwen3.5 emits tool calls in its NATIVE XML form; verl v0.9.0's qwen3_coder
  # parser (Qwen3XMLToolParser) is the right one (proven air/55 + air/53 final:
  # decode_errors=0, num_turns up to 8). hermes json.loads'd the XML -> 120 decode
  # failures in run3.
  TOOL_FORMAT: qwen3_coder
  AGENT_NUM_WORKERS: '8'
  MAX_TOOL_RESPONSE_LEN: '512'
  # FUNCTION_TOOL_PATH + CUSTOM_REWARD_PATH are set by the dispatcher (HERE-relative).

  # --- LLM-judge reward via verl's rate_limited manager --------------------
  REWARD_MANAGER: rate_limited
  REWARD_SOURCE: judge         # optimise the judge's 0..1 score; rule = validation/fallback
  REWARD_MAX_CONCURRENT: '64'  # concurrent grading burst the TP16 judge continuous-batches
  REWARD_TIMEOUT: '120'        # verl-level asyncio timeout; MUST exceed JUDGE_TIMEOUT so OUR
                               # rule fallback fires first, not verl's hard 0.0.

  # --- judge CLIENT knobs (judge_reward.py, runs in the reward-loop actors) -
  JUDGE_MODEL: judge
  JUDGE_MAX_TOKENS: '4096'     # reasoning judge: room to think + emit the JSON verdict
  JUDGE_TIMEOUT: '90'          # aiohttp client timeout; < REWARD_TIMEOUT (see above)
  JUDGE_TEMPERATURE: '0'
  JUDGE_DEBUG: '0'             # OFF for the long run (per-verdict dumps are far too noisy
                              # over ~24 syncs). judge_reward.py STILL logs the resolved URL
                              # once and the first judge-call failures without this flag, so a
                              # silent-fallback regression (run3) still can't hide.

  # --- judge SERVER knobs (serve_judge.sh, ranks 2-3) ----------------------
  JUDGE_ENGINE: vllm
  JUDGE_MODEL_PATH: /Volumes/main/mshtelma/verl/models/GLM-5.3
  JUDGE_LOCAL_CACHE: /local_disk0/judge_cache      # per-node NVMe pre-stage (bulk cp off UC)
  JUDGE_TP: '16'                                    # 2 judge nodes x 8 H100
  JUDGE_RAY_VERSION: '2.48.0'                       # pin ray on judge nodes only (vllm#45318)
  JUDGE_MAX_MODEL_LEN: '16384'
  JUDGE_GPU_MEM_UTIL: '0.90'
  JUDGE_HEALTH_TIMEOUT: '2400'                      # first cross-node TP16 load of 744 GB
  JUDGE_MAX_LIFETIME: '28200'                       # backstop self-exit; RAISED for the longer
                                                    # run (< the 480-min job timeout). The
                                                    # training_done sentinel still stops the judge
                                                    # cleanly the moment training finishes first.
  # Graphs ON (no --enforce-eager): v6's nvrtc symlink fixed the capture JIT link.
  # serve_judge.sh always adds --disable-custom-all-reduce. glm47/--enable-auto-tool-choice
  # are inert for us (judge gets a plain chat request, no tools); glm45 handles its reasoning.
  JUDGE_EXTRA_ARGS: --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice

  PROJECT_NAME: verl-on-air
  EXPERIMENT_NAME: qwen3_5-35b-agentic-judge-math

max_retries: 0
timeout_minutes: 480          # judge load + 35B/vLLM init + ~24 syncs of multi-turn MATH
                              # rollout (MATH generations are longer/slower than GSM8K).

parameters:
  model_name: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  train_files: /Volumes/main/mshtelma/verl/data/math_tool/train.parquet
  val_files: /Volumes/main/mshtelma/verl/data/math_tool/test.parquet
  output_dir: /Volumes/main/mshtelma/verl/ckpt/qwen3_5-35b-agentic-judge-math
  total_epochs: 15             # data headroom; the rollouter stops at total_rollout_steps
  ppo_mini_batch_size: 16      # % train-DP(4) == 0
  rollout_n: 4
  total_rollout_steps: 768     # 768/32 = ~24 weight-sync cycles (3x air/53's 8 -> a real trend)
  max_prompt_length: 1024
  max_response_length: 1024    # per-turn; multi-turn episode = (1024+1024)*4 = 8192
  actor_lr: 1e-6               # validated value (safe); the obvious next lever if learning is slow

# AI Runtime runs this once per node; the dispatcher routes each POD_RANK to its role.
command: |
  bash ${CODE_SOURCE_PATH}/scripts/dispatch_agentic.sh
