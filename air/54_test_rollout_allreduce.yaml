# =============================================================================
# DE-RISK for air/53: reproduce the training-ROLLOUT vLLM crash on ONE 8xH100 node
# and test the two graphs-preserving fixes, so we don't gamble another 32-GPU run.
#
# air/53 run2 (371030427696093) got PAST config parse but died at vLLM CUDA-graph
# capture: `custom_all_reduce.cuh:455 'invalid argument'` (known vLLM H100 bug;
# vllm#42609/#43923/#40812). scripts/test_rollout_allreduce.sh spins up JUST the
# Qwen3.5-35B-A3B rollout engine at the air/53 shapes (GEN_TP=8, max_model_len
# 8192, graphs ON) under the launcher's exact env, and runs 3 variants:
#   V1 baseline (expandable_segments:True + custom AR)          -> expect CRASH
#   V2 lever A  (no expandable_segments + custom AR)            -> keep FAST kernel?
#   V3 lever B  (expandable_segments:True + --disable-custom-all-reduce) -> NCCL
#
#   air run --file air/54_test_rollout_allreduce.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-54-test-rollout-allreduce
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8           # 1 node x 8 H100 (intra-node GEN_TP=8 = the crashing topology)
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: INFO
  # Faithful rollout env (run_grpo_fully_async.sh:48-51). PYTORCH_CUDA_ALLOC_CONF is
  # DELIBERATELY NOT set here -- the test script sets/unsets it per variant.
  VLLM_USE_V1: '1'
  VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
  CUDA_DEVICE_MAX_CONNECTIONS: '1'

  ROLLOUT_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  ROLLOUT_TP: '8'
  ROLLOUT_MAX_MODEL_LEN: '8192'   # air/53's multi-turn episode budget (air/31 used ~3072 and did NOT crash)
  ROLLOUT_GPU_MEM_UTIL: '0.7'
  ROLLOUT_LOCAL_CACHE: /local_disk0/rollout_cache
  ROLLOUT_HEALTH_TIMEOUT: '600'   # NVMe load of 35B + TP8 shard + graph capture, per variant

max_retries: 0
timeout_minutes: 60             # stage once + 3 x (load + capture/crash)

command: bash ${CODE_SOURCE_PATH}/scripts/test_rollout_allreduce.sh
