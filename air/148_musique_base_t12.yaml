# =============================================================================
# MuSiQue BASE re-baseline at MAX_TURNS=12 (top_k=5) -- the apples-to-apples reference for air/147,
# AND the turn-probe. The original 52% base (air/141) was measured at 8 turns, but the base is
# turn-STARVED at 8 (47% of episodes hit the cap; 75% of its retrieval misses were still searching
# when cut off). So the fair reference for a 12-turn-trained model is the base ALSO at 12 turns, and
# base@8=52 vs base@12=? directly quantifies how much of the "headroom" was just an artificial turn cap.
#
# Identical to the air/146 harness except: top_k=5 (depth reverted), default tool char cap, and
# EVAL_MAX_TURNS=12. Same 200 MuSiQue-dev / same big index / greedy EM.
#   air run --file air/148_musique_base_t12.yaml -p df1 --watch
# =============================================================================

experiment_name: verl-on-air-148-musique-base-t12
mlflow_experiment_directory: /Workspace/Users/michael.shtelma@databricks.com/verl-on-air

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: michaelshtelma587/verl-megatron-air:v7

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - scripts

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OPENSSL_FORCE_FIPS_MODE: '0'
  OPENSSL_FIPS: '0'
  VLLM_LOGGING_LEVEL: WARN

  EVAL_MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  MODEL_PATH: /Volumes/main/mshtelma/verl/models/Qwen3.5-35B-A3B
  EVAL_TP: '8'
  EVAL_SERVE_LEN: '32768'
  EVAL_STAGE: '1'
  EVAL_HEALTH_TIMEOUT: '1800'
  EVAL_SCRIPT: eval_search_agentic.py

  QA_VS_ENDPOINT: wiki-qa-vs
  QA_VS_INDEX: main.mshtelma.wiki_qa_big_corpus_index
  QA_SEARCH_TOP_K: '5'             # k5 (depth reverted)
  QA_VAL_PARQUET: /Volumes/main/mshtelma/verl/data/qa_musique/test.parquet

  EVAL_LIMIT: '200'                # same 200 dev Qs for apples-to-apples
  EVAL_MAX_TURNS: '12'             # match air/147's training-time turn budget
  EVAL_MAX_TOKENS: '512'
  EVAL_MAX_CONT: '2'
  EVAL_TEMPERATURE: '0'
  EVAL_CONCURRENCY: '32'
  QA_REWARD_METRIC: em
  EVAL_OUT: /Volumes/main/mshtelma/verl/eval/musique_base_t12.json
  EVAL_TRACE_OUT: /Volumes/main/mshtelma/verl/eval/musique_base_t12_traces.jsonl

max_retries: 0
timeout_minutes: 120

command: |
  set -euo pipefail
  bash ${CODE_SOURCE_PATH}/scripts/serve_and_eval.sh
